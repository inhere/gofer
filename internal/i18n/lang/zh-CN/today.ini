# today 页（internal/today）由服务端生成、在 web 显示的卡片文本：标签、标题、摘要、
# 卡住说明与按钮文字。读时渲染的按请求语言（Accept-Language，否则 server.language）；
# 落库的（稍后记录）按 server 语言。占位符为命名形式。

[today.tag]
interaction = 提问
tool_approval = 工具审批
plan_question = 计划提问
permission = 需要授权
question = 等你回答
relay = 会话等回复
review = 待验收
approval = 待批准
mail = 信箱
plan_blocked = plan 阻塞

[today.action]
reply = 回复
confirm = 确认
cancel = 取消
allow = 允许
allow_always = 总是允许
allow_always_label = 总是允许：{label}
deny = 拒绝
deny_note = 附原因拒绝
ack = 已读
accept = 通过
rerun = 附意见重跑
diff = 看 diff
approve = 批准
details = 看详情
assign = 去指派
resume = 继续
open_plan = 打开 plan

[today.card]
interaction_title = {agent} 请求{what}
permission_what = 授权
mail_title = 信件 {n} 封待指派
mail_no_address = （无地址）
mail_summary = {origin} → {to}：{body}
mail_from_session = 会话 {id}
mail_from_job = job {id}
mail_from_caller = 调用方 {caller}
mail_from_unknown = 未知来源
plan_stuck = plan 停在失败的一项上，等你决定继续或改 todo

[today.blocks]
holding = 占着 {agent} {what} {duration}
session = 会话
lock_worktree = 占着 worktree
lock_dir = 占着目录锁
plan_after = plan {plan} 后面 {n} 项在等
plan_pending = plan {plan} 还有 {n} 项没开始
approval_wait = 等待批准才能开工
join = {a}；{b}

[today.duration]
minutes = {n} 分钟
hours = {n} 小时
days = {n} 天

[today.snooze]
until_time = 稍后到 {time}
until_job = 等 job {id} 结束

[today.status]
review_failed = 管家今日巡检失败
agent_unavailable = 管家 agent 不可用
runner_offline = runner {name} 离线

