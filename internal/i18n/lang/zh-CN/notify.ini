# Short texts of notifications: IM / webhook / desktop titles, bodies and link labels
# built by internal/notify and by the job service's notice senders. Background text:
# the language is the notification's project, else the server's.
# Values keep no leading / trailing whitespace (INI), so separators and newlines stay
# in the code; placeholders are named ({name}).

[notify.common]
link_default = 在 gofer 打开
truncated = …（已截断，完整内容见链接）
link_job = 查看 job
link_plan = 查看 plan
link_session = 查看会话
link_line = {label}：{url}

[notify.interaction]
default_summary = agent 请求人工确认
options = 选项：
title = 需要审批：{text}

[notify.approval]
reason = 理由：{reason}
what = 要执行：
expires = 过期：{time}（到时未批准即取消）
default_text = 一个 job 等你批准后才会执行
title = 待批准：{title}
link = 去批准

[notify.session_reply]
summary = 第 {turn} 轮 · {agent} · {project}
idle = 空闲将在 {time} 自动结束
title = 会话等你回复：{title}
link = 打开会话

[notify.session]
waiting_title = 会话等待回复 · {label}
waiting_link = 打开会话回复
attention_title = 会话需要确认 · {label}
attention_default = 会话在等待确认（权限或选择），需要回到终端处理。
handed_off_title = 会话已在 web 接管 · {label}
handed_off_text = 已用 `--resume` 起新进程接管该会话，请在该终端继续对话。
handed_off_link = 打开接管终端
released_title = 会话已释放接管 · {label}
released_text = 接管该会话的 job {job} 已结束（{reason}），会话回到原终端，可继续中继。
nudge_title = 会话催办已暂停 · {label}
nudge_text = 催办 {nudge} 已自动暂停：{reason}。会话恢复可达后可在会话抽屉里继续。

[notify.update]
title = gofer 有新版本 {latest}
text = 当前版本 {current}，最新版本 {latest}
link = 查看更新

[notify.job]
label_needs_review = job 等待验收
label_awaiting_approval = job 等待批准
label_interaction = job 等待确认
label_session_reply = 会话等你回复
headline = {label}：{title}
end_reason = 结束原因 {reason}
end_manual = 手动结束
end_idle = 空闲超时
end_max_session = 超过会话总时长
end_failed = 失败：{reason}

[notify.desktop]
open = 打开
merge_awaiting_approval = 个 job 等待批准
merge_needs_review = 个 job 等待验收
merge_interaction = 个 job 等待确认
merge_session_reply = 个会话等你回复
merge_other = 条通知（{type}）
merge_more = …另有 {n} 条
