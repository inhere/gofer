# `gofer memory` / `repo status` 打印的记忆文本（阶段 2，见
# docs/design/2026-10-27-i18n-design.md）。zh-CN 逐字保留迁移前的输出。
# 注意：prime.ini 的 [prime.memory_format] 是给 agent 读的注入文本，两者不混用。

[cli.tracker.memory]
expired = （已过期）
stale = （久未更新）
source = 来源 {source}
flags_head = flags: {count}（待复核；`gofer memory unflag {key}` 清除，改正文也会清除）
expires_in = {n} 天后过期
expires_expired = 已过期
kind_inferred = {kind}（由 prime 标签推断）
summary_derived = {summary}（自动摘取，建议 --summary 补写）
archived_at = 归档于 {age}

[cli.tracker.write]
summary_required = memory content is {n} chars (> {max}): --summary "<一句话：这条讲什么、什么时候该看>" is required

[cli.tracker.doctor]
flagged_detail = {count} 次 · 最近：{reason}
flagged_review = （复核后 `gofer memory unflag <key>`）
stale_marker = ⚠ 可能过期

[cli.tracker.scope]
confidence_high = 高
confidence_medium = 中
confidence_low = 低
basis_source = 来源 {source} 的 cwd 在 {dir}/ 内
basis_name = key 前缀 / 标签与子仓名 {dir} 匹配
basis_mention = 摘要 / 正文提到子仓名 {dir}

[cli.tracker.repo]
hooks_checked = 已检测
sync_unsynced = 未同步
sync_synced = 已同步
