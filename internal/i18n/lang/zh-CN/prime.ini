# Prime 与 tracker 上下文文本。用户自己写的 issue、记忆与 plan 内容不翻译。

[prime.header]
work_hint = 工作项：被要求汇报时运行 `gofer work report <id> --goal … --status … --blocker … --next …`（`gofer work ls` 可查 id）。
tracker_hint = 任务：`gofer issue ready|show <id>|update <id> --claim|comment <id> "…"|close <id>`；记忆：`gofer memory ls <关键字>`（搜 key+摘要+内容）/ `show <key>`（全文）/ `set <key> "…" --summary "一句话"`；tracker 改动用 `gofer repo status --changed` 看，不要 diff `.gofer/tracker/*.jsonl`。
memory_write = 写记忆：长期约定用 `--kind rule`（写现状不写进度）；阶段进度写 plan 交接说明或 `--kind handoff`（默认 14 天后过期）；正文超 200 字要 `--summary`。
takeover = 接手：issue 用 `gofer issue brief <id>`，plan 用 `gofer plan brief <id>`（上下文树、设计稿、相关提交、job / plan 与适用记忆一次拿齐）。
commit_local = 按功能点本地提交是默认授权；push 到远端需用户授权；`.gofer/tracker/*.jsonl` 的变化随功能点一起提交；提交前 `git status` 确认没有夹带无关文件。
commit_ask = 提交前先询问用户；push 到远端需用户授权；`.gofer/tracker/*.jsonl` 的变化随获批功能点一起提交。
commit_none = 本仓库不提交本次改动；push 到远端需用户授权。
handoff_heading = ## 进行中 plan 的交接说明
handoff_line =   交接说明 v{version}（{by}, {at}）：
plans_heading = ## 进行中 plan
handoff_cut = [交接说明已截断]

[prime.memory]
flag_hint = 发现注入的记忆 / 规则与实际不符时运行 `gofer memory flag <key> --reason "…"`（全局 / 项目记忆加 `--global` / `--project <p>`），不要静默绕过。

[prime.rules]
header = ## 必须遵守的规则（gofer 注入，优先于本任务的其它说明）

[prime.layout]
commit_heading = ## 提交策略
separator = ；
