index_heading = 记忆索引（{n} 条，按需 `gofer memory show <key>`）
index_more = 另有 {n} 条：`gofer memory ls <关键字>`
handoff_title = 交接（未过期，最新 {n} 条）
handoff_more = 另有 {n} 条：`gofer memory ls --kind handoff`
handoff_expiry = {n} 天后过期
truncated = [内容已截断：使用 gofer issue ls / gofer memory ls 查看全部]
scoped_cut_global = [全局/项目记忆已截断]

