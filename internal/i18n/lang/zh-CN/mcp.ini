# Short texts of the MCP surface (tool descriptions and the answers an agent gets
# back). Design 2026-10-27-i18n-design.md §4 / §11 (P1d).
#
# 完全用英文写的工具说明留在 Go 代码里（两种语言同一份文本）；只有带语言相关措辞的
# 说明 / 报错放这里，并且是整句（拆开会让任一语言读不通）。

[mcp.term]
today = 「今天」
as_advised = 「按建议：X」
adopt = 「采纳」
dismiss = 「忽略」
knowledge_section = 「## 可复用经验」
needs_review = 「⚠ 待复核（reason）」
leave_to_human = (高危/拿不准, 留给人处理)
relay = 带话
role_mention = @<agent 或 role>
digest_sections = 改动分组 / 风险 / 测试

[mcp.desc]
brief_issue = Handoff brief (接手包) of a repository issue — the same text as `gofer issue brief <id>`: the issue, its parent/siblings/deps, design docs that name it, related commits and code entries, linked jobs / plans, applicable memories and takeover hints. Read this first when taking over an issue. Uses the repository tracker of this process's cwd.
brief_plan = Handoff brief (接手包) of a plan — the same text as `gofer plan brief <id>`: fields, todos (status / deps / acceptance / job outcome), handoff note and a short brief of each issue it names.

[mcp.error]
leader_no_reject = a leader job cannot reject a delivery: 验收 is a human's call
project_scope_denied = project-scoped MCP(--project {scope}): 不能向 project {project} 提交
