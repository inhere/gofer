# 工作项（internal/work）发给会话的短文本与工作项状态名。
# 语言取工作项所属项目的语言（config.LanguageFor）。
# 「工作项」请求正文里的状态名与 statusLabels（web 上显示，阶段 3）同义，
# 中文值必须与 statusLabels 逐字一致。

[work.request]
handoff = 工作项 {item}「{title}」被标为{status}（请求 {request}），请写一段交接：做到哪了、卡在哪、回来后第一步。运行 `gofer work report {item} --request {request} --summary "<做到哪了>" --blocker "<卡在哪>" --next "<回来第一步>"`（不需要的字段可省略）。
report = 工作项 {item}「{title}」当前进展（请求 {request}）：运行 `gofer work report {item} --request {request} --goal "<目标>" --status <active|needs_me|waiting_resource|needs_onsite|review|parked> --blocker "<卡在哪>" --next "<下一步>" --summary "<做到哪了>"`（不需要的字段可省略；若已不再受阻请用 --status active）。

[work.status]
active = 进行中
needs_me = 等我
waiting_resource = 等资源
needs_onsite = 需现场
review = 待验收
parked = 已搁置
done = 已完成
dropped = 已放弃
