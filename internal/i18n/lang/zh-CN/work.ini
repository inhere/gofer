# 工作项（internal/work）发给会话的短文本与工作项状态名。
# 语言取工作项所属项目的语言（config.LanguageFor）。
# 「工作项」请求正文里的状态名与 statusLabels（web 上显示，阶段 3）同义，
# 中文值必须与 statusLabels 逐字一致。

[work.request]
handoff = 工作项 {item}「{title}」被标为{status}（请求 {request}），请写一段交接：做到哪了、卡在哪、回来后第一步。运行 `gofer work report {item} --request {request} --summary "<做到哪了>" --blocker "<卡在哪>" --next "<回来第一步>"`（不需要的字段可省略）。
report = 工作项 {item}「{title}」当前进展（请求 {request}）：运行 `gofer work report {item} --request {request} --goal "<目标>" --status <active|needs_me|waiting_resource|needs_onsite|review|parked> --blocker "<卡在哪>" --next "<下一步>" --summary "<做到哪了>"`（不需要的字段可省略；若已不再受阻请用 --status active）。
issue = 已转为 issue {id}
todo = 已转为待办 {id}

[work.status]
active = 进行中
needs_me = 等我
waiting_resource = 等资源
needs_onsite = 需现场
review = 待验收
parked = 已搁置
done = 已完成
dropped = 已放弃

# --- S3b: 服务端生成、落库进工作项日志的说明，与读时渲染的展示文本。
# 落库的（日志条目、请求账本原因）按工作项所属项目的语言生成一次；
# 读时渲染的（健康原因、摘要）按请求语言。占位符为命名形式。
# 以「：」结尾再拼接内容的行已把内容做成占位符（INI 值不保留首尾空白）。

[work.journal]
ask_sent = 已向会话 {session} 带话：{text}
dispatch_archive = 归档
dispatch_drop = 丢弃
mail_delivered = 信件 #{id} 已送达（{target}）
mail_answered = 信件 #{id} 收到回复：{summary}
mail_reply_unreadable = （回复内容未能读取）
mail_reply_missing = （回复内容未记录）
mail_target_session = 会话 {id}
mail_target_job = job {id}
reminder_sent = 已发送到期提醒（{reason}）
remind_time = 到了设置的提醒时间
remind_park = 搁置到期
req_undelivered = 请求 {request} 未能送达会话 {session}：{error}，改为整理
req_asked = 已请会话 {session} {what}（请求 {request}，{minutes} 分钟内回复）
req_what_report = 汇报
req_what_handoff = 写交接
req_answered = 会话已回复请求 {request}（{kind}）
req_summarize_timeout = 整理请求 {request} 超时未完成
req_no_response = 会话 {session} 未回应请求 {request}，已改为整理
suggestion_adopted = 采纳整理建议：{field}（来自 {by}）
suggestion_dismissed = 忽略整理建议：{field}（来自 {by}）
completion_todo = todo {ref} 已完成
completion_issue = issue {ref} 已关闭
completion_join = {a}；{b}
completion_note = {done}，建议把状态改为「{label}」（在工作项详情的建议区采纳或忽略，状态未自动改变）
completion_label_review = 待验收
completion_label_done = 完成
summary_failed = 整理失败：{error}
summary_done = 整理完成
summary_degraded = {text}（会话记录读不到，依据最后一条消息与进度）
summary_applied = {text}；已更新：{list}
summary_suggested = {text}；待采纳建议：{list}
summary_nothing = {text}；没有新内容
summary_cleared = {label}（已清除）
summary_list_join = {a}、{b}

[work.ledger]
summarize_interrupted = 整理超时或被中断
no_response = 会话未回应
request_timeout = 请求超时

[work.request_outcome]
job_session = ACP / 终端 job 会话不能被请求汇报，请在它的 job 页面里对话
session_gone = 会话记录已不存在
not_allowed = 无权向该会话传话
not_running = 会话未在运行（{state}），改为整理
no_channel = 未配置会话传话通道，改为整理
delivery_failed = 送达失败（{error}），已改为整理

[work.report]
goal = 目标：{value}
blocker = 阻塞：{value}
next = 下一步：{value}
summary = 摘要：{value}
park_note = 搁置条件：{value}
status_captured = 状态：想标为 {status}（收集箱条目，状态只能由收集箱入口改动，未采纳）
status_final = 状态：想标为 {status}（完成/放弃由人确认，未采纳）
status_unblocked = 状态：进行中（阻塞已解除）
status_human = 状态：想标为 {status}（已被人手动设置的状态优先，未采纳）
status_set = 状态：{status}

[work.derived]
waiting_reply = 会话等待回复
needs_attention = 会话需要处理（终端对话框）
job_interaction = 关联 job 有待应答交互
job_review = 关联 job 待验收
running = 会话运行中
plan_wait = 关联 plan {plan} 有待应答的 decision：{title}

[work.notify]
reported = {by} 汇报需要你处理
marked_needs_me = 被 {by} 标为「等我」
steward_marked_needs_me = 管家把它标为「等我」
remind_title = 工作项提醒 · {title}
needs_me_title = 等我处理 · {title}
open_item = 打开工作项
open_work = 打开工作页

[work.outcome]
who = job {id}
who_agent = {who}（{agent}）
who_title = {who}「{title}」
budget = {who} 预算熔断
failed = {who} 失败
failed_error = {text}：{error}
rejected = {who} 验收未通过
accepted = {who} 验收通过
done = {who} 完成
done_review = {text}，待验收
done_commits = {text}，{n} 个提交
cancelled = {who} 已取消
ended = {who} 结束（{status}）

[work.health]
plan_blocked = plan {plan} 阻塞
plan_quoted = 「{title}」
blocked = 阻塞：{blocker}
stalled = {quiet}没有活动
job_budget = 最近的 job {id} 预算熔断
job_failed = 最近的 job {id} 失败
quiet_days = {n} 天
quiet_hours = {n} 小时
quiet_minutes = {n} 分钟

[work.digest]
title = 工作摘要 · {date}
counts = 等我 {needs_me} · 等资源 {waiting} · 需现场 {onsite} · 待验收 {review}
parked_head = 搁置超过 7 天（{n}）：
yesterday_head = 昨日有进展（{n}）：
more = - …另外 {n} 项
item_status = {link}（{status}）
empty = 今天没有需要关注的工作项。
commentary = 管家点评：{text}

[work.suggestion_label]
goal = 目标
blocker = 阻塞
blocker_kind = 阻塞类型
next = 下一步
summary = 摘要
status_hint = 状态建议

[work.todo]
next = 下一步: {value}
source = 来源工作项: {id}
