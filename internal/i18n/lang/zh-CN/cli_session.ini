# `gofer session` 命令文案（阶段 2，见 docs/design/2026-10-27-i18n-design.md）。
# 每个值一行；换行与行首缩进由代码加。本文件逐字保留迁移前的输出。

[cli.session.flag]
inject_send_held = instead of setting a mode, send the messages waiting for this session right now (「现在送」)

[cli.session.list]
hidden = 另有 {count} 个超过 {days} 天未活动的会话已隐藏，用 --all 查看
maybe_offline = (可能不在线)

[cli.session.inject_mode]
auto_note = messages are typed only when the input area is confirmed empty; otherwise they wait for the session's next hook (the web page sends them with 「现在送」)

[cli.session.relay]
on_note = every stop now waits on the gofer web 会话 page until you reply there (/off releases it)
