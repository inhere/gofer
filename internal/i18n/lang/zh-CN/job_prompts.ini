# Agent-facing and user-visible text the job service writes outside the long
# prompt templates (prompts/): the leader round brief, the comment-dispatch brief,
# the skills / tools prompt sections and the wrap-up reasons. Placeholders are named
# ({name}); a value that starts or ends with a space is quoted.

[job.leader]
title = leader 回合 {round}：{title}
intro = 你是 plan {plan} 的 leader（第 {round} 轮）。一个成员 job 刚刚结束，请你读完它的汇报，决定下一步：派活、推进待办、建 wakeup，或者升级给人。
h_plan = ## Plan
plan_title = 标题：{title}
plan_status = 状态：{status}
paused = （已暂停）
blocked = （阻塞在 {todo}）
plan_goal = 目标：{goal}
h_todos = ## 待办链现状
h_member = ## 刚结束的成员 job
member_gone = （job {job} 已不在库里，只知状态 {status}）
h_can = ## 你可以做的（用 gofer CLI；权限由你的 job 凭证强制，越权会 403）
can_comments = - `gofer plan comments <plan>`：先读 plan / todo / job 的评论区，看看人和成员都说过什么。
can_comment = - `gofer plan comment <plan> "正文"`：在评论区说话；正文里写 `@<agent 或 role>` 会**真的派活**（你是本 plan 的 leader，你的 @提及生效）。加 `--todo <todo>` 可只评论某个待办。
can_show = - `gofer plan show <plan>`：读 plan 与待办现状。
can_set_todo = - `gofer plan set-todo <todo> --status ready|skipped`：把某个待办置 `ready`（已指派即派活）或 `skipped`；**只接受 ready|skipped**，其他状态会被服务端拒绝（403）。
can_wakeup = - `gofer job wakeup create <job> --kind at --after 10m`（或 `--kind event --event job.terminal`）：给某个 job 建定时/事件 wakeup。
can_ask = - `gofer plan ask --plan <plan> --title <标题> --question <问题>`：拿不准就升级给人（不阻塞；人回答后用 `gofer plan decisions --plan <plan>` 看答案）。
can_mcp = - 若你的环境里挂了 gofer MCP 工具，也可以用它们做同样的事：底层是同一枚 job 凭证，权限与上面的 CLI 完全相同。
h_cannot = ## 你不能做的
cannot_accept = - **不能** accept/reject：验收永远由人做；也不能把待办直接标 done。
cannot_other = - 不能改配置、不能提交新 job（`gofer job run`）、不能 push、不能替人做最终决定。
h_rules = ## 规则
rule_round = - 这是第 {round} 轮；轮次用尽后 gofer 会停止唤醒并升级给人。
rule_human = - 人一旦在评论区说话，本轮唤醒即被取消，由人接管；不要和人的决定抢时间。
rule_no_self = - 不要自己实现活：写清楚任务，用 @提及 或把待办置 ready 派给成员。
todos_failed = （待办读取失败）
todos_empty = （这个 plan 还没有待办）
todos_count = 共 {n} 项：
todos_more = … 还有 {n} 项
todo_assigned = （指派：{assignee}）
todo_assigned_after = （指派：{assignee}，依赖：{after}）
todo_after = （依赖：{after}）
exhausted_title = leader 轮次已用尽：{title}
exhausted_question = plan {plan} 的 leader 已用满轮次，最近一次成员 job 是 {job}（{status}）。请接手：继续推进这个 plan，或把它停下。

[job.comment]
reject = @{mention} 没有派发：{detail}
dispatch_intro = 你在一条评论里被 @ 点名接手工作（gofer 评论派活）。
body_label = 评论正文：
untitled = (无标题)
job_head = 被评论的 job：{id} {title}
plan_head = 被评论的 plan：{id} {title}
todo_head = 被评论的 todo：{id} {title}（plan {plan}）
status = 状态：{status}
job_error = （error: {error}）
report = 最近一次汇报（stdout 末尾 {n} 行）：
goal = 目标：{goal}
todos_head = 待办（{n} 项）：
note = 备注：{note}

[job.skills]
header = ## 可用技能（gofer 挂载，按需阅读）
footer = 先读与本任务相关的 SKILL.md，再动手。
desc_sep = ：

[job.tools]
header = ## 本机可用工具（gofer 注入，按需使用）
intro_worker = 本任务运行在 worker `{worker}` 上，以下工具已安装，可直接调用：
intro_local = 本任务运行的机器上已安装以下工具，可直接调用：

[job.wrapup]
max_steps = 步数上限（agent 自己收尾，任务可能未完成）
max_tokens = 用量上限（agent 自己收尾，任务可能未完成）
budget = 预算耗尽收尾（agent 自己收尾，任务可能未完成）
timeout = 时限（agent 自己收尾，任务可能未完成）
other = {reason}（agent 自己收尾，任务可能未完成）

[job.plan]
checkpoint_title = 检查点：{title}
