# Texts of HTTP error responses (design 2026-10-27-i18n-design.md section 3 / 5): the
# detail of a keyed error (httpapi writeErrorKey) is err.<code> in the request language,
# and web/src/i18n/pages/errors.ts carries the same sentences for the console. The
# `error` field stays a fixed phrase scripts match on; only phrases that were never
# fixed English ones are texts here (names ending in _error).

[err]
messenger_unavailable_error = 传话人不可用
messenger_unavailable = 该 server 没有启用会话传话（没有任务存储或传话配置）
messenger_no_resident_error = 该 runner 没有传话人
messenger_no_resident = 只有本机和 worker 类型的 runner 有常驻传话人
worker_offline_error = worker 不在线
messenger_no_worker_registry = server 没有接入 worker 注册表
messenger_worker_offline = worker {worker} 当前没有连接，无法列出它的会话
worker_too_old_error = worker 版本过旧
messenger_worker_too_old = worker {worker} 的协议版本是 v{have}，列出会话需要 v{need} 及以上；请先升级该 worker（gofer worker upgrade）
messenger_list_failed_error = 列出会话失败
messenger_worker_no_project = 该 worker 当前没有可用项目，无法派发列出会话的任务（先给它分配一个项目）
messenger_dispatch_failed = 派发列出会话任务失败
messenger_job_status = 任务 {job} 状态={status} exit={exit}
messenger_list_timeout = 列出会话任务 {job} 超时
workbench_turn_undeliverable = 会话当前无法接收消息：{reason}（{cause}）
workbench_turn_undeliverable_plain = 会话当前无法接收消息：{cause}
workbench_turn_no_open_turn = 会话当前无法接收消息：它没有在等待回复
workbench_turn_ended = 会话当前无法接收消息：会话已结束
undeliverable_ended = 会话已结束
undeliverable_no_runner = 会话没有登记执行机
undeliverable_no_project = 会话所在目录不属于任何已配置项目，无法派发传话人
undeliverable_no_messenger = 传话人执行器未配置
undeliverable_no_tmux = 会话不在 tmux 里，也没有其他可用的投递方式
undeliverable_handed_off = 会话已被接管，请先释放接管
undeliverable_inject_failed = 无法把消息输入终端（{cause}）
undeliverable_deliver_failed = 投递命令失败
undeliverable_unknown = 未知原因
steward_no_registry = 没有 agent 注册表
steward_agent_missing = agent "{agent}" 不存在（在 steward.agent 里改成已安装的 acp-agent）
steward_agent_not_acp = agent "{agent}" 不是 acp-agent（管家需要常驻的 ACP 会话）
agent_command_not_found = 本机没有找到该命令
steward_agent_unavailable = agent "{agent}" 不可用：{why}
tunnel_forwarder_too_old = 该转发进程版本过旧，不支持远程停止，请在 {host} 上 Ctrl+C
tunnel_worker_unknown = worker "{worker}" 状态未知；监听已启动，首次连接时按现有转发行为拨号
tunnel_worker_offline = worker "{worker}" 当前不在线；监听已启动，worker 重连后新连接才会拨号
session_approval_internal = a submitted job cannot carry its own approval policy; configure it per 收件 agent (mail.agents.<name>.approval) or per project (projects.<key>.approval)
today_advice_steward_only = only the steward (or a person) advises on 「今天」 cards
worker_upgrade_too_old = 该 worker 版本过旧，需要手动升级一次 (worker {worker} speaks protocol v{have}, remote upgrade needs v{need})
preview_disabled = 该 server 没有启用 job 预览（server.preview.enabled）
preview_job_not_running = job 当前不在运行，不能创建预览
preview_runner_unsupported = 预览只支持在 server 本机或 worker 上运行的 job；暂不支持 runner {runner}
preview_worker_outdated = worker {worker} 版本过旧，不能提供预览；请把它升级到协议 v{version} 或更高
preview_worker_offline = worker {worker} 当前离线，无法预览它的 job
preview_port_invalid = 端口必须在 1 到 65535 之间
preview_pool_exhausted = 预览端口池已满；请先撤销一个预览或扩大 server.preview.port_range
preview_not_active = 该预览已失效，不能续租；请重新创建
trigger_not_found = 没有这个名字的已启用触发器
trigger_unauthenticated = 触发器签名缺失或不匹配
trigger_replay_window = 触发器时间戳不在允许的时间窗内
trigger_rate_limited = 该触发器收到请求过快，请 {seconds} 秒后重试
trigger_body_too_large = 请求体超过该触发器允许的大小
trigger_header_too_large = 有请求头超过该触发器允许的大小
trigger_body_not_json = 请求体必须是 JSON 对象
trigger_body_unreadable = 无法读取请求体
trigger_input_invalid = 请求缺少该触发器需要的字段，或字段过大
trigger_event_id_invalid = 外部事件号过长
trigger_event_conflict = 该事件号已用于另一个不同的请求体
trigger_event_in_flight = 该事件正由另一个请求处理，请稍后重试
trigger_owner_denied = 触发器的 owner 当前不能提交 job
trigger_ceiling_denied = 触发器 owner 的上限不允许这个 job
trigger_request_invalid = 该触发器要启动的 job 不合法，请让运维检查触发器配置
trigger_unavailable = 触发器暂时不可用，请稍后重试
trigger_read_job_credential = job 凭据不能读取触发器配置
