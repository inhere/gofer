# Short texts of the job domain.
# One [section] per dotted key prefix, so the key the code asks for is
# "<file domain>.<section>.<name>" with the INI section carrying the prefix
# ("job.delivery.task" -> [job.delivery] task = …). Placeholders are named ({name}).

[job.delivery]
task = 任务
acceptance = 验收标准
commits = 提交
stats = 改动统计
verify = 验证
usage = 用量
review = 验收
details_summary = 完整任务说明
more_commits = …另 {n} 个
verify_reason = （{reason}）
review_passed = {by} 已通过
review_note = ：{note}
footer = 由 gofer 自动创建

[job.deadline]
minutes = {n} 分钟
seconds = {n} 秒

# --- S3e: job 服务写进记录给人看的文本（状态名、交付核验结论、待办备注、续接原因）与
# 返回给调用方的 submit / worktree 类错误。落库的（备注、评论、事件 reason）按项目语言
# （项目 > server.language）生成一次；没有请求语言可用的错误也用项目 / server 语言。
# 冒号后接内容的行已把内容做成占位符（INI 值不保留首尾空白）。

[job.status]
queued = 排队中
running = 运行中
awaiting_input = 等待输入
pending_interaction = 等待交互
done = 已完成
failed = 失败
cancelled = 已取消
timeout = 超时
recovering = 重启恢复中
needs_review = 等待验收
rejected = 已拒绝
waiting_dir = 等待目录锁
awaiting_approval = 等待批准
paused_for_update = 升级等待（新任务暂停启动）

[job.status_blank]
label = 未知状态

[job.check_comment]
unfinished = 交付核验未完成（保持原状态）：{error}
pass = 交付核验第 {round} 轮：合格。{summary}
resumed = 交付核验第 {round} 轮：不合格（{failed} 项未满足），已自动续接 {job}（第 {n}/{max} 次）。{summary}
resume_failed = 交付核验第 {round} 轮：不合格（{failed} 项未满足），自动续接未能提交（{error}），转入待验收。{summary}
failed = 交付核验第 {round} 轮：不合格（{failed} 项未满足），不再自动续接，转入待验收。{summary}

[job.todo_note]
needs_review = {job} 待验收
merged = {branch} 合入 {sha}
no_changes = {job} 完成，无改动
remote_job = {job} 远程 job，合并不经 gofer
awaiting_merge = {job} 已完成，待合并：分支 {branch}
delivery_pushed = {job} 已推送，待合并：分支 {branch}
delivery_pr_opened = {job} PR 已开，待合并：{url}
delivery_failed = {job} 交付失败，待处理：{error}
delivery_merged = {job} 交付已合入：分支 {branch}
discarded = {job} 的 worktree 已丢弃，未合并

[job.review_hint]
elided = …（前面 {n} 行已省略）

[job.errors]
policy_pending = worker {worker} 尚未应用策略（policy_pending, rev={rev}）
session_local_only = 持续会话目前仅支持本机 runner
session_protocol = worker {worker} 协议 v{version} 不支持持续会话，请升级
worker_restarted = worker 重启，持续会话已结束；可用 gofer job resume {job} 以 session/load 接续上下文
commit_not_remote = commit {sha} 不在远端 {remote}，先推送该提交，或改在 server 本机检查{reason}

[job.continue]
note = 未接续：{reason}，已开新会话
worktree_base = ；新 worktree 以前序分支 {branch} 为基
claimed_by_other = 已被其他项续接
claimed_by_self = 已由本项占用
pred_read_failed = 读取前序项失败：{error}
pred_missing = 前序项不存在
pred_not_done = 前序项状态为 {status}，未完成
pred_job_read_failed = 读取前序 job 失败：{error}
pred_no_job = 前序项没有已完成且带会话的 job
exec_no_resume = exec 不能续接会话
session_not_resumable = 前序会话不可续接：{error}
runner_differs = runner 不同或非本机（本项 {own}，前序 {pred}）
cwd_differs = 本项 cwd {own} 与前序 job 的 {pred} 不同
worktree_gone = 前序 job 的 worktree 已不存在
needs_delivery = 前序 job 需要自动交付
claim_failed = 占用续接位失败：{error}
chain_limit = 已连续接续 {n} 次
template_failed = 任务书渲染失败：{error}
config_unsupported = 配置不支持续接：{error}
agent_no_resume = agent {agent} 没有可用的会话续接方式
readonly_mismatch = 只读设置不一致（本项 {own}，前序 {pred}）
assemble_failed = 续接请求组装失败：{error}

# --- Diagnosis (job termination reason, `gofer job diagnose`, GET /v1/jobs/{id}/diagnosis).
# 终止原因标签说明 job 为何结束；next.<reason> 是该原因下给出的确定性建议。

[job.plan_driver]
level_later = 放权等级 {level} 该等级在后续版本支持；本版本只接受 record
level_unknown = 放权等级 {level} 不是 gofer 支持的等级（record）
budget_negative = 推进预算 {field} 不能为负数（0 = 不限）
budget_not_finite = 推进预算 {field} 必须是有限数值（0 = 不限）

[job.termination]
ok = 正常结束
agent_error = agent 执行失败
transient = 服务端临时错误（可重试）
stalled = 无输出超时（stalled）
interrupted = 被 gofer 重启中断
timeout = 超时
budget = 预算用尽
cancelled = 已取消
worktree_gone = worktree 已不存在
caller_disabled = 调用方已被禁用
session_ended = 会话已结束
unknown = 未知

[job.diagnose]
unknown_queued = gofer 没有记录该 job 的排队时刻
unknown_started = 该 job 没有开始执行
unknown_first_output = gofer 不记录首个输出的时刻
unknown_last_output = 该 job 没有自己的日志文件
unknown_ended = 该 job 尚未结束

[job.diagnose.stage]
queued = 排队
started = 开始
first_output = 首个输出
last_output = 最后输出
ended = 结束

[job.diagnose.next]
ok = 无需处理：job 正常结束。读汇报看结果即可。
agent_error = 工作本身失败：读错误与汇报，修掉原因后重新提交。换一个 agent 也会撞到同一个问题。
transient = 是服务端出错而非工作本身：可重试该 job，或续接它以保留上下文。
stalled = job 在 stall 窗口内没有任何输出，被看门狗杀掉：先重试；若再次卡住，说明服务端卡住或输出被吞掉了。
interrupted = 不是工作本身失败：gofer 服务在它运行时重启，job 被中断。直接重跑，或续接它以保留上下文。
timeout = 到达时限：调大 timeout_sec（或上限），或把任务拆成更小的 job。
budget = 撞到了 token / 费用 / 轮次上限：调大预算，或拆分任务。不改动就重试只会再烧一次同样的预算。
cancelled = job 是被有意取消的：如果这项工作仍然需要，重新提交即可。
worktree_gone = 该 job 要接续的 worktree 已不存在：应在主 checkout 里新起一个 job，而不是继续接续。
caller_disabled = 拥有该 job 的调用方已被禁用，工作从未执行：启用该调用方后重新提交。
session_ended = 持续会话因其自身生命周期结束（空闲超时或会话时长上限）：新起一个会话，若仍可续接则续接本会话。
unknown = gofer 没有记录这次结束的原因：先读错误、事件与日志，再作判断。
