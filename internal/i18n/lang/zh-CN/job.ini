# Short texts of the job domain.
# One [section] per dotted key prefix, so the key the code asks for is
# "<file domain>.<section>.<name>" with the INI section carrying the prefix
# ("job.delivery.task" -> [job.delivery] task = …). Placeholders are named ({name}).

[job.delivery]
task = 任务
acceptance = 验收标准
commits = 提交
stats = 改动统计
verify = 验证
usage = 用量
review = 验收
details_summary = 完整任务说明
more_commits = …另 {n} 个
verify_reason = （{reason}）
review_passed = {by} 已通过
review_note = ：{note}
footer = 由 gofer 自动创建

[job.deadline]
minutes = {n} 分钟
seconds = {n} 秒

# --- S3e: job 服务写进记录给人看的文本（状态名、交付核验结论、待办备注、续接原因）与
# 返回给调用方的 submit / worktree 类错误。落库的（备注、评论、事件 reason）按项目语言
# （项目 > server.language）生成一次；没有请求语言可用的错误也用项目 / server 语言。
# 冒号后接内容的行已把内容做成占位符（INI 值不保留首尾空白）。

[job.status]
queued = 排队中
running = 运行中
awaiting_input = 等待输入
pending_interaction = 等待交互
done = 已完成
failed = 失败
cancelled = 已取消
timeout = 超时
recovering = 重启恢复中
needs_review = 等待验收
rejected = 已拒绝
waiting_dir = 等待目录锁
awaiting_approval = 等待批准
paused_for_update = 升级等待（新任务暂停启动）

[job.status_blank]
label = 未知状态

[job.check_comment]
unfinished = 交付核验未完成（保持原状态）：{error}
pass = 交付核验第 {round} 轮：合格。{summary}
resumed = 交付核验第 {round} 轮：不合格（{failed} 项未满足），已自动续接 {job}（第 {n}/{max} 次）。{summary}
resume_failed = 交付核验第 {round} 轮：不合格（{failed} 项未满足），自动续接未能提交（{error}），转入待验收。{summary}
failed = 交付核验第 {round} 轮：不合格（{failed} 项未满足），不再自动续接，转入待验收。{summary}

[job.todo_note]
needs_review = {job} 待验收
merged = {branch} 合入 {sha}

[job.review_hint]
elided = …（前面 {n} 行已省略）

[job.errors]
policy_pending = worker {worker} 尚未应用策略（policy_pending, rev={rev}）
session_local_only = 持续会话目前仅支持本机 runner
session_protocol = worker {worker} 协议 v{version} 不支持持续会话，请升级
worker_restarted = worker 重启，持续会话已结束；可用 gofer job resume {job} 以 session/load 接续上下文
commit_not_remote = commit {sha} 不在远端 {remote}，先推送该提交，或改在 server 本机检查{reason}

[job.continue]
note = 未接续：{reason}，已开新会话
worktree_base = ；新 worktree 以前序分支 {branch} 为基
claimed_by_other = 已被其他项续接
claimed_by_self = 已由本项占用
pred_read_failed = 读取前序项失败：{error}
pred_missing = 前序项不存在
pred_not_done = 前序项状态为 {status}，未完成
pred_job_read_failed = 读取前序 job 失败：{error}
pred_no_job = 前序项没有已完成且带会话的 job
exec_no_resume = exec 不能续接会话
session_not_resumable = 前序会话不可续接：{error}
runner_differs = runner 不同或非本机（本项 {own}，前序 {pred}）
cwd_differs = 本项 cwd {own} 与前序 job 的 {pred} 不同
worktree_gone = 前序 job 的 worktree 已不存在
needs_delivery = 前序 job 需要自动交付
claim_failed = 占用续接位失败：{error}
chain_limit = 已连续接续 {n} 次
template_failed = 任务书渲染失败：{error}
config_unsupported = 配置不支持续接：{error}
agent_no_resume = agent {agent} 没有可用的会话续接方式
readonly_mismatch = 只读设置不一致（本项 {own}，前序 {pred}）
assemble_failed = 续接请求组装失败：{error}
