# brief, zh-CN: the handoff brief (issue / plan) and the post-compact refocus
# section. Design 2026-10-27-i18n-design.md §4 / P1f. Values are the text this code
# printed before the migration, character for character.

[brief.head]
brief = # 接手包 {kind} {id}

[brief.section]
note = （{note}）
truncated = [本节截断 {n} 行]
truncated_more = [本节截断 {n} 行：`{more}`]

[brief.note]
server = 未连接 server，本节跳过
server_reason = 未连接 server，本节跳过（{reason}）

[brief.hint]
title = 接手提示
commit_policy = - 提交策略：{policy}
rules_issue = - 本地提交 / push 规则与验证命令以「适用记忆」里的 rule 为准（`gofer repo prime` 有全集）。
rules_plan = - 本地提交 / push 规则与验证命令以 rule 记忆为准（`gofer repo prime`，或关联 issue 的 `gofer issue brief <id>`）。
memory_flag_mismatch = - 记忆 / 规则与实际不符：`gofer memory flag <key> --reason "…"`，不要静默绕过。
claim = - 开工前 `gofer issue update {id} --claim`；进展 `gofer issue comment {id} "…"`；完成 `gofer issue close {id} --reason "…"`。

[brief.field]
block = {label}：
description = 描述
acceptance = 验收标准
tags = 标签 {tags}
assignee = 指派 {assignee}
updated = 更新 {time}
project = 项目 {project}
progress = 进度 {done}/{total} todo
paused = 已暂停
blocked = 阻塞于 {todo}

[brief.issue]
title = issue
plan_comment = 已有方案评论（{time} {by}，共 {n} 行）：
more_lines = …（另 {n} 行：`gofer issue show {id}`）
comments = 评论（最近 {shown} / 共 {total}）：
no_acceptance = 验收标准：无验收标准
acceptance_hint = → 补写：`gofer issue update {id} --acceptance "…"`
plan_comment_above = （方案评论，见上）
close_reason = — 关闭：{reason}

[brief.tree]
title = 上下文树
parent = 父：{head}
siblings = 兄弟：
children = 子：
depends_on = 依赖：
blocked_by = 被依赖（等本 issue）：
linked = 被关联：
not_in_tracker = （不在本仓库 tracker）
empty = 无父 / 子 / 依赖

[brief.design]
title = 设计稿
parent_only = （只提到父 {parent}）
none = docs/ 下没有提到本 issue 或其父的文档

[brief.docs]
missing = （文件不存在）
file_start = （文件开头）

[brief.commit]
title = 相关提交
not_git = 不是 git 仓库，本节跳过
none = git log 中没有提到 {id}（或父 {parent}）的提交
none_inline = （git log 中没有提到 {id}（或父 {parent}）的提交）
more = - 另有 {n} 个：`{more}`
via = （经 {via}）
via_sibling = {sibling} 关闭说明
mentioned = issue 文本提到的文件：
entries = 代码入口（这些提交触及最多的文件）：
entries_ref = 代码入口（来自父 / 兄弟 issue 的提交；本 issue 尚无提交，仅供参考）：
symbols = 关键符号（这些提交新增 / 改动的 Go / TS / JS 函数，行号为当前工作区）：

[brief.work]
title = 相关 job / plan
read_failed = 读取 server 失败，本节跳过（{err}）
review = 评审：{note}
plan = - plan {id} [{status}] {title}（`gofer plan brief {id}`）
none = 没有关联本 issue 的 job，也没有提到它的进行中 plan

[brief.verify]
title = 本 issue 的验证命令
config_hint = `.gofer/tracker/config.yaml` 的 `brief.verify`
no_match = {hint} 没有匹配本 issue 代码入口的命令，验证命令见下方 rule 记忆
configured_note = - （按 {hint} 匹配代码入口；全量与其他约束以下方 rule 记忆为准）
derive_note = 无法从代码入口推导验证命令；可在 {hint} 按路径配置本仓库的命令，或见下方 rule 记忆
generic_note = - （由代码入口推导的通用提示；本仓库的验证命令可在 {hint} 配置，全量与平台相关的约束以下方 rule 记忆为准）
unit_package = 个包
unit_dir = 个目录
unit_file = 个文件
cap = 另有 {n} {unit}，按需补

[brief.memory]
title = 适用记忆
scope_global = 全局
scope_project = 项目 {project}
global_failed = 全局记忆读取失败：{err}
project_note = 项目记忆：{note}
scoped_note = 全局 / 项目记忆：{note}
rule_head = （规则）
handoff = （交接）
hint = gofer memory ls <关键字>
more = - 另有 {n} 条：`gofer memory ls <关键字>`
none = 无匹配记忆

[brief.todo]
title = todo
none = 还没有 todo
assigned = 指派 {name}
deps = 依赖：{list}
deps_join = ；
acceptance = 验收：{text}
conclusion = 结论：{text}
dispatch_failed = 派发失败：{err}

[brief.handoff]
title = 交接说明
read_failed = 读取失败（{err}）
none = 无；用 `gofer plan handoff {id} --set "…"` 写入

[brief.related]
title = 关联 issue
no_tracker = 当前目录没有仓库 tracker，无法解析 issue
none = plan 与 todo 里没有提到本仓库的 issue
more = - 另有 {n} 个
design_docs = 设计稿：{docs}
design_docs_join = ，
takeover = 接手：`gofer issue brief {id}`

[brief.prime]
plan = - {id} {title}（接手：`gofer plan brief {id}`）

[brief.refocus]
head_compacted = 上下文刚被压缩，以下是你压缩前在做的事（用每行末尾的命令接手）：
head_resumed = 会话刚恢复，以下是你之前在做的事（用每行末尾的命令接手）：
topic = 主题：{topic}
claims = 认领中的 issue：
inferred = [可能]
status = （{status}）
detail = （{detail}）
plans = 监督中的 plan：
jobs = 在等的 job：
mail = 未回的信件：
mail_from = 来自 {from}
mail_subject = ：{subject}
blocked = 阻塞于 {value}
next = 下一项 {value}
join = ，
