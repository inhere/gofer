# `gofer worker` / `gofer worker init` / `gofer worker doctor` 的运行时文案
# （阶段 2，docs/design/2026-10-27-i18n-design.md）。每个值一行、不含换行符。
# 本文件逐字保留迁移前的输出。

[cli.worker.upgrade]
pending = 升级进行中（目标 {version}，目标 sha256 {sha}）
succeeded = 已升级到 {version}（耗时 {took}）
rolled_back = 已回滚：{err}（仍运行 {from}，耗时 {took}）
failed = 升级失败：{err}（仍运行 {from}，耗时 {took}）
dir_not_writable = 无法自升级：目录 {dir} 不允许用户 {user} 写入（属主：{owner}）。请把 gofer 安装到用户可写目录（如 ~/.local/bin）并更新服务/启动脚本，或让 worker 以属主身份运行，或手工用 sudo 替换后重启 worker。

[cli.worker.daemon]
started = gofer worker({id}) 已后台启动 pid={pid} log={log}

[cli.worker.init]
registered = ✓ 已向 server 登记 worker {id}，管理员 token 未写入磁盘
connected = ✓ 连接 server {server}，协议 v{protocol}，可派给 {projects} 的项目 {count} 个
no_roots = warning: 没有可用的 roots 映射 —— 这台 worker 目前跑不了任何 server 项目；补上 --roots <from>=<to> 后重跑
agents_detected = 探测到 agents（已装 {count} 个）：
agent_missing = 未安装
agent_missing_hint = 安装命令：{command}（官方文档：{url}）
agent_missing_docs = 请查看官方安装文档：{url}
no_agents = 提示: 本机没有装任何可用的 agent CLI，生成的 worker 只能跑 exec job；装好后重跑本命令或手改 agents 段
token_env_failed = warning: 设置 {name} 失败：{err}
written = 已写入 {worker}、{env}
doctor_head = 运行 doctor：
doctor_failed = worker init: doctor 有 {count} 项失败，修好上面的项后重跑 `gofer worker doctor`
start_hint = 启动：gofer worker -d        (worker 常驻后台；Windows 登录自启任务仅服务端有脚本，worker 请用该命令或做服务)
online_warning = warning: server 上 {id} 已有一个在线的 worker —— 启动本机会顶掉它的连接并失败其 in-flight job；确认是要替换再启动
roots_explicit = 使用显式 --roots 映射 {count} 条（跳过推断）
root_missing_local = warning: 项目目录在本机不存在（映射后）：{path} —— 该 project 会派发失败，用 --roots 精确指定
root_state_ok = ✓ 存在
root_state_missing = ✗ 不存在
root_accept_prompt = {from} → {to}  [{state}]  接受? [Y/n/改] 
root_skipped = 已跳过 {from}（该前缀下的项目不会被派到本机）

[cli.worker.doctor]
no_worker_id = worker_id 未设置（必须等于 server.workers 里的一个键）
no_urls = server_link.urls 为空（worker 不知道连哪个 hub）
mode_policy = policy: {roots} roots, 当前生效 {projects} 个 project（server 下发，读自 policy 缓存）
mode_legacy = legacy: 本地 projects 段 {projects} 个 — 已废弃（策略改由 server 下发），迁移见 {doc}；本版本仍然生效
mode_empty = 无 roots（policy 模式）也无 projects（legacy）— 这台 worker 跑不了任何 job
connect_disabled = --connect=false：跳过 hub 注册握手（urls 只做了 TCP 可达检查）
url_parse_failed = {url}: url 解析失败: {err}
url_no_scheme = {url}: 缺少 scheme（应为 ws:// 或 wss://）
url_bad_scheme = {url}: scheme 必须是 ws:// 或 wss://（got {scheme}）
url_no_host = {url}: 缺少 host
url_host_failed = {url}: host {host} 解析失败: {err} — 容器内改用宿主 IP（如 192.168.65.254）
url_unreachable = {url}: TCP 不可达 {addr}: {err}
url_reachable = {url}: 可达（{addr}）
token_from_env = 来自环境变量 {name}（值不打印）
token_env_empty = {name} 为空：token 需从 <config-dir>/.env 或环境变量导出（值不打印）
token_inline = 来自 worker.yaml 的明文 token（建议改 token_env，避免密钥入库）
token_unset = token_env / token 都为空：只有 server 端同样未启用鉴权时才能注册上
root_from_empty = {from} -> {to} (from 不能为空)
root_to_empty = {from} -> (to 不能为空)
root_dup_from = 重复的 from: {from} (每个 from 只能映射一次)
root_to_missing = {from} -> {to} (to 目录不存在或不是目录)
root_to_unreadable = {from} -> {to} (to 目录不可读: {err})
guards_unset = 护栏未设置 = 不额外收紧（exec/interactive 全放行）；建议显式声明 allow_exec / allow_interactive
max_concurrent_set = {value}（hub 侧 in-flight 上限）
max_concurrent_unset = 未设置（hub 侧不限并发）；建议按本机 CPU/内存设一个值
tools_none = 未声明（job prompt 不带本机工具清单）
tools_missing = 声明 {declared} 个，本机找不到 {missing} 个: {names}
tools_ok = 声明 {declared} 个，可执行文件均已找到
connect_skipped = 本机已有 worker {id} 在运行（pid {pid}）：跳过注册探测，探测会顶掉它在 hub 上的连接并失败其 in-flight job；注册结果看日志 {log}，确需试连先 `gofer worker stop {id}`
connect_no_urls = server_link.urls 为空，无法试连
connect_rejected = {url}: 注册被拒: {reason}
connect_failed = 所有 hub 地址都试连失败: {failures}
dial_401_hint = （401：token 被 hub 拒绝 — 核对 server_link.token_env 解析出的值与 server.workers.<worker_id>.token 是否一致）
verdict_failed = FAILED — {failures} check(s) failed, {warnings} warning(s)
verdict_warn = OK — 0 failed, {warnings} warning(s)
verdict_ok = OK — all checks passed
