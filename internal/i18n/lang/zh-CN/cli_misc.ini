# `gofer steward` / `work` / `mcp` 与双模式错误文案（阶段 2，见
# docs/design/2026-10-27-i18n-design.md）。每个值一行；换行与行首缩进由代码加。
# zh-CN 逐字保留迁移前的输出。

[cli.dual]
no_server_config = 本机没有 server 配置（运行模式={mode}），且连接 server 失败：

[cli.mcp]
project_auto_unresolved = --project auto: 无法从 CWD({cwd}) / .gofer.project.yaml / GOFER_PROJECT 解析 project

[cli.steward]
observations_desc = 列出管家的主动巡检本来会做的事（只记录模式：没有改任何状态、没有发任何消息）
observations_limit_flag = 最多几行（默认 50）
observations_none = 没有记录：主动巡检没有提出过写操作

[cli.steward.ask]
question_arg = what to ask, e.g. "我手上还有什么没完成？"
asked_nowait = asked (job {job}); the reply streams in the web 「问管家」 panel or `gofer job logs {job}`

[cli.steward.status]
state_running = running（正在处理一轮）
state_idle = idle（空闲，随时可问）
state_not_started = not_started（未启动：有人问或到巡检时间会自动启动）
review_summary = 点评：{text}
off_note = The steward is off. Enable it and pick an acp-agent on the settings page (设置 → 工作 → 管家).

[cli.auth.caller]
file_write_note = 注意：这个用户声明在配置文件里，改动已写回该文件——`server:` 块会被重新生成，块内的注释会丢失（与其他 server 字段的写入一致）。

[cli.work]
all_flag = include done / dropped items and items merged into another (shown as "已并入 <id>"); same set `work rm --status` previews
park_note_arg = condition, e.g. "到货后继续"
merged_into = （已并入 {id}）
report_id_arg = 工作项 id（省略：会话汇报自己的工作项；首次汇报会创建它）
report_title_flag = 首次汇报时创建的工作项标题（默认取 --goal 的第一行）
archive_desc = 归档所有自动生成且没人动过的工作项（一次性清理旧的会话草稿）；不加 --yes 只预览
archive_yes_flag = 确认归档（不加则只列出并报错）
archive_dry_flag = 只列出将被归档的工作项
archive_none = 没有可归档的工作项
archive_preview = 将归档 {n} 个工作项
archive_confirm = work archive-auto 会把这些工作项关闭：加 --yes 确认（或 --dry-run 只列出）
archive_done = 已归档 {n} 个工作项

[cli.doctor]
desc = 收集可安全分享的脱敏诊断包
help = 只导出脱敏后的排障信息；不要包含提示词、消息或记忆。
examples = gofer doctor --bundle --output diagnostics.zip
output_flag = 诊断 zip 路径（默认：./gofer-diagnostics-<时间>.zip）
print_flag = 只打印清单与摘要，不创建 zip
bundle_flag = 创建诊断 zip（默认开启，可供脚本显式指定）
lines_flag = 每份日志的最近行数（1..10000）
worker_config_flag = worker 模式下的配置路径（默认：<配置目录>/worker.yaml）
print_required = 如不打包请用 --print
lines_invalid = --lines 必须在 1 到 10000 之间
summary = gofer 诊断清单（不含提示词、消息、记忆与 token 原值）
unavailable = 不可用
created = 诊断包：{path}
contents = 内容清单：

[cli.refs]
desc = 列出引用某个 issue、job、plan、todo 或 workflow 的对象
help = 对象类型由 id 前缀推断（gofer-、job-、plan-、todo-、wf-），每个引用来源输出一行。
examples = gofer tool refs gofer-abcd
id_arg = 被引用对象的 id
bad_id = refs 需要以 gofer-、job-、plan-、todo- 或 wf- 开头的 id
none = 没有对象引用 {id}

[cli.tool]
desc = 小工具集：直接调用 API、与 worker 之间复制文件、传输暂存区、证书和统计回填
deliver_desc = 运行从标准输入读取的交付计划（内部使用）

[cli.tool.api]
desc = 调用 server 的 HTTP API 并打印响应（自动带上地址和 token）
help.p1 = 路径相对于 server 的 /v1 API，因此 "jobs" 与 "/v1/jobs" 是同一个请求。地址和 token 的来源与 CLI 其他命令一致（-c / --server / --token，或 $GOFER_CONFIG_DIR/.env），不必重复输入。
help.p2 = 字段用来组装请求体（{json}）；GET 请求里改作查询参数。值能按 JSON 解析时按 JSON 读取（10 → 数字，true → 布尔），否则按普通字符串：
help.p3 = --query 按路径（top.sub、jobs.0.id、jobs.*.id）取出 JSON 响应里的一个值：字符串原样打印，其他类型按缩进 JSON 打印。非 2xx 响应以非零状态退出，并把响应体打印到 stderr；--include 同时显示状态行和响应头。
help.file_comment = 文件内容作为字符串
request_flag = HTTP 方法（缺省：GET；带请求体时为 POST）
field_flag = key=value 形式的字段（可重复；GET 时作为查询参数）
file_field_flag = key=@file 形式的字段，取文件内容作为字符串值（可重复）
input_flag = 从该文件读取原始请求体（'-' 表示读标准输入）
query_flag = 只打印 JSON 响应中该路径的值，而不是整个响应体
include_flag = 同时打印状态行和响应头
path_arg = API 路径，如 jobs 或 /v1/jobs/abc

[cli.tool.step]
desc = 运行内置工作流步骤，从标准输入读取其 with: 块（内部使用）
with_flag = JSON 形式的 with: 块（缺省：读标准输入）
dir_flag = 工作目录（缺省：当前目录）
name_arg = 内置步骤名（push、wait-ci、wait-assets）

[cli.tool.stats_backfill]
desc = 为记录统计之前就已结束的 job 补算看板的逐 job 指标
since_flag = 只处理在该时间窗口内（如 30d、12h）或自 YYYY-MM-DD 起结束的 job；缺省全部
limit_flag = 每批向 server 请求的 job 数（1-1000）
force_flag = 重新计算已有指标的 job

[cli.tool.trigger]
desc = 入站触发器：查看（已脱敏）并自测外部 invoke 入口
none = 该 server 没有配置触发器
name_arg = 触发器名称（server.triggers[].name）
name_required = 需要给出触发器名称
ls.desc = 列出 server 的触发器及其状态、最近一次投递
ls.header = NAME,OWNER,PROJECT,TEMPLATE,STATE,LAST DELIVERY
state_ready = 可用
state_disabled = 已禁用
state_unavailable = 不可用（{reasons}）
show.desc = 查看一个触发器（已脱敏：只显示密钥变量名和是否已设置，不显示值）及其最近的投递
show.deliveries_flag = 列出最近多少条投递（0 为不列）
show.name = {name}  [{state}]
show.target = owner caller：{owner}  项目：{project}  模板：{template}  provider：{provider}
show.auth = 认证：{kind}  密钥变量：{env}（{secret}）  请求头：{ts} / {sig}  重放窗口：{window} 秒
show.secret_set = 已设置
show.secret_unset = server 上未设置
show.no_dedup_key = 无（仅 Idempotency-Key）
show.dedup = 去重键：{key}  有效期：{ttl} 秒
show.rate = 限流：{per_minute}/分钟  突发：{burst}  最大并发：{inflight}（0 表示只受 owner caller 的限制）
show.limits = 上限：请求体 {body} 字节  变量 {var} 字节
show.issue = 不可用：{reason}
show.deliveries = 最近的投递（{count} 条）：
invoke.desc = 给请求体签名并 POST 到触发器的 invoke 入口（自测用；不发送 gofer token）
invoke.help = 请求体用触发器的密钥按 HMAC-SHA256 对 "<时间戳>\n<请求体>" 签名。密钥来自你指定的环境变量（--secret-env）或 stdin 的第一行（--secret-stdin），不会从命令行参数取，也不会打印。请求不带 gofer token：签名就是凭据。
invoke.body_flag = JSON 请求体文件（'-' 读 stdin）
invoke.id_flag = 外部事件号，作为 Idempotency-Key 请求头发送（重复的事件号返回第一次的结果）
invoke.secret_env_flag = 存放触发器密钥的环境变量名
invoke.secret_stdin_flag = 从 stdin 第一行读取触发器密钥
invoke.header_flag = 额外请求头 Name=Value（可重复），例如触发器的 dedup.key 或 input.vars 读取的头
invoke.timestamp_header_flag = 时间戳请求头名（触发器的 auth.timestamp_header）
invoke.signature_header_flag = 签名请求头名（触发器的 auth.signature_header）
invoke.body_required = 需要 --body
invoke.secret_source = 密钥必须只来自一个来源：--secret-env <NAME> 或 --secret-stdin
invoke.stdin_twice = stdin 不能同时提供请求体和密钥
invoke.secret_read = 无法从 stdin 读取密钥
invoke.secret_empty = 密钥为空（环境变量未设置或 stdin 为空）
invoke.bad_header = --header 必须是 Name=Value（收到 "{header}"）
invoke.body_too_large = 请求体超过任何触发器允许的大小（{max} 字节）
invoke.accepted = 已受理：触发器 {trigger}  job {job}  请求 {request}
invoke.duplicate = 重复投递（已知结果）：触发器 {trigger}  job {job}  状态 {status}  请求 {request}

[cli.tool.bgagent]
desc = 后台 agent（整理器、管家、交付核验）：查看会话与当日统计，手动新开会话
kind_arg = 后台 agent 类型：summarizer、steward 或 job_check
kind_required = 需要给出后台 agent 类型（summarizer、steward 或 job_check）
context_unknown = 未知
ls.desc = 查看每类后台 agent 的会话与当日统计
ls.help = 只读。“context”是会话上下文窗口的占用比例；agent 没有上报窗口时显示“未知”。统计只计入上报了用量的运行。
ls.json_flag = 以 JSON 输出带版本号的响应
ls.header = KIND,SESSIONS,RUNS TODAY,BLOCKED,TOKENS,COST USD,LAST
ls.session = {kind}：会话 {id}  项目：{project}  agent：{agent}  运行：{runs} 次  上下文：{context}
reset.desc = 让某类后台 agent 的下一次运行新开会话
reset.help = 结束该类型已记录的会话（所有项目）。不改配置，保留历史与用量，也不会中断正在进行的运行：新会话从下一次运行开始。
reset.done = {kind}：已重置 {count} 个会话；下一次运行将新开会话
