# `gofer seat` 命令文案（设计 2026-11-18 常驻会话 §4）。
# 一行一条；换行与缩进由代码补。

[cli.seat]
desc = 常驻会话（seat）：项目里长期的工作位置；把会话绑上去，之后每次启动都注入它的章程
arg.name = 常驻会话名字（项目内唯一）
arg.seat = 常驻会话名字；跨项目用 name@project
flag.project = 只看一个项目（默认取当前目录所在项目）
flag.purpose = 一句话用途
flag.charter = 常驻约定正文，或 @<仓库相对路径> 指向存放它的文件
flag.charter_template = 用内置章程模板代替 --charter（flow：设计 → 评审 → 计划 → 实施 → 验证）
flag.kind = terminal（agent 终端会话）| acp（gofer 会话 job），默认 terminal
flag.agent = 该位置的 agent key（默认取坐着的会话）
flag.cwd = 该位置的目录（默认当前目录）
flag.ref = 会话 id（terminal）或 job id（acp）；默认取当前目录的会话
flag.replace = 从正坐着的会话手里接过这个位置
bind.charter_sent = 已向会话送去章程（它正在跑着，不用等下次启动）
bind.charter_failed = 章程没送进去（{reason}）；位置已绑好，下次启动或再 bind 一次会再送
flag.shell = 打印哪种命令写法：sh | ps（默认本机的）
flag.restart = 把已结束的 ACP 会话重新起起来
flag.archived = 连归档的一起列出
flag.all = 列出所有人的（需要 seat.manage.others）

[cli.seat.ls]
desc = 列出一个项目的常驻会话：名字、类型、状态，以及各自坐着的会话
empty = 还没有常驻会话；用 `gofer seat add <名字> --purpose "..."` 建一个

[cli.seat.add]
desc = 建一个空位（它带着一个目录、一个用途和一份章程）

[cli.seat.show]
desc = 看一个常驻会话：状态、当前会话、用途与章程

[cli.seat.set]
desc = 改常驻会话的用途 / 章程 / agent（用 "-" 清空某个字段）

[cli.seat.rm]
desc = 归档常驻会话（名字重新可用，历史保留）

[cli.seat.bind]
desc = 把一个会话放进这个位置（默认当前目录的会话）；下次启动起注入它的章程

[cli.seat.unbind]
desc = 让出这个位置（会话仍注册着，只是不再坐在这个位置上）

[cli.seat.open]
desc = 打印怎么回到这个位置：要敲的命令、在哪台机器上敲（acp 类型给工作台线程）

[cli.seat.schedule]
desc = 按 cron 定时给某个 seat 送一段话（送给到点时坐在里面的会话）；加 --ls 列出这个 seat 的定时
flag.cron = 5 段 cron 表达式，决定何时送
flag.text = 要送的话；会带「定时消息」前缀，让会话知道它从哪来
flag.title = 定时任务的名字（默认用 seat 名）
flag.ls = 列出送往这个 seat 的定时，而不是新建
need = 需要 --cron 和 --text（或用 --ls 列出）
created = 定时 {id} 已建好：按「{cron}」送到 seat {seat}
empty = seat {seat} 还没有定时
note = 终端会话离线时什么都不会送：这段话不会排队，「等我」里会出现一张卡请你去打开 seat。删除定时用 `gofer schedule rm <id>`。
