# Display texts the HTTP handlers produce that are not errors: permission presets,
# the capture-box persona, the notification test message, stored one-liners.

[httpapi]
preset_tunnel = 隧道使用
preset_release = 发版升级
preset_answer = 代答（人用）
preset_readonly = 只读他人
mail_agent_ended_by_hand = 手动结束（web / CLI）
mail_box = 收集箱
mail_box_of = {name} 的收集箱
notify_test_title = gofer 通知测试
notify_test_text = 这是一条来自 gofer 的测试消息（设置 · 通知 → 发送测试）。
notify_test_link = 打开设置
tracker_sync_done = 同步完成：issues={issues} memories={memories}
tunnel_this_machine = 该机器
relay_status_detail = {status}：{reason}
inbox_job_failed = {id} 失败
inbox_child_wake_failed = 子任务 {child} 的结果送不到 {parent}
inbox_child_wake_reason_parent_ended = 常驻父任务已结束，回执无人接收
inbox_child_wake_reason_expired = 回执已过期，子任务才结束
handed_off_just_now = 刚刚
handed_off_notice = 该会话已于 {when} 在 web 接管（job {job}），继续请在 web 终端或 --resume；本终端的中继已停用
inject_job_gone = job 记录已不存在

[httpapi.summarizer]
no_registry = 没有 agent 注册表
agent_missing = 整理器 agent {agent} 不存在（在 work.summarizer_agent 里改成已配置的 cli-agent）
not_cli_agent = 整理器 agent {agent} 不是 cli-agent（一次性只读整理需要 cli-agent）
no_read_only = 整理器 agent {agent} 没有只读模式（给它配 agents.{key}.read_only_args；claude / codex 已内置）
unavailable = 整理器 agent {agent} 不可用：{why}
command_not_found = 本机没有找到该命令
no_project = 整理 job 没有可用的项目：在 work.summarizer_project 里指定一个项目，或在配置里保留 default 项目
timeout = 整理 job 超时
failed = 整理 job 未成功（{reason}）

[inbox.waiting]
approval = 待你批准
answer = 待你回答
review = 待你验收
plan_stuck = 计划卡住，等你处理
failed = 你提交的任务失败了
delivery = 投递待你确认
