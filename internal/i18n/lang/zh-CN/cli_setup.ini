# `gofer init` / `gofer config` 的运行时文案（阶段 2，docs/design/2026-10-27-i18n-design.md）。
# 每个值一行、不含换行符（行首缩进与换行由代码加）。本文件逐字保留迁移前的输出。

[cli.setup.init]
worker_global = 已生成全局 worker 配置 {path}，编辑后直接运行 `gofer worker` 即可(自动发现该路径)
worker = 已生成 worker 配置 {path}，编辑后运行 `gofer worker --worker-config {path}` 启动
server = 已生成 {path}，编辑后运行 `gofer config validate` 校验
server_global_hint = 提示: export GOFER_CONFIG={path} 后任意目录可用
client_env = 已生成客户端节点 .env {path}，填入 GOFER_SERVER_ADDR/GOFER_SERVER_TOKEN 后即可用 `gofer job list` 等命令
client_env_lang = 这个节点的 CLI 输出语言: en 或 zh-CN（去掉下一行前面的 # 生效；不设则跟随系统语言）
workspace_hint = 默认工作空间 {dir} 已就绪：把它登记为 server 上的 `{project}` 项目（allowed_runners 含本 worker 的 runner）后即可承接无仓库的活
workspace_comment_1 = 默认工作空间：临时的、不属于任何仓库的活的安全落脚处(可用 --workspace /
workspace_comment_2 = GOFER_WORKSPACE 改路径)。`job run` 不带 -p 且当前目录匹配不到任何项目时回落到它。
worker_redirect = `gofer init worker` 不再运行 worker 接入向导；请改用：{command}
[cli.setup.hooks]
skip_jcode = 跳过 jcode: 它没有项目级 hook 配置 (加 --global, 或 -o <JCODE_HOME 目录>)
skip_agent_missing_dir = 跳过 {agent}：未发现 {dir}
skip_prime_only = 跳过 {agent}: 没有 SessionStart 记忆注入 (--prime-only 只适用于 claude / codex)
memory_removed = 已从 {path} 移除 {agent} 的记忆注入 (SessionStart / PreToolUse, {count} 条)
memory_written = 已在 {path} 写入 {agent} 的记忆注入 (SessionStart / PreToolUse, {count} 条)
hooks_removed = 已从 {path} 移除 gofer 的 {agent} hooks ({count} 条)
hooks_created = 已生成 {path} 并写入 gofer 的 {agent} hooks ({count} 条)
hooks_merged = 已合并 gofer 的 {agent} hooks 到 {path} ({count} 条, 替换旧条目 {replaced})
note = 注意: {note}
tip = 提示: {tip}
relay_usage = 用法: 离开电脑前 `gofer session relay on`; web「会话」页可查看/回复; 回来后终端输入任意一条即自动关闭 (或 web 回复 /off)
duplicates_head = 注意: 下列项目已有项目级 gofer hooks, 与全局 hooks 并存会让同一事件触发两次 (claude 对相同命令会去重, 其余请按未去重处理); 建议清理项目级:

[cli.setup.skill]
skip_missing_dir = 跳过：未发现 {dir}
no_dest_dir = 没有可写入的 skill 目录（-a all 只写已存在的 agent 配置目录）；要创建请去掉 -a all
installed = 已安装 gofer-usage skill 到 {path} ({count} 个文件):
global_hint = 提示: 全局 skill 对所有项目可见

[cli.config.show]
diagnostic_note = (诊断视图: overlay 须在 serve 同机/容器内可读才生效; 否则仅显示全局值)

[cli.config.validate]
policy_projects = projects 由 server 下发; 当前生效 {count} 个 (读自 policy 缓存{note})
no_projects = 无 roots(policy 模式) 也无 projects(legacy) — 这台 worker 跑不了任何 job
legacy_projects_deprecated = `projects:` 段已废弃(策略改由 server 下发)，迁移见 {doc}; 本版本仍然生效
roots_empty_policy = policy 模式需要至少一条 root (roots 为空)
root_from_empty = from 不能为空
root_to_empty = {from} -> (to 不能为空)
root_dup_from = 重复的 from: {from} (每个 from 只能映射一次)
root_to_missing = {from} -> {to} (to 目录不存在或不是目录)
roots_overlap = {longer} 覆盖 {shorter} 下的更长路径 (最长前缀/更具体者优先)
guards_unset = 护栏未设置 = 不额外收紧(exec/interactive 全放行); 建议显式声明 allow_exec / allow_interactive
policy_cache_error = , 缓存不可用: {err}
policy_no_cache = , worker 未运行或尚未收到 Policy

[cli.config.trigger]
line = owner={owner} project={project} template={template}
disabled = 已禁用 (要启用请设置 enabled: true)
unavailable = 在这台机器上不可用: {reasons}
secret_env_unset = 密钥环境变量 {name} 未设置 (所有请求都会因认证失败被拒绝)
template_not_found = 项目下找不到模板 {name} (所有请求都会被拒绝)
