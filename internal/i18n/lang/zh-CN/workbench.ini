# 工作台（internal/workbench）给人看的文字：附图的投递路线说明、diff 提示，
# 以及送给 agent 的附图行。语言取请求语言；附图行取会话所属项目的语言。

[workbench.attach]
pty = pty 会话不支持附图
agent_unnamed = 该 agent
no_image = {agent} 暂不支持读取图片
no_runner = 会话没有执行机信息
ended = 该会话已结束，不能继续发送
runner_default = 执行机
own_dir = 会话没有项目，worker {runner} 不能接收附件（未连接或版本过旧，请升级并重启该 worker）
marker = [附图 {n}] {path}
marker_relative = [附图 {n}] {path}（相对于项目 {project} 根目录）

[workbench.diff]
captured_notice = 只含最新一轮采集结果
