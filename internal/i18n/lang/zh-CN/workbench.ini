# 工作台（/workbench）附图不可用的原因，出现在 📎 的悬停提示与发送失败的原因里
# （GET /v1/workbench/threads 的 attachments_reason）。语言取会话所属项目的语言
# （config.LanguageFor），会话不属于任何项目时取 server.language。

[workbench.attachments]
pty = pty 会话不支持附图
agent = {agent} 暂不支持读取图片
agent_unnamed = 该 agent
no_runner = 会话没有执行机信息：会话的 hook 没有上报 runner。请在装有 gofer 的机器（server 或 worker）上重新开会话，或给 hook 加 --runner <id>
no_project = 会话所在目录 {cwd} 不属于任何项目：用 `gofer project add` 把它加成项目，或在项目目录里开会话。远程执行机 {runner} 上的会话必须落在项目里才能收图
