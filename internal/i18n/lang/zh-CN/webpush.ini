# Web Push 通知（internal/webpush）的标题、正文与按钮文字。
# 语言取任务所属项目的语言（没有则 server 语言）；测试通知取点按钮那次请求的语言。

[webpush.title]
interaction = 等你审批/回答
review = 待评审
approval = 待批准
plan_blocked = 计划已阻塞
test = gofer 测试通知
terminal_job = 任务已结束
terminal_session = 会话已结束：{reason}
awaiting_reply = 会话等你回复：{title}

[webpush.body]
test = 此设备的 Web Push 已连通。
turn = 第 {turn} 轮 · {agent} · {project}
idle_end = 空闲将在 {time} 自动结束

[webpush.action]
allow = 允许
reject = 拒绝

[webpush.end_reason]
manual_end = 手动结束
idle_timeout = 空闲超时
max_session = 超过会话总时长
unrecorded = 失败原因未记录
failed = 失败：{reason}
