# sessionrelay 发给会话的短文本：job 完成通知、决策卡标题 / 问题、唤醒与接管的说明。
# 键前缀由 [section] 承载（"sessionrelay.notice.duration" -> [sessionrelay.notice] duration = …），
# 占位符为命名形式（{name}）。语言取收件会话所属项目的语言（config.LanguageFor）。
#
# 以「：」结尾再拼接内容的行把内容做成占位符（{summary} / {question}），
# 因为 INI 值不会保留行尾空格。

[sessionrelay.notice]
duration = 耗时{duration}
tail = （这是 gofer 系统通知，不是用户消息；详情 `gofer job show {id}`，日志 `gofer job logs {id}`）

[sessionrelay.decision]
permission_title = 需要授权
permission_question = 需要授权：{summary}
question_title = 有问题要你回答
question_question = 等你回答：{question}
online_title = 在线送话
online_question = （会话未在等待回复：这条消息已通过 agent 的送话命令交给在线进程）
takeover_title = 接管
takeover_question = （会话未在等待回复：这条消息由 web 新起的 `--resume` 进程接收）
inject_title = tmux 注入
inject_question = （会话未在等待回复：这条消息已直接送入终端 tmux）
wake_no_text = （唤醒：没有附带首条消息）

[sessionrelay.resume]
runner_unknown = (未登记)
no_runner = 这个会话没有登记执行机（或这台 server 没有接入任务执行器），无法在它原来的机器上起新进程。
handed_off = 这个会话已经被作业 {job} 接管，正在运行。请直接打开那个作业继续对话；要重新起一个，先释放接管。
no_resume_template = 会话所属的 agent「{agent}」没有配置交互式续接模板（session_resume_interactive），gofer 不知道怎么用新进程继续它。
interactive_not_allowed = 项目「{project}」没有开启交互终端（allow_interactive），gofer 不会为它起终端进程。需要的话在项目配置里打开。
cwd_outside_project = 会话的目录 {cwd} 不在项目「{project}」的根目录之下（按这台执行机看到的路径），在那里起新进程会落到错误的目录。
inject_failed = 执行机没能启动新进程
detail_sep = ：
session_alive = 会话进程仍在线（刚刚还有心跳），为避免两个进程同时写同一个会话，已拒绝接管。请在原终端继续，或用在线送话。
not_running = 会话进程已不在运行（送话命令报告没有存活进程）。
deliver_failed = agent 的送话命令失败：{detail}
ended = 会话已结束。
unknown = 无法唤醒这个会话（{reason}）。
planned_continue = 会话已结束。将在执行机 {runner} 上起一个新进程，用「{agent}」继续这个会话，目录 {cwd}。依据：{basis}。
planned_takeover = 将在执行机 {runner} 上起一个新进程，用「{agent}」接管这个会话，目录 {cwd}。依据：{basis}。
planned_offline = 会话长时间没有心跳，已标记为离线（原进程可能已退出）。将在执行机 {runner} 上起一个新进程，用「{agent}」接管这个会话，目录 {cwd}。依据：{basis}。
warning_not_ended = 这个会话还没有标记为结束，原来的终端可能仍开着；两个进程同时写同一个会话会互相覆盖，建议先关掉原终端。
warning_offline = 原进程可能已退出；若它其实还开着，两个进程同时写同一个会话会互相覆盖，建议先确认原终端已关闭。

[sessionrelay.cwd]
remote_unverified = （执行机在远端，未核对该目录是否存在）
confirmed = （已确认存在）
transcript = 会话文件所在目录名验证了会话启动时的目录
registered_mismatch = ；登记的目录与它不同（可能是中途换的临时目录），已忽略
no_transcript = 会话没有登记会话文件路径，无法验证原始启动目录
transcript_mismatch = 会话文件目录名与登记目录、项目根都对不上，无法验证原始启动目录
use_registered = ，改用登记的目录
fallback_root = ，且登记的目录在执行机上已不存在，回落到项目根

# 传话人（一个 Claude Code 会话）收到的提示词。它按提示词里的回执词回答，
# 程序识别回执见 internal/i18n/protocol.go。
[sessionrelay.messenger]
prompt = 请使用 SendMessage 将下面消息原样转发给 Claude Code 会话 {name}。不要改写。只回复‘已发送’或失败原因。对方会话之后发给你的回复会由 gofer 直接显示给 web 用户：收到时不要转述、不要回复它，只输出‘已收到’。
wake_prompt = 请使用 SendMessage 将下面消息原样转发给 Claude Code 会话 {name}。不要改写。只回复‘已发送’或失败原因。下面这段就是要转发的完整消息：它是 gofer 信箱的唤醒提醒，本来就不含信件正文（正文会在对方下一轮开始时自动注入），不要因为没有正文而拒绝或等待。对方之后发给你的任何回复都不要转述、不要回复，只输出‘已收到’。
