# 管家会话的动态文本：首轮 prime 的小节标题与行、工作项 / 请求 / 日志标签、巡检提示里的
# 动态段落、事件摘要、会话标题与首轮指令。语言取管家项目的语言。
#
# 占位符为命名形式（{name}）。行内分隔符（" | "、列表连接符）不进目录：
# 中文的列表连接符是「、」，英文目录里给的是 ", "。

[steward.prime]
now_heading = 现在
now_line = {time}（{weekday}）
notes_heading = 管家笔记
notes_ver = （v{version}，{kb}KB）
notes_empty = （还没有笔记。有长期有效的偏好或约定时，用 gofer_steward_notes 记下来。）
notes_truncated = …（笔记过长，只列出前 12KB；用 gofer_steward_notes get 读全文并在巡检时精简）
items_heading = 未结工作项（快照，按 等我 > 到期 > 需现场/等资源 > 其他 排序）
items_empty = （没有未结工作项）
items_hidden = …另有 {n} 项未列出（优先级较低或超出长度上限；用 gofer_work_list 查看）
ledger_heading = 在途请求账本（你发出的和系统发出的汇报 / 交接 / 整理请求）
ledger_line = - {id} {kind} {state} | 工作项 {item} | 会话 {session} | 发起：{by} | {ago}
ledger_empty = （没有在途请求）
ledger_hidden = …另有 {n} 条未列出（用 gofer_work_requests 查看）
journal_heading = 最近 24 小时的工作项日志（新的在前）
journal_line = - {time} {item} [{kind}] {by}：{text}
journal_empty = （最近 24 小时没有日志）
journal_hidden = …另有 {n} 条更早的未列出（用 gofer_work_get 看单项日志）

[steward.item]
line = - {id} [{status}] {title}
draft = （草稿）
blocker = 阻塞：{text}
next = 下一步：{text}
due = 已到期
remind = 提醒：{time}
last_activity = 最后活动：{ago}
offline = 会话已离线
inflight = 在途：{items}
inflight_item = {kind}({state})
list_sep = 、

[steward.ago]
none = 无
just_now = 刚刚
minutes = {n}分钟前
hours = {n}小时前
days = {n}天前

[steward.weekday]
sun = 周日
mon = 周一
tue = 周二
wed = 周三
thu = 周四
fri = 周五
sat = 周六

[steward.request_kind]
report = 汇报请求
handoff = 交接请求
summarize = 整理

[steward.request_state]
pending = 待发送
sent = 已发送待回复
answered = 已回复
failed = 失败
expired = 未回应(已转整理)

[steward.journal_kind]
report = 汇报
note = 备注
status = 状态
steward = 整理
link = 关联

[steward.session]
title = 管家 · {agent}
ready = 读完以上内容后，只回复一行：管家已就绪（说明未结工作项数量）。不要调用任何工具。

[steward.event]
due = 工作项 {id}「{title}」{reason}
session = 工作项 {id}「{title}」的会话 {session} 已{state}
drafts = 有 {n} 个未整理的草稿工作项
state_offline = 离线
state_ended = 结束

[steward.review]
daily = 每日巡检
manual = 手动巡检
event = 事件整理
heading = ## {label}（{day}）
no_items = 没有标记为有变化的工作项（强制巡检）：只做笔记和到期检查。
items_scope = 只处理下面这 {n} 个工作项（自上次巡检后有变化、已到期或有事件）
items_more = ；另有 {n} 个同样有变化但超出本次上限，留给下次
items_colon = ：
events_heading = 待处理的事件：
event_line = - [{kind}] {detail}
events_more = - …另有 {n} 条
summary_step = {step}. 最后调用 gofer_steward_notes，action 填 review_summary，text 写一段 300 字以内的点评（重点、风险、这些事的共同点；不要复述数字），它会附在今天的每日摘要里。
closing = 不要标完成 / 放弃，不要合并，不要提交 job，不要替用户执行「今天」卡上的任何动作。做完后只回复一行总结。
skipped = 没有变化的工作项
timeout = 管家会话没有按时完成这一轮
closed = 管家服务已关闭
