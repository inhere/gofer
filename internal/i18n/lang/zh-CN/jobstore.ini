# 存储层（internal/jobstore）写入的给人看的文字：工作项日志行与变更摘要、
# 已回答的 decision / 交互、发件人标签、会话消息截断标记等。
# 工作项相关的文字按工作项所属项目的语言写入（落库口径，写一次、历史不回写）。

[jobstore.work]
captured = 收集：{kind}
created = 创建工作项
time_none = 无

[jobstore.work.field]
title = 标题
goal = 目标
blocker_kind = 阻塞类型
blocker = 阻塞
next = 下一步
summary = 摘要
project = 项目
workspace = 工作区
park_note = 搁置条件

[jobstore.work.change]
cleared = {label}：已清除
updated = {label}已更新
from_to = {label}：{old} → {new}
set = {label}：{new}
priority = 优先级：{n}
park_until = 搁置至：{time}
remind_at = 提醒时间：{time}
unsorted_on = 标为未整理
unsorted_off = 已整理
status = 状态：{from} → {to}
status_source = 状态来源：{source}
join = {a}；{b}

[jobstore.work.journal]
link_session = 关联会话 {sid}
unlink_session = 取消关联会话 {sid}
link = 关联 {kind} {ref}
unlink = 取消关联 {kind} {ref}
merged_into = 已合并到 {target}
merged = 合并了 {parts}
merged_part = {id}「{title}」（{sessions} 个会话，{journal} 条日志）
parts_join = {a}、{b}
split_from = 从 {id}「{title}」拆分出
split = 拆分出 {id}「{title}」
split_moved = {note}（{n} 个会话移走）
split_kept = {note}（{n} 个会话同时保留）
auto_status = 状态：{from} → {to}（自动：{reason}）
decision_answered = 已回答 decision「{what}」：{answer}
interaction_answered = 已应答 job {job} 的交互「{prompt}」：{answer}
suggest = 合并建议（待确认）：{source} 并入 {target}
suggest_reason = {line}；理由：{reason}
issue_renamed = issue id 已改名 {old} -> {new}：仓库同步时推送了同 id 的新 issue

[jobstore.job]
deleted_title = 已删除

[jobstore.session]
truncated = [已截断]
short = 短命会话：存活 {lived} 分钟 < {max} 分钟，人工提问 {prompts} < {max_prompts} 次
