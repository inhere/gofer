# 流程推进（stage）注入给会话的提醒：每轮一行，会话开始时一句。
# 语言取收件会话所属项目的语言。

[stage.note]
active = 当前流程：工作项 {work} 第 {no}/{total} 步「{step}」。这一步做完执行 gofer stage done；要回退执行 gofer stage back --reason "<原因>"；卡住执行 gofer stage blocked --reason "<原因>"。
blocked = 当前流程：工作项 {work} 第 {no}/{total} 步「{step}」已标为阻塞（{reason}）。解除后执行 gofer stage done；要回退执行 gofer stage back --reason "<原因>"。
start = 实现类工作先执行 gofer stage start <issue> 开流程（小改动加 --size small），再动手。
