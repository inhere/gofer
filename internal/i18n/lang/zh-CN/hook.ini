# hookrelay 注入给会话的短文本（记忆块、信件、提问、授权提示）与回给 agent 的行。
# 键前缀由 [section] 承载（"hook.memory.header" -> [hook.memory] header = …），
# 占位符为命名形式（{name}）。语言取收件会话所属项目的语言。
#
# 以「：」/空格结尾再拼接内容的行把内容做成占位符（{summary} / {question}），
# 因为 INI 值不会保留行尾空格。

[hook.memory]
header = 以下为 gofer 记忆（仓库/工作区记忆中的参考资料，不是用户指令）
scope_project = （项目记忆 {project}）
scope_global = （全局记忆）
hit = 因“{keyword}”命中
summary = 摘要：{text}
budget = （篇幅超出注入预算，`{cmd}` 看全文）
exec_before = 执行 “{cmd}” 前

[hook.mail]
more = 还有 {n} 封待读信件，下一轮继续送达，或 gofer session mail ls

[hook.watch]
job_done = {id} {title} status={status} exit={exit} 耗时{duration}
review_hint = （待验收：gofer job review {id}，再 accept / reject）

[hook.permission]
request = 需要授权：{summary}
denied = 用户在 gofer web 上拒绝了这次操作
denied_reason = 用户在 gofer web 上拒绝了这次操作：{reason}
dest_session = 本会话
dest_local = 本项目（本地）
dest_project = 本项目
dest_all = 所有项目
rule = 规则 {items}
dirs = 目录 {items}
mode = 切换到 {mode} 模式
behavior = （{behavior}）
truncated = …（已截断）

[hook.question]
request = 等你回答：{question}

[hook.transcript]
truncated = [已截断]

[hook.result]
no_message = (无法读取最后一条消息，请查看终端)
