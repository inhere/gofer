# `gofer team` 命令文案（计划 2026-11-26-team-plan.md §2.5）。
# 一行一条；换行与缩进由代码补。

[cli.team]
desc = 团队：一个项目里的一个 leader 位置加若干成员位置；成员把结果报给 leader，由 leader 派活
arg.name = 团队名字（项目内唯一）
arg.team = 团队名字或 id；跨项目用 name@project
arg.seat = 团队所在项目的 seat 名字或 id
arg.text = 要发给团队的话
flag.project = 项目 key（默认取当前目录所在项目）
flag.leader = leader 的 seat（名字或 id）
flag.brief = 给 leader 看的团队说明：正文，或 @<文件> 从文件读
flag.json = 按 JSON 打印服务端返回
flag.limit = 列出多少条（默认 100，最多 500）

[cli.team.ls]
desc = 列出一个项目的团队：名字、转发模式、合并窗口与说明
empty = 还没有团队；用 `gofer team add <名字> --leader <seat>` 建一个

[cli.team.add]
desc = 建一个团队并指定 leader（成员用 `gofer team member add` 添加）
created = 团队 {name} 已建好（项目 {project}，leader {leader}）
hint = 用 `gofer team member add {team} <seat>` 加成员，用 `gofer team say {team} "..."` 和团队说话

[cli.team.show]
desc = 看一个团队：花名册（leader 在前，含状态、当前步骤、最近活动）与最近的路由判定
relay = {mode}（轮次上限 {round}、每日上限 {daily}），合并窗口 {merge} 秒
roster_head = 花名册（{n}）：
routes_head = 路由判定，最新在前（{n} 条）：

[cli.team.set]
desc = 改团队的 leader 或说明（说明用 "-" 清空）
nothing = 没有要改的：请给 --leader 或 --brief
updated = 团队 {name} 已更新（leader {leader}）

[cli.team.rm]
desc = 归档团队（名字和成员位置重新可用，历史保留）
archived = 团队 {name} 已归档（名字重新可用，历史保留）

[cli.team.say]
desc = 以人的身份给团队发一段话（发到 team:<名字> 地址）：正文点名 @成员 时只送给这些成员，没点名就送给 leader
sent = 已发给团队
need_text = 需要要发的话

[cli.team.routes]
desc = 列出团队的路由判定（哪条规则选了哪些位置），最新在前
empty = 还没有路由判定记录

[cli.team.evals]
desc = 列出 leader 每轮的评估，最新在前
empty = leader 还没有评估过任何一轮

[cli.team.member]
desc = 团队的成员位置（leader 在建团队或 team set 时用 --leader 指定）

[cli.team.member.add]
desc = 把一个 seat 加为团队成员
added = {seat} 已加入团队 {team}

[cli.team.member.rm]
desc = 把一个成员移出团队（seat 本身保留）
removed = {seat} 已移出团队 {team}

[cli.team.err]
need_name = 需要团队名字或 id
need_project = 判断不出要建在哪个项目；请给 --project <key>
not_found = 没有叫 "{name}" 的团队（见 `gofer team ls`）
not_found_in = 项目 "{project}" 里没有叫 "{name}" 的团队（见 `gofer team ls`）
ambiguous = "{name}" 这个团队存在于 {n} 个项目；请指定其中一个：{list}
brief_file = --brief @ 后面要跟文件路径（@- 读标准输入）
brief_read = --brief @{path}
