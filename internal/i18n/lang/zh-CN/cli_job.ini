# `gofer job` 命令文案（阶段 2，见 docs/design/2026-10-27-i18n-design.md）。
# 每个值一行、不含换行符（换行由代码加）。本文件逐字保留迁移前的输出。

[cli.job.desc]
review = Print a job's acceptance材料 in one screen (status / review / verify / commits / usage / diff summary + report tail); --diff adds the full diff
findings = List the 「发现但不碰」 (out-of-scope findings) items of a job's report; --create-issues files them in the current repo's tracker
preview = 把运行中任务的本机端口经 server 暴露为预览地址
preview_open = 为运行中的任务开一个本机端口预览租约，输出带一次性 token 的地址
preview_ls = 列出任务的预览租约
preview_close = 关闭（撤销）任务的一个预览租约
preview_renew = 续租任务的一个预览租约：到期时间改为当前时间加 --ttl（受 server 上限约束）

[cli.job.flag]
worktree_note = note for --todo-done (default: `<branch> 合入 <main short sha>`)
no_scope_discipline = do not append the project's 「交付约定」 (scope discipline) section to this job's prompt
acceptance = acceptance criteria (markdown list): appended to the agent's prompt as a 「## 验收标准」 section and shown in review
preview_port = 任务所在机器上应用监听的本机端口
preview_ttl = 租约时长（如 30m、2h，受 server 上限约束）

[cli.job.err]
no_config = 未找到配置文件，且未通过 -s/--server 指定 server 地址；请用 -s/--server 指定，或配置 $GOFER_CONFIG_DIR/.env（或 --config 指定配置文件）
approval_needs_person = 批准必须由人在 web 或 agent 会话之外的终端操作 (approval must be given by a person in the web console or a terminal outside any agent session)
notify_no_session = --notify 没有可通知的会话：用 --notify-session <sid> 指定，或从 agent 会话里提交（$GOFER_SESSION_ID / $CLAUDE_CODE_SESSION_ID；会话列表见 gofer session ls）
no_tracker_id = 无法从 job cwd 找到 tracker_id；请在工作目录或其父目录初始化 .gofer/tracker，或显式传 --tracker-id

[cli.job.warn]
hold_notify_rejected = warning: 默认的 hold 结束通知被服务端拒绝（{err}），本次不通知；需要通知请用 --notify-session <sid> 指定
secret_in_command = warning: 命令行疑似包含秘密，会被保存在 job 记录中（位置：{locations}）

[cli.job.run]
notify = notify: job 结束时通知会话 {session}

[cli.job.resume]
notify = notify: job 结束时通知会话 {session}（--no-notify 关掉）

[cli.job.show]
queued_wait = 排队:       {duration}
waiting_dir_help = waiting_dir_help: 被占用；只读任务加 --read-only，或用 --lock 收窄范围、--shared-dir 放弃独占、--worktree 隔离

[cli.job.review]
out_of_scope = out_of_scope: {count} file(s) outside the declared scope (范围外)
acceptance = 验收标准 (acceptance):
findings = 发现但不碰 ({count}; file them with `job findings {id} --create-issues`):
hints_head = 审阅提示 (review hints):
hotspots = deletion hotspots (删除最多; net = 新增-删除, ⚠ = 删除显著多于新增):
removed_comments = removed comments (被删注释):
verify_lines = verify lines (汇报里的验证结果):
report_verify = report verify (来源: agent 自述, 仅参考):

[cli.job.findings]
none = job {id} reported no 「{section}」 items

[cli.job.preview]
err_port = --port 必须在 1 到 65535 之间
err_ttl = --ttl 无效：{value}
