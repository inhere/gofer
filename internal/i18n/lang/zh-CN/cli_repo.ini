# `gofer issue` / `memory` / `repo` 命令文案（阶段 2，见 docs/design/2026-10-27-i18n-design.md）。
# 每个值一行；换行与行首缩进由代码加。zh-CN 逐字保留迁移前的输出。

[cli.issue.stale]
line = {id} [{status}] P{priority} {title} · 更新于 {age}

[cli.memory.flag]
desc = Report a memory as out of date (marks it 「⚠ 待复核」 where it is injected; the rule keeps its full text)

[cli.memory.add]
when_paths = 适用路径已设为 {paths}（整仓通用用 --when-paths '**'，工作区通用请写成项目记忆 --project）

[cli.memory.candidates]
desc = List knowledge candidates: the 「## 可复用经验」 items of delivered jobs, waiting for accept / reject
paths_label = 适用路径
paths_set = 适用路径已设为 {paths}（来自 job 的 cwd）

[cli.memory.synthesis]
desc = 每日记忆综合的运行记录（只读；当前阶段只准备材料，不调用模型）
empty = 没有记忆综合运行记录
line = {id} {day} {project} [{status}] 第 {attempt} 次 摘要 {digest} 检查于 {checked}
snapshot_kept = 材料快照：已保存（已脱敏；用 --json 查看）

[cli.memory.synthesis.ls]
desc = 列出每日记忆综合的运行记录（仅元数据）

[cli.memory.synthesis.show]
desc = 查看一条每日记忆综合运行记录

[cli.memory.scope]
basis_head = 依据 / 置信度
below_threshold = skipped {count} weaker suggestions: {keys}（--min-confidence medium 也写入）

[cli.repo.status]
project_key_missing = project_key: 未填写；可在 .gofer/tracker/config.yaml 填写 project_key

[cli.repo.changelog]
unreleased_flag = comma-separated section titles treated as unreleased (default: 未发布,Unreleased)

[cli.repo.projectkey]
server_match = project_key: {key}（匹配依据：server 项目路径最长前缀 {root}）
no_config = project_key: 未写入（没有可用的 gofer 配置）；可在 .gofer/tracker/config.yaml 填写 project_key
no_match = project_key: 未匹配到 gofer 项目（目录不在任何已登记项目路径下，或与多个项目并列）；可 `gofer project add` 登记该目录，或手工在 .gofer/tracker/config.yaml 填写 project_key
matched = project_key: {key}（匹配依据：最长路径前缀 {root}）
nested = 提示: 这是嵌套的独立仓库（上层仓库 {outer} 也在项目 {key} 目录下），已归属项目 {key}；如需独立，可注册单独项目并改 .gofer/tracker/config.yaml 的 project_key
