# `gofer serve` / `gofer worker` / `gofer ... stop` 的运行时文案（阶段 2，
# docs/design/2026-10-27-i18n-design.md）。每个值一行、不含换行符。
# 本文件逐字保留迁移前的输出。

[cli.daemon.stop]
not_running_no_pidfile = gofer: {label} 未在运行（无 pidfile {path}）
not_running_exited = gofer: {label} 未在运行（pid={pid} 已退出），清理残留 pidfile
signal_sent = gofer: 已向 {label}(pid={pid}) 发送停止信号，等待退出...
stopped = gofer: {label} 已停止
timeout = {label}(pid={pid}) 在 {timeout} 内未退出；可手动 {hint}

[cli.daemon.serve]
daemon_started = gofer serve 已后台启动 pid={pid} log={log}
token_from_config = config 文件里的 {field}（{note}）
token_from_env_file = 环境变量 {name}，值来自 {file}（{note}）
token_from_process_env = 环境变量 {name}，值来自当前进程的环境（{note}）
token_from_flag = 命令行 --token（{note}）
token_env_empty = 环境变量 {name} 未设置（没有可用 token）
token_unset = 未设置
token_note = 长度 {length}，指纹 {fingerprint}
token_warn_head = 警告: 当前终端与服务将使用不同的鉴权 token
token_warn_current = 当前终端: {current}
token_warn_service = 服务将使用: {service}
token_warn_why = 服务作为系统服务启动时只读配置目录的 .env 与 config.yaml，不继承当前终端的环境变量，所以注册前在终端 export 的 token 服务看不到。
token_warn_fix = 修法: 把要用的 token 写进 {file}（{name}=<token>），或登录 web / CLI 时改用服务那份。
token_warn_check = 核对: gofer serve status（输出两边的来源与指纹，不含 token 值）
token_status_service = auth_token(service): {service}
token_status_current = auth_token(current terminal): {current}
token_status_mismatch = auth_token: 两边 token 不一致 — 服务只读配置目录的 .env 与 config.yaml，不继承终端环境；把 token 写进配置目录的 .env，或改用服务那份。
token_status_credential_unset = auth_token: {role} 的环境变量 {name} 在服务侧未设置 — 该调用方无法鉴权。
