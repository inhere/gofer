# `gofer serve` / `gofer worker` / `gofer ... stop` 的运行时文案（阶段 2，
# docs/design/2026-10-27-i18n-design.md）。每个值一行、不含换行符。
# 本文件逐字保留迁移前的输出。

[cli.daemon.stop]
not_running_no_pidfile = gofer: {label} 未在运行（无 pidfile {path}）
not_running_exited = gofer: {label} 未在运行（pid={pid} 已退出），清理残留 pidfile
signal_sent = gofer: 已向 {label}(pid={pid}) 发送停止信号，等待退出...
stopped = gofer: {label} 已停止
timeout = {label}(pid={pid}) 在 {timeout} 内未退出；可手动 {hint}

[cli.daemon.serve]
daemon_started = gofer serve 已后台启动 pid={pid} log={log}
token_from_config = config 文件里的 {field}（{note}）
token_from_env_file = 环境变量 {name}，值来自 {file}（{note}）
token_from_process_env = 环境变量 {name}，值来自当前进程的环境（{note}）
token_from_persistent_env = 环境变量 {name}，值来自 Windows {scope}持久环境（{note}）
token_from_flag = 命令行 --token（{note}）
token_scope_user = 用户级
token_scope_machine = 机器级
token_env_empty = 环境变量 {name} 未设置（没有可用 token）
token_unset = 未设置
token_note = {mask}
token_warn_head = 警告: 当前终端与服务将使用不同的鉴权 token
token_warn_current = 当前终端: {current}
token_warn_service = 服务将使用: {service}
token_warn_why = 服务作为系统服务启动时只读配置目录的 .env 与 config.yaml，不继承当前终端的环境变量，所以注册前在终端 export 的 token 服务看不到。
token_warn_fix = 修法: 把要用的 token 写进 {file}（{name}=<token>），或登录 web / CLI 时改用服务那份。
token_warn_check = 核对: gofer serve status（输出两边的来源与掩码，不含 token 值）
token_status_service = auth_token(service): {service}
token_status_current = auth_token(current terminal): {current}
token_status_mismatch = auth_token: 两边 token 不一致 — 服务只读配置目录的 .env 与 config.yaml（以及 Windows 持久环境变量），不继承终端环境；把 token 写进配置目录的 .env，或改用服务那份。
token_status_credential_unset = auth_token: {role} 的环境变量 {name} 在服务侧未设置 — 该调用方无法鉴权。
token_persistent_head = 警告: {name} 也在 Windows {scope}持久环境变量里 — 服务会继承它，并且它压过配置目录的 .env
token_persistent_inherited = 持久环境里的值: {mask}
token_persistent_file = 只按 .env / config 解析会是: {source}
token_persistent_why = 服务会继承所在账户的持久环境变量，而 gofer 让「已存在的环境变量」优先于 .env 里的同名值，所以只改 .env 不会生效；要改就删掉或改掉这个变量（可在「系统属性 › 环境变量」里改，改成新值后新起的进程才会看到，重登录或重启后生效）
token_persistent_clear = 删除（推荐，机器级需要管理员权限的 PowerShell）: {cmd}
token_persistent_set = 或者改成你要的 token（把 <token> 替换掉）: {cmd}
token_persistent_restart = 然后重启服务: gofer serve restart
token_unread_dotenv = 注意: 本次 CLI 加载了 {file}，服务不会读它（服务在配置目录里运行）— 只写在那里的 token 服务没有
status_config_file = config: {file}
status_config_none = config: （无 — 默认值 + 自动发现）
status_dotenv_files = 本次 CLI 加载的 .env: {files}
status_dotenv_none = 本次 CLI 加载的 .env: （无）
version_unauthorized_head = 警告: 查询版本时返回 HTTP 401 — 本次 CLI 发去的 token 不是服务端认可的那个
version_unauthorized_cli = 本次 CLI 用的: {source}
version_unauthorized_server = 服务端认可的: {source}
version_unauthorized_fix = 修法: 把 CLI 侧的 {name}（或 server.token_env / server.token）改成服务那份 token — 上面两行已给出两边的来源。
