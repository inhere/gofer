[mail.wake]
notice = 有待读信件，将在本轮开始时注入，无需回复

[mail.letter]
truncated = …（正文已截断，完整内容：gofer session mail read {id}）

[mail.candidate]
session = 会话 {id}
offline = ，可能不在线

[mail.origin]
session = 会话 {id}
caller = 调用方
unknown = 未知出处

[mail.bounce]
no_inbox = 发件方是 job / 调用方，没有可注入的信箱：退信只在此记录
overdue = 超过送达期限仍没有送到
urgent = （加急）
not_delivered = 没有送到
where = 现在：
excerpt = 原文摘录：
letter = 信件 #{id}
for = （发给 {address}）
pty = 收件方是 pty 终端作业，收不到信件
capture_where = 已转入收集箱待指派
capture_where_item = 已转入收集箱待指派（条目 {item}）
sep = ：
end = 。

[mail.capture]
body = 正文摘录：
heading = 邮件 #{id} 待指派
from = 来自 {origin}
reason = 原因：{reason}
candidates = 候选：{candidates}

[mail.reason]
job_missing = 收件 job 不存在
job_ended = 收件 job 已结束（{status}），这封信没人读了
one_off = 收件是一次性作业（没有 ACP 会话），收不到信件
agent_unknown = mail.agents 里没有 {name}（地址 agent:{key}）
agent_unset = mail.agents.{name}.agent 未配置，无法启动会话
session_ended = 会话已结束
manual_end = 手动结束
limit = 常驻会话已达上限 {max}（mail.agents_max_resident），信件转待指派
rotate_letters = 收满 {n} 封信，轮换新会话
rotate_hours = 已存在 {n} 小时，轮换新会话
