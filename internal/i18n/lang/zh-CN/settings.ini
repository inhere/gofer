# 设置（internal/settings）拼进提示词的文字。

[settings.prompt]
extra_heading = ## 使用者补充

[settings.desc]
web_nav_hidden = Web 导航中隐藏的菜单 key（今天和设置始终显示）
work_short_session_max_minutes = 短命会话的时长阈值（分钟；已结束且存活短于此、提问次数也少于此的会话不进整理与管家）
work_short_session_max_prompts = 短命会话的提问次数阈值（人工提问少于此且存活时间也短的会话不进整理与管家）
steward_act_proactively = 是否让管家自行动手（每日巡检与事件唤醒）：关闭（默认）= 只记录，把它本来会做的事记下来（gofer steward observations），不改状态、不发消息、不推送；开启 = 照常动手。你自己发起的巡检和提问始终动手
prompt_steward_role = 管家角色提示词的整段替换（为空 = 用代码里的默认）
prompt_steward_role_extra = 追加在管家角色提示词之后的额外要求（推荐用它写偏好，跟得上默认提示词更新）
prompt_steward_review = 管家巡检提示词的整段替换（为空 = 用代码里的默认）
prompt_steward_review_extra = 追加在管家巡检提示词之后的额外要求
prompt_work_summarizer = 整理器提示词的整段替换（为空 = 用代码里的默认；要求的 JSON 输出格式说明总由代码追加在最后，替换不掉）
prompt_work_summarizer_extra = 追加在整理器提示词之后的额外要求（推荐的调整方式）
