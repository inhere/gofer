# `gofer plan` 命令文案（阶段 2，见 docs/design/2026-10-27-i18n-design.md）。
# 每个值一行；换行与行首缩进由代码加（INI 值不保留行首空白）。本文件逐字保留
# 迁移前的输出。

[cli.plan.flag]
no_supervisor = do not bind the current agent session as the plan's supervisor (主 Agent)

[cli.plan.create]
notify_on = notify: 该 plan 派发的 job 结束时通知主 Agent 会话
bound = 已绑定主 Agent 会话 {session}
bound_named = 已绑定主 Agent 会话 {session} ({name})
bound_hint = job 结束会通知该会话；不需要时：gofer plan set {plan} --clear-supervisor-session（或创建时加 --no-supervisor）
notify_without_supervisor = warning: notify 已开但 plan 没有主 Agent 会话，派发的 job 不会通知任何人（用 --supervisor-session-id <sid> 绑定）

[cli.plan.set]
supervisor_changed = 主 Agent 会话 ->

[cli.plan.bind]
none = 未绑定主 Agent 会话（{reason}绑定：gofer plan set {plan} --supervisor-session-id <sid>，见 gofer session ls）

[cli.plan.list]
footer = 共 {total} 条，显示 {from}–{to}

[cli.plan.show]
leader_switch_off = , 总开关未开
