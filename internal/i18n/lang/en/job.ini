# Short texts of the job domain.
# One [section] per dotted key prefix, so the key the code asks for is
# "<file domain>.<section>.<name>" with the INI section carrying the prefix
# ("job.delivery.task" -> [job.delivery] task = …). Placeholders are named ({name}).

[job.delivery]
task = Task
acceptance = Acceptance criteria
commits = Commits
stats = Diff stats
verify = Verification
usage = Usage
review = Review
details_summary = Full task description
more_commits = …and {n} more
verify_reason = ({reason})
review_passed = approved by {by}
review_note =: {note}
footer = Created automatically by gofer
job_title = Deliver {id}

[job.deadline]
minutes = {n} min
seconds = {n} s
