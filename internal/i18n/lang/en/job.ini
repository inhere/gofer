# Short texts of the job domain.
# One [section] per dotted key prefix, so the key the code asks for is
# "<file domain>.<section>.<name>" with the INI section carrying the prefix
# ("job.delivery.task" -> [job.delivery] task = …). Placeholders are named ({name}).

[job.delivery]
task = Task
acceptance = Acceptance criteria
commits = Commits
stats = Diff stats
verify = Verification
usage = Usage
review = Review
details_summary = Full task description
more_commits = …and {n} more
verify_reason = ({reason})
review_passed = approved by {by}
review_note =: {note}
footer = Created automatically by gofer

[job.deadline]
minutes = {n} min
seconds = {n} s

# --- S3e: text the job service writes into records for people (status names, delivery-check
# conclusions, todo notes, continue reasons) and the submit / worktree errors returned to
# the caller. Stored text (notes, comments, event reasons) is written once, in the project's
# language (project > server.language); an error with no request language available also
# uses the project / server language. Content after a label is a placeholder.

[job.status]
queued = Queued
running = Running
awaiting_input = Awaiting input
pending_interaction = Awaiting interaction
done = Done
failed = Failed
cancelled = Cancelled
timeout = Timed out
recovering = Recovering after restart
needs_review = Awaiting review
rejected = Rejected
waiting_dir = Waiting for the directory lock
awaiting_approval = Awaiting approval
paused_for_update = Waiting for an update (new jobs are paused)

[job.status_blank]
label = Unknown status

[job.check_comment]
unfinished = Delivery check did not finish (status unchanged): {error}
pass = Delivery check round {round}: passed. {summary}
resumed = Delivery check round {round}: failed ({failed} items unmet), continued automatically in {job} (attempt {n}/{max}). {summary}
resume_failed = Delivery check round {round}: failed ({failed} items unmet), the automatic continuation could not be submitted ({error}), moved to review. {summary}
failed = Delivery check round {round}: failed ({failed} items unmet), no more automatic continuation, moved to review. {summary}

[job.todo_note]
needs_review = {job} awaiting review
merged = {branch} merged into {sha}

[job.review_hint]
elided = …({n} earlier lines omitted)

[job.errors]
policy_pending = worker {worker} has not applied the policy yet (policy_pending, rev={rev})
session_local_only = Persistent sessions are only supported on the local runner for now
session_protocol = worker {worker} protocol v{version} does not support persistent sessions, please upgrade
worker_restarted = The worker restarted and the persistent session ended. Use gofer job resume {job} to continue its context through session/load
commit_not_remote = commit {sha} is not on the remote {remote}. Push the commit first, or check it on the server machine{reason}

[job.continue]
note = Not continued: {reason}. Started a new session
worktree_base = . The new worktree is based on the predecessor's branch {branch}
claimed_by_other = Already continued by another item
claimed_by_self = Already taken by this item
pred_read_failed = Reading the predecessor item failed: {error}
pred_missing = The predecessor item does not exist
pred_not_done = The predecessor item is {status}, not done
pred_job_read_failed = Reading the predecessor job failed: {error}
pred_no_job = The predecessor item has no finished job with a session
exec_no_resume = exec cannot continue a session
session_not_resumable = The predecessor session cannot be continued: {error}
runner_differs = The runner differs or is not the local one (this item {own}, predecessor {pred})
cwd_differs = This item's cwd {own} differs from the predecessor job's {pred}
worktree_gone = The predecessor job's worktree no longer exists
needs_delivery = The predecessor job needs automatic delivery
claim_failed = Claiming the continuation slot failed: {error}
chain_limit = Already continued {n} times in a row
template_failed = Rendering the task book failed: {error}
config_unsupported = The configuration does not support continuing: {error}
agent_no_resume = agent {agent} has no way to continue a session
readonly_mismatch = The read-only settings differ (this item {own}, predecessor {pred})
assemble_failed = Assembling the continuation request failed: {error}
