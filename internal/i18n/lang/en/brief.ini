# brief, en: the handoff brief (issue / plan) and the post-compact refocus section.
# Design 2026-10-27-i18n-design.md §4 / P1f. Written as English, not translated line by
# line: the requirements, their order and the sections match the zh-CN file.

[brief.head]
brief = # Handoff brief {kind} {id}

[brief.section]
note = ({note})
truncated = [{n} lines cut]
truncated_more = [{n} lines cut: `{more}`]

[brief.note]
server = no server connection, section skipped
server_reason = no server connection, section skipped ({reason})

[brief.hint]
title = Takeover hints
commit_policy = - Commit policy: {policy}
rules_issue = - Local commit / push rules and the verification commands are the rule memories under Appliable memories (`gofer repo prime` lists them all).
rules_plan = - Local commit / push rules and the verification commands are the rule memories (`gofer repo prime`, or `gofer issue brief <id>` of a related issue).
memory_flag_mismatch = - A memory or rule that does not match the code: `gofer memory flag <key> --reason "…"`, do not work around it silently.
claim = - Claim it before you start `gofer issue update {id} --claim`, report progress with `gofer issue comment {id} "…"`, close it with `gofer issue close {id} --reason "…"` when done.

[brief.field]
block = {label}:
description = Description
acceptance = Acceptance criteria
tags = tags {tags}
assignee = assignee {assignee}
updated = updated {time}
project = project {project}
progress = {done}/{total} todos done
paused = paused
blocked = blocked on {todo}

[brief.issue]
title = issue
plan_comment = Plan comment ({time} by {by}, lines: {n}):
more_lines = … ({n} more lines: `gofer issue show {id}`)
comments = Comments (latest {shown} of {total}):
no_acceptance = Acceptance criteria: none
acceptance_hint = → add it: `gofer issue update {id} --acceptance "…"`
plan_comment_above = (the plan comment, shown above)
close_reason = — closed: {reason}

[brief.tree]
title = Context tree
parent = parent: {head}
siblings = siblings:
children = children:
depends_on = depends on:
blocked_by = blocking (waiting for this issue):
linked = linked:
not_in_tracker = (not in this repository's tracker)
empty = no parent / children / dependencies

[brief.design]
title = Design docs
parent_only = (mentions only the parent {parent})
none = no doc under docs/ mentions this issue or its parent

[brief.docs]
missing = (file not found)
file_start = (start of the file)

[brief.commit]
title = Related commits
not_git = not a git repository, section skipped
none = no commit in git log names {id} (or its parent {parent})
none_inline = (no commit in git log names {id} (or its parent {parent}))
more = - {n} more: `{more}`
via = (via {via})
via_sibling = {sibling} close reason
mentioned = files named in the issue text:
entries = code entries (the files these commits touch most):
entries_ref = code entries (from the commits of the parent / sibling issues, since this issue has none yet, for reference only):
symbols = key symbols (the Go / TS / JS functions these commits added or changed, line numbers are the current checkout):

[brief.work]
title = Related jobs / plans
read_failed = could not read from the server, section skipped ({err})
review = review: {note}
plan = - plan {id} [{status}] {title} (`gofer plan brief {id}`)
none = no job is linked to this issue and no open plan mentions it

[brief.verify]
title = Verification commands for this issue
config_hint = `brief.verify` in `.gofer/tracker/config.yaml`
no_match = no command in {hint} matches this issue's code entries, see the rule memories below
configured_note = - (matched against the code entries by {hint}; the full run and the other constraints are the rule memories below)
derive_note = cannot derive a verification command from the code entries, configure this repository's commands by path in {hint}, or see the rule memories below
generic_note = - (derived from the code entries; this repository's own commands can be configured in {hint}, and the full run and the platform constraints are the rule memories below)
unit_package = packages
unit_dir = directories
unit_file = files
cap = {n} more {unit}, add what you need

[brief.memory]
title = Appliable memories
scope_global = global
scope_project = project {project}
global_failed = could not read the global memories: {err}
project_note = project memories: {note}
scoped_note = global / project memories: {note}
rule_head = (rule)
handoff = (handoff)
hint = gofer memory ls <keyword>
more = - {n} more: `gofer memory ls <keyword>`
none = no matching memory

[brief.todo]
title = todos
none = no todos yet
assigned = assigned {name}
deps = depends on: {list}
deps_join = , 
acceptance = acceptance: {text}
conclusion = conclusion: {text}
dispatch_failed = dispatch failed: {err}

[brief.handoff]
title = Handoff note
read_failed = could not read it ({err})
none = none, write one with `gofer plan handoff {id} --set "…"`

[brief.related]
title = Related issues
no_tracker = no repository tracker in this directory, cannot resolve issues
none = neither the plan nor its todos name an issue of this repository
more = - {n} more
design_docs = design docs: {docs}
design_docs_join = ,
takeover = takeover: `gofer issue brief {id}`

[brief.prime]
plan = - {id} {title} (takeover: `gofer plan brief {id}`)

[brief.refocus]
head_compacted = the context was just compacted, this is what you were doing (take over with the command at the end of each line):
head_resumed = the session was just resumed, this is what you were doing (take over with the command at the end of each line):
topic = topic: {topic}
claims = claimed issues:
inferred = [possibly]
status = ({status})
detail = ({detail})
plans = supervised plans:
jobs = jobs you were waiting on:
mail = unanswered letters:
mail_from = from {from}
mail_subject = : {subject}
blocked = blocked on {value}
next = next up {value}
join = ,
