[seat.hook]
heading = Resident session: {name}
heading_purpose = Resident session: {name} ({purpose})

[seat.continuation]
intro = You now sit in the seat "{name}".
purpose = Purpose: {purpose}
charter = Charter:
report = Most recent work report of this project:
handoff = Most recent plan handoff of this project:
fresh = This is a new session: the earlier conversation is not in your context. Rely on the text above and the state of the repository to carry the work on.
resumed = This session continues an earlier conversation of the same seat: read the seat block above and carry the work on from where it stopped.
restarted = Your seat "{name}" was restarted; continue the earlier work.

[seat.schedule]
prefix = [gofer scheduled message "{name}"]

[seat.bind]
charter = You have just been put into the seat "{name}": this is its charter, work by it from now on.
