# Display texts the HTTP handlers produce that are not errors: permission presets,
# the capture-box persona, the notification test message, stored one-liners.

[httpapi]
preset_tunnel = Tunnel use
preset_release = Release and upgrade
preset_answer = Answer for others (people)
preset_readonly = Read others
mail_agent_ended_by_hand = Ended by hand (web / CLI)
mail_box = Capture box
mail_box_of = {name}'s capture box
notify_test_title = gofer notification test
notify_test_text = This is a test message from gofer (Settings, Notifications, Send test).
notify_test_link = Open settings
tracker_sync_done = Sync complete: issues={issues} memories={memories}
tunnel_this_machine = this machine
relay_status_detail = {status}: {reason}
inbox_job_failed = {id} failed
handed_off_just_now = just now
handed_off_notice = This session was taken over on the web at {when} (job {job}); continue in the web terminal or with --resume. The relay of this terminal is now off
inject_job_gone = The job record no longer exists

[httpapi.summarizer]
no_registry = There is no agent registry
agent_missing = The summarizer agent {agent} does not exist (set work.summarizer_agent to a configured cli-agent)
not_cli_agent = The summarizer agent {agent} is not a cli-agent (a one-shot read-only tidy-up needs a cli-agent)
no_read_only = The summarizer agent {agent} has no read-only mode (give it agents.{key}.read_only_args; claude / codex have it built in)
unavailable = The summarizer agent {agent} is unavailable: {why}
command_not_found = the command was not found on this machine
no_project = The tidy-up job has no usable project: name one in work.summarizer_project, or keep the default project in the config
timeout = The tidy-up job timed out
failed = The tidy-up job did not succeed ({reason})

[inbox.waiting]
approval = Waiting for your approval
answer = Waiting for your answer
review = Waiting for your review
plan_stuck = Plan stuck, needs you
failed = Your job failed
delivery = Delivery waiting for your confirmation
