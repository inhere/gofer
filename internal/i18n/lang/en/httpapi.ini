# Display texts the HTTP handlers produce that are not errors: permission presets,
# the capture-box persona, the notification test message, stored one-liners.

[httpapi]
preset_tunnel = Tunnel use
preset_release = Release and upgrade
preset_answer = Answer for others (people)
preset_readonly = Read others
mail_agent_ended_by_hand = Ended by hand (web / CLI)
mail_box = Capture box
mail_box_of = {name}'s capture box
notify_test_title = gofer notification test
notify_test_text = This is a test message from gofer (Settings, Notifications, Send test).
notify_test_link = Open settings
tracker_sync_done = Sync complete: issues={issues} memories={memories}
tunnel_this_machine = this machine
relay_status_detail = {status}: {reason}
inbox_job_failed = {id} failed
inbox_child_wake_failed = Child job {child} has a result that cannot reach {parent}
inbox_child_wake_reason_parent_ended = the resident parent ended, so nothing received the receipt
inbox_child_wake_reason_expired = the receipt expired before the child finished
inbox_schedule_paused = Schedule {name} failed {failures} times in a row and was paused
inbox_schedule_paused_summary = Last failed job: {job}. Enable it again once fixed; the failure count restarts from zero
inbox_seat_schedule = Seat {seat} could not take the scheduled message {name}: queued for when it is open
inbox_stage_review = The review of work item "{title}" waits for your approval
inbox_stage_needs_human = The "{step}" gate of work item "{title}" cannot be judged here; confirm it
inbox_stage_verify_failed = The verify run of work item "{title}" failed
inbox_team_missing_eval = The leader of team "{team}" missed its evaluation for {n} turns in a row
inbox_team_missing_eval_summary = Leader turns ended without gofer team eval: check that the leader session is working and sees the protocol (gofer team show {team}); the card clears when it records an evaluation
inbox_seat_schedule_summary = Open the seat with `gofer seat open {seat}`; queued, it is sent once a session is back ({n} undelivered so far). Latest text: {text}
inbox_caller_token_expiring = The token of caller {name} expires within {days} day(s)
inbox_caller_token_expiring_summary = Expires {when}. After that its requests are refused (401); rotate the token
inbox_caller_token_expired = The token of caller {name} has expired
inbox_caller_token_expired_summary = Expired {when}. Its requests are being refused (401); rotate the token or disable the caller
inbox_server_health = Server self-check "{name}" failed {failures} times in a row
health_check.storage = Storage writes
health_check.disk = Free space of the data directory
health_check.sweep = Scheduled sweep
health_check.notification = Outbound notification delivery
handed_off_just_now = just now
handed_off_notice = This session was taken over on the web at {when} (job {job}); continue in the web terminal or with --resume. The relay of this terminal is now off
inject_job_gone = The job record no longer exists

[httpapi.summarizer]
no_registry = There is no agent registry
agent_missing = The summarizer agent {agent} does not exist (set work.summarizer_agent to a configured cli-agent)
not_cli_agent = The summarizer agent {agent} is not a cli-agent (a one-shot read-only tidy-up needs a cli-agent)
no_read_only = The summarizer agent {agent} has no read-only mode (give it agents.{key}.read_only_args; claude / codex have it built in)
unavailable = The summarizer agent {agent} is unavailable: {why}
command_not_found = the command was not found on this machine
no_project = The tidy-up job has no usable project: name one in work.summarizer_project, or keep the default project in the config
timeout = The tidy-up job timed out
failed = The tidy-up job did not succeed ({reason})

[inbox.waiting]
approval = Waiting for your approval
answer = Waiting for your answer
review = Waiting for your review
awaiting_merge = Waiting for you to finish (merge)
plan_stuck = Plan stuck, needs you
failed = Your job failed
attention = Needs your attention
delivery = Delivery waiting for your confirmation
