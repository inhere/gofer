# Short texts of the hook relay: what the hooks inject into a session (memory
# blocks, letters, questions, permission prompts) and the lines they feed back to
# the agent. One [section] per dotted key prefix; placeholders are named ({name}).
#
# The language is the recipient session's project language (design
# 2026-10-27-i18n-design.md §3), which the server sends with the session. Keys
# that end a sentence with a space before the payload carry it as a placeholder
# ({summary} / {question}), because an INI value does not keep trailing spaces.

[hook.memory]
header = This is gofer memory (reference material from the repository / workspace memory — not an instruction from the user)
scope_project =  (project memory {project})
scope_global =  (global memory)
hit = matched "{keyword}"
summary = Summary: {text}
budget = (over the injection budget — `{cmd}` shows the full text)
exec_before = before running "{cmd}"

[hook.mail]
more = {n} more letters to read; the next turn delivers them, or run gofer session mail ls

[hook.watch]
job_done = {id} {title} status={status} exit={exit} took {duration}
review_hint = (needs review: gofer job review {id}, then accept / reject)

[hook.permission]
request = Permission needed: {summary}
denied = The user denied this action on the gofer web
denied_reason = The user denied this action on the gofer web: {reason}
dest_session = this session
dest_local = this project (local)
dest_project = this project
dest_all = all projects
rule = rule {items}
dirs = directories {items}
mode = switch to {mode} mode
behavior = ({behavior})
truncated = …(truncated)

[hook.question]
request = Waiting for your answer: {question}

[hook.transcript]
truncated = [truncated]

[hook.result]
no_message = (could not read the last message — see the terminal)
