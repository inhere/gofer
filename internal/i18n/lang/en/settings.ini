# Text internal/settings puts into prompts.

[settings.prompt]
extra_heading = ## Additions from the user

[settings.desc]
web_nav_hidden = Menu keys hidden from the web navigation (Today and Settings are always shown)
work_short_session_max_minutes = Duration threshold of a short-lived session, in minutes (an ended session that lived shorter than this and had fewer prompts than the prompt threshold is left out of the summarizer and the steward)
work_short_session_max_prompts = Prompt-count threshold of a short-lived session (a session with fewer human prompts than this that also lived briefly is left out of the summarizer and the steward)
steward_act_proactively = Let the steward ACT on its own (the daily review and event wake-ups): off (default) = observe only, what it would have done is recorded (gofer steward observations) and nothing is changed, sent or pushed; on = it acts. Reviews you start yourself and questions you ask always act
prompt_steward_role = Full replacement of the steward role prompt (empty = the built-in default)
prompt_steward_role_extra = Extra requirements appended after the steward role prompt (the recommended way to state preferences; it keeps up with default prompt updates)
prompt_steward_review = Full replacement of the steward review prompt (empty = the built-in default)
prompt_steward_review_extra = Extra requirements appended after the steward review prompt
prompt_work_summarizer = Full replacement of the summarizer prompt (empty = the built-in default; the required JSON output format is always appended by the code and cannot be replaced)
prompt_work_summarizer_extra = Extra requirements appended after the summarizer prompt (the recommended way to adjust it)
