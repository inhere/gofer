# `gofer job` command text (phase 2 of docs/design/2026-10-27-i18n-design.md).
# One line per value, no embedded newlines: the code adds the line break. The
# zh-CN file reproduces the text of the pre-migration code verbatim; this file is
# the English rewrite of the same messages.

[cli.job.desc]
review = Print a job's acceptance criteria in one screen (status / review / verify / commits / usage / diff summary + report tail); --diff adds the full diff
findings = List the Out-of-scope findings items of a job's report; --create-issues files them in the current repo's tracker

[cli.job.flag]
worktree_note = note for --todo-done (default: `<branch> merged into <main short sha>`)
no_scope_discipline = do not append the project's Delivery contract (scope discipline) section to this job's prompt
acceptance = acceptance criteria (markdown list): appended to the agent's prompt as a `## Acceptance criteria` section and shown in review

[cli.job.err]
no_config = no config file found and no -s/--server given; pass -s/--server, or set $GOFER_CONFIG_DIR/.env (or --config <file>)
approval_needs_person = an approval must be given by a person in the web console or a terminal outside any agent session
notify_no_session = --notify has no session to notify: pass --notify-session <sid>, or submit from an agent session ($GOFER_SESSION_ID / $CLAUDE_CODE_SESSION_ID; see gofer session ls for the sessions)
no_tracker_id = no tracker_id found from the job cwd: initialise .gofer/tracker in the working directory or one of its parents, or pass --tracker-id

[cli.job.warn]
hold_notify_rejected = warning: the default hold end-notification was refused by the server ({err}); nothing is notified this time — pass --notify-session <sid> to notify someone
secret_in_command = warning: the command line looks like it holds a secret and is stored with the job record (found in: {locations})

[cli.job.run]
notify = notify: the session {session} is told when the job ends

[cli.job.resume]
notify = notify: the session {session} is told when the job ends (--no-notify turns it off)

[cli.job.show]
queued_wait = queued:     {duration}
waiting_dir_help = waiting_dir_help: held by another job; add --read-only for a read-only task, or narrow the lock with --lock, give up exclusivity with --shared-dir, or isolate the job with --worktree

[cli.job.review]
out_of_scope = out_of_scope: {count} file(s) outside the declared scope
acceptance = acceptance criteria:
findings = out-of-scope findings ({count}; file them with `job findings {id} --create-issues`):
hints_head = review hints:
hotspots = deletion hotspots (most deleted; net = added - deleted, ⚠ = deletions clearly outweigh additions):
removed_comments = removed comments:
verify_lines = verify lines (the verification results in the report):
report_verify = report verify (source: the agent's own report, reference only):

[cli.job.findings]
none = job {id} reported no "{section}" items
