# Runtime text of `gofer serve` / `gofer worker` / `gofer ... stop` (phase 2 of
# docs/design/2026-10-27-i18n-design.md). One line per value, no embedded newlines.
# The zh-CN file reproduces the pre-migration text verbatim; this is its English
# rewrite.

[cli.daemon.stop]
not_running_no_pidfile = gofer: {label} is not running (no pidfile {path})
not_running_exited = gofer: {label} is not running (pid={pid} exited); removed the stale pidfile
signal_sent = gofer: asked {label}(pid={pid}) to stop, waiting for it to exit...
stopped = gofer: {label} stopped
timeout = {label}(pid={pid}) did not exit within {timeout}; stop it by hand: {hint}

[cli.daemon.serve]
daemon_started = gofer serve started in the background pid={pid} log={log}
token_from_config = {field} in the config file ({note})
token_from_env_file = environment variable {name} from {file} ({note})
token_from_process_env = environment variable {name} from this process's environment ({note})
token_from_persistent_env = environment variable {name} from the Windows {scope} persistent environment ({note})
token_from_flag = --token on the command line ({note})
token_scope_user = user
token_scope_machine = machine
token_env_empty = environment variable {name} is not set (no token available)
token_unset = not set
token_note = {mask}
token_warn_head = warning: this terminal and the service will use DIFFERENT auth tokens
token_warn_current = this terminal: {current}
token_warn_service = the service will use: {service}
token_warn_why = As a system service, gofer serve reads only the config dir's .env and config.yaml — it does NOT inherit this terminal's environment, so a token exported before `serve register` is not what the service uses.
token_warn_fix = fix: put the token in {file} ({name}=<token>), or sign in to the web console / CLI with the service's token.
token_warn_check = check: gofer serve status (prints both sources and masks, never the value)
token_status_service = auth_token(service): {service}
token_status_current = auth_token(current terminal): {current}
token_status_mismatch = auth_token: the two differ — the service reads only the config dir's .env and config.yaml (plus the Windows persistent environment), not this terminal's environment; put the token in the config dir's .env, or use the service's token.
token_status_credential_unset = auth_token: {role}'s environment variable {name} is not set for the service — that caller cannot authenticate.
token_persistent_head = warning: {name} is set in the Windows {scope} persistent environment — the service inherits it, and it OVERRIDES the config dir's .env
token_persistent_inherited = inherited from the persistent environment: {mask}
token_persistent_file = the .env / config alone would give: {source}
token_persistent_why = a service inherits the persistent environment of its account and gofer keeps an already-set variable over the .env value, so editing the .env changes nothing until the variable is removed or changed (edit it via System properties › Environment Variables, or log out and back in for the new value to reach a new process)
token_persistent_clear = remove it (recommended), in an elevated PowerShell for the machine scope: {cmd}
token_persistent_set = or set it to the token you want (replace <token>): {cmd}
token_persistent_restart = then restart the service: gofer serve restart
token_unread_dotenv = note: this CLI loaded {file}, which the service does NOT read (it runs in the config dir) — a token that only lives there is not one the service has
status_config_file = config: {file}
status_config_none = config: (none — defaults + discovery)
status_dotenv_files = .env loaded by this CLI: {files}
status_dotenv_none = .env loaded by this CLI: (none)
version_unauthorized_head = warning: the version query got HTTP 401 — the token this CLI sent is not one the server accepts
version_unauthorized_cli = this CLI sent: {source}
version_unauthorized_server = the service accepts: {source}
version_unauthorized_fix = fix: make {name} (or server.token_env / server.token on the CLI side) the service's token — gofer serve status shows both sources above.
