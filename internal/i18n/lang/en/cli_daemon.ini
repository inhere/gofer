# Runtime text of `gofer serve` / `gofer worker` / `gofer ... stop` (phase 2 of
# docs/design/2026-10-27-i18n-design.md). One line per value, no embedded newlines.
# The zh-CN file reproduces the pre-migration text verbatim; this is its English
# rewrite.

[cli.daemon.stop]
not_running_no_pidfile = gofer: {label} is not running (no pidfile {path})
not_running_exited = gofer: {label} is not running (pid={pid} exited); removed the stale pidfile
signal_sent = gofer: asked {label}(pid={pid}) to stop, waiting for it to exit...
stopped = gofer: {label} stopped
timeout = {label}(pid={pid}) did not exit within {timeout}; stop it by hand: {hint}

[cli.daemon.serve]
daemon_started = gofer serve started in the background pid={pid} log={log}
token_from_config = {field} in the config file ({note})
token_from_env_file = environment variable {name} from {file} ({note})
token_from_process_env = environment variable {name} from this process's environment ({note})
token_from_flag = --token on the command line ({note})
token_env_empty = environment variable {name} is not set (no token available)
token_unset = not set
token_note = length {length}, fingerprint {fingerprint}
token_warn_head = warning: this terminal and the service will use DIFFERENT auth tokens
token_warn_current = this terminal: {current}
token_warn_service = the service will use: {service}
token_warn_why = As a system service, gofer serve reads only the config dir's .env and config.yaml — it does NOT inherit this terminal's environment, so a token exported before `serve register` is not what the service uses.
token_warn_fix = fix: put the token in {file} ({name}=<token>), or sign in to the web console / CLI with the service's token.
token_warn_check = check: gofer serve status (prints both sources and fingerprints, never the value)
token_status_service = auth_token(service): {service}
token_status_current = auth_token(current terminal): {current}
token_status_mismatch = auth_token: the two differ — the service reads only the config dir's .env and config.yaml, not this terminal's environment; put the token in the config dir's .env, or use the service's token.
token_status_credential_unset = auth_token: {role}'s environment variable {name} is not set for the service — that caller cannot authenticate.
