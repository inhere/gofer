[mail.wake]
notice = There are unread letters; they will be injected at the start of this turn. No reply is needed.

[mail.letter]
truncated = …(body truncated; read the full letter with: gofer session mail read {id})

[mail.candidate]
session = session {id}
offline = , possibly offline

[mail.origin]
session = session {id}
caller = caller
unknown = unknown origin

[mail.bounce]
no_inbox = The sender is a job/caller without an injectable inbox; the bounce is recorded here only.
overdue = not delivered before the deadline
urgent = " (urgent)"
not_delivered = " was not delivered"
where = "Now: "
excerpt = "Original excerpt: "
letter = Letter #{id}
for = " (to {address})"
pty = The recipient is a pty terminal job and cannot receive letters
capture_where = Moved to the capture box, awaiting assignment
capture_where_item = Moved to the capture box, awaiting assignment (item {item})
sep = ": "
end = .

[mail.capture]
body = "Body excerpt: "
heading = Mail #{id} awaiting assignment
from = From {origin}
reason = Reason: {reason}
candidates = Candidates: {candidates}

[mail.reason]
job_missing = The recipient job does not exist
job_ended = The recipient job has ended ({status}); nobody will read this letter
one_off = The recipient is a one-off run (no ACP session) and cannot receive letters
agent_unknown = mail.agents has no {name} (address agent:{key})
agent_unset = mail.agents.{name}.agent is not configured, so no session can be started
session_ended = The session has ended
manual_end = Ended manually
limit = The resident session limit {max} is reached (mail.agents_max_resident); the letter moves to the capture box
rotate_letters = Received {n} letters; rotating to a new session
rotate_hours = Has existed for {n} hours; rotating to a new session
