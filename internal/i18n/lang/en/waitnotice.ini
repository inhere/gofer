# Titles of the waiting-for-me notices (internal/waitnotice): a name and a category, never the
# text of a turn. The desktop, webhook and Web Push channels all use these words.

[waitnotice.title]
answer = {label} is waiting for your answer
approval = {label} needs your approval
review = {label} needs your review
other = {label} is waiting for you
reminder = Reminder: {title}

[waitnotice.link]
open = Open the session
