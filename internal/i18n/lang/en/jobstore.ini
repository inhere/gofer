# Human-readable text the store layer (internal/jobstore) writes: work-item journal
# lines and change summaries, answered decisions / interactions, sender labels, the
# session message truncation marker.
# Work-item text is written in the language of the item's project (stored text: written
# once, history is never rewritten).

[jobstore.work]
captured = Captured: {kind}
created = Work item created
time_none = none

[jobstore.work.field]
title = Title
goal = Goal
blocker_kind = Blocker type
blocker = Blocker
next = Next step
summary = Summary
project = Project
workspace = Workspace
park_note = Park condition

[jobstore.work.change]
cleared = {label}: cleared
updated = {label} updated
from_to = {label}: {old} → {new}
set = {label}: {new}
priority = Priority: {n}
park_until = Parked until: {time}
remind_at = Remind at: {time}
unsorted_on = Marked unsorted
unsorted_off = Sorted
status = Status: {from} → {to}
status_source = Status source: {source}
join = {a}; {b}

[jobstore.work.journal]
link_session = Linked session {sid}
unlink_session = Unlinked session {sid}
link = Linked {kind} {ref}
unlink = Unlinked {kind} {ref}
merged_into = Merged into {target}
merged = Merged {parts}
merged_part = {id} "{title}" ({sessions} session(s), {journal} journal line(s))
parts_join = {a}, {b}
split_from = Split out of {id} "{title}"
split = Split out {id} "{title}"
split_moved = {note} ({n} session(s) moved)
split_kept = {note} ({n} session(s) kept as well)
auto_status = Status: {from} → {to} (auto: {reason})
decision_answered = Answered decision "{what}": {answer}
interaction_answered = Answered job {job} interaction "{prompt}": {answer}
suggest = Merge suggestion (pending): {source} into {target}
suggest_reason = {line}; reason: {reason}
issue_renamed = issue id renamed {old} -> {new}: a new issue with the same id was pushed on repository sync

[jobstore.job]
deleted_title = Deleted

[jobstore.session]
truncated = [truncated]
short = Short-lived session: lived {lived} min < {max} min, {prompts} human prompt(s) < {max_prompts}
