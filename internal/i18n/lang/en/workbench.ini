# Text the workbench (internal/workbench) shows a person: why images cannot be attached,
# the diff notice, and the image lines sent to the agent. The language is the request's;
# the image lines use the language of the session's project.

[workbench.attach]
pty = A pty session cannot take images
agent_unnamed = This agent
no_image = {agent} cannot read images yet
no_runner = The session has no executing machine recorded
ended = The session has ended and cannot be sent to
runner_default = the executing machine
own_dir = The session has no project, and worker {runner} cannot receive attachments (not connected or too old; upgrade and restart that worker)
marker = [Image {n}] {path}
marker_relative = [Image {n}] {path} (relative to the root of project {project})

[workbench.diff]
captured_notice = Only the captured result of the latest turn
