# Why a workbench (/workbench) session takes no image attachments; shown as the 📎 hover
# hint and as the reason a send fails (attachments_reason of
# GET /v1/workbench/threads). The language is the session's project language
# (config.LanguageFor), or server.language when the session belongs to no project.

[workbench.attachments]
pty = a pty session takes no images
agent = {agent} cannot read images
agent_unnamed = this agent
no_runner = the session has no executor: its hook reported no runner. Open the session again on the machine that runs gofer (the server or a worker), or pass --runner <id> to the hook
no_project = the session's directory {cwd} belongs to no project: add it with `gofer project add`, or open the session inside a project directory. A session on the remote executor {runner} must live in a project to take images
