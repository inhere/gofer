# Dynamic text of a steward session: the sections and lines of the first-turn
# prime, the work-item / request / journal labels, the dynamic parts of the
# review prompt, the event summaries, the session title and its first-turn
# instruction. The language is the steward project's language.
#
# Placeholders are named ({name}). Inline separators (" | ") and the list
# separator of the item line are not in the catalog: zh-CN joins with "、",
# English with ", ".

[steward.prime]
now_heading = Now
now_line = {time} ({weekday})
notes_heading = Steward notes
notes_ver = (v{version}, {kb}KB)
notes_empty = (No notes yet. When a preference or agreement will last, record it with gofer_steward_notes.)
notes_truncated = … (notes are too long: the first 12KB only; read the full text with gofer_steward_notes get and slim it during a review)
items_heading = Open work items (snapshot, ordered needs me > due > needs onsite/resources > other)
items_empty = (No open work items)
items_hidden = …{n} more not listed (lower priority or over the length limit; see gofer_work_list)
ledger_heading = Request ledger (report / hand-over / tidy-up requests you and the system sent)
ledger_line = - {id} {kind} {state} | item {item} | session {session} | by {by} | {ago}
ledger_empty = (Nothing in flight)
ledger_hidden = …{n} more not listed (see gofer_work_requests)
journal_heading = Work journal of the last 24 hours (newest first)
journal_line = - {time} {item} [{kind}] {by}: {text}
journal_empty = (No journal entries in the last 24 hours)
journal_hidden = …{n} older entries not listed (see gofer_work_get for one item's journal)

[steward.item]
line = - {id} [{status}] {title}
draft = (draft)
blocker = blocked: {text}
next = next: {text}
due = due
remind = reminder: {time}
last_activity = last activity: {ago}
offline = session offline
inflight = in flight: {items}
inflight_item = {kind}({state})
list_sep = ", "

[steward.ago]
none = never
just_now = just now
minutes = {n}m ago
hours = {n}h ago
days = {n}d ago

[steward.weekday]
sun = Sun
mon = Mon
tue = Tue
wed = Wed
thu = Thu
fri = Fri
sat = Sat

[steward.request_kind]
report = report request
handoff = hand-over request
summarize = tidy-up

[steward.request_state]
pending = pending
sent = sent, awaiting reply
answered = answered
failed = failed
expired = no reply (moved to tidy-up)

[steward.journal_kind]
report = report
note = note
status = status
steward = tidy-up
link = link

[steward.session]
title = Steward · {agent}
ready = After reading the above, reply with one line only: steward ready (with the number of open work items). Do not call any tool.

[steward.event]
due = work item {id} "{title}" {reason}
session = session {session} of work item {id} "{title}" is now {state}
drafts = {n} unsorted draft work items
state_offline = offline
state_ended = ended

[steward.review]
daily = Daily review
manual = Manual review
event = Event tidy-up
heading = ## {label} ({day})
no_items = No work item is marked as changed (forced review): only take notes and check reminders.
items_scope = Handle only these {n} work items (changed since the last review, due, or with events)
items_more = , {n} more changed too but are over this run's limit and wait for the next
items_colon = :
events_heading = Pending events:
event_line = - [{kind}] {detail}
events_more = - …{n} more
summary_step = {step}. Finally call gofer_steward_notes with action review_summary and text holding at most 300 characters of commentary (highlights, risks, what these things have in common; do not repeat the numbers); it is appended to today's daily digest.
closing = Do not mark anything done / dropped, do not merge, do not submit a job, do not perform any action of a Today card for the user. When done, reply with one line of summary.
skipped = no work item changed
timeout = the steward session did not finish this turn in time
closed = the steward service was shutting down
