# Texts of HTTP error responses (design 2026-10-27-i18n-design.md section 3 / 5): the
# detail of a keyed error (httpapi writeErrorKey) is err.<code> in the request language,
# and web/src/i18n/pages/errors.ts carries the same sentences for the console. The
# `error` field stays a fixed phrase scripts match on; only phrases that were never
# fixed English ones are texts here (names ending in _error).

[err]
messenger_unavailable_error = Messenger unavailable
messenger_unavailable = Session messaging is not enabled on this server (no job store or messenger configuration)
messenger_no_resident_error = This runner has no messenger
messenger_no_resident = Only the local runner and worker-type runners have a resident messenger
worker_offline_error = Worker offline
messenger_no_worker_registry = The server is not connected to a worker registry
messenger_worker_offline = Worker {worker} is not connected, so its sessions cannot be listed
worker_too_old_error = Worker too old
messenger_worker_too_old = Worker {worker} speaks protocol v{have}; listing sessions needs v{need} or later. Upgrade the worker first (gofer worker upgrade)
messenger_list_failed_error = Listing sessions failed
messenger_worker_no_project = This worker has no usable project, so the session-listing job cannot be dispatched (assign it a project first)
messenger_dispatch_failed = Dispatching the session-listing job failed
messenger_job_status = Job {job} status={status} exit={exit}
messenger_list_timeout = Session-listing job {job} timed out
workbench_turn_undeliverable = The session cannot receive messages right now: {reason} ({cause})
workbench_turn_undeliverable_plain = The session cannot receive messages right now: {cause}
workbench_turn_no_open_turn = The session cannot receive messages right now: it is not waiting for a reply
workbench_turn_ended = The session cannot receive messages right now: the session has ended
undeliverable_ended = the session has ended
undeliverable_no_runner = the session has no registered runner
undeliverable_no_project = the session directory belongs to no configured project, so no messenger can be dispatched
undeliverable_no_messenger = the messenger executor is not configured
undeliverable_no_tmux = the session is not in tmux and has no other delivery route
undeliverable_handed_off = the session has been taken over; release the takeover first
undeliverable_inject_failed = the message could not be typed into the terminal ({cause})
undeliverable_deliver_failed = the delivery command failed
undeliverable_unknown = unknown reason
steward_no_registry = No agent registry
steward_agent_missing = Agent "{agent}" does not exist (set steward.agent to an installed acp-agent)
steward_agent_not_acp = Agent "{agent}" is not an acp-agent (the steward needs a resident ACP session)
agent_command_not_found = the command was not found on this machine
steward_agent_unavailable = Agent "{agent}" is unavailable: {why}
tunnel_forwarder_too_old = This forwarder is too old to be stopped remotely; press Ctrl+C on {host}
tunnel_worker_unknown = The state of worker "{worker}" is unknown; the listener is started and dials on first connection as forwarding does today
tunnel_worker_offline = Worker "{worker}" is offline; the listener is started and new connections dial once the worker reconnects
session_approval_internal = a submitted job cannot carry its own approval policy; configure it per mail agent (mail.agents.<name>.approval) or per project (projects.<key>.approval)
today_advice_steward_only = only the steward (or a person) advises on Today cards
worker_upgrade_too_old = This worker is too old and must be upgraded by hand once (worker {worker} speaks protocol v{have}, remote upgrade needs v{need})
preview_disabled = Job preview is not enabled on this server (server.preview.enabled)
preview_job_not_running = The job is not running, so a preview cannot be created for it
preview_runner_unsupported = Preview only works for jobs that run on the server itself; runner {runner} is not supported yet
preview_port_invalid = The port must be between 1 and 65535
preview_pool_exhausted = The preview port pool is full; revoke a preview or widen server.preview.port_range
preview_not_active = The preview is no longer active, so it cannot be renewed; create a new one
trigger_not_found = No enabled trigger has this name
trigger_unauthenticated = The trigger signature is missing or does not match
trigger_replay_window = The trigger timestamp is outside the accepted window
trigger_rate_limited = This trigger is receiving requests too fast; retry in {seconds}s
trigger_body_too_large = The request body is larger than this trigger accepts
trigger_header_too_large = A request header is larger than this trigger accepts
trigger_body_not_json = The request body must be a JSON object
trigger_body_unreadable = The request body could not be read
trigger_input_invalid = A field this trigger needs is missing from the request or too large
trigger_event_id_invalid = The external event id is too long
trigger_event_conflict = This event id was already used with a different body
trigger_event_in_flight = This event is being processed by another request; retry shortly
trigger_owner_denied = The trigger owner may not submit jobs right now
trigger_ceiling_denied = The trigger owner's ceiling does not allow this job
trigger_request_invalid = The job this trigger would start is not valid; ask the operator to check the trigger configuration
trigger_unavailable = The trigger is temporarily unavailable; retry later
trigger_read_job_credential = A job credential cannot read trigger configuration
