# Short texts of notifications: IM / webhook / desktop titles, bodies and link labels
# built by internal/notify and by the job service's notice senders. Background text:
# the language is the notification's project, else the server's.
# Values keep no leading / trailing whitespace (INI), so separators and newlines stay
# in the code; placeholders are named ({name}).

[notify.common]
link_default = Open in gofer
truncated = … (truncated, see the link for the full text)
link_job = View job
link_plan = View plan
link_session = View session
link_line = {label}: {url}

[notify.interaction]
default_summary = The agent asks for a human decision
options = Options:
title = Approval needed: {text}

[notify.approval]
reason = Reason: {reason}
what = To run:
expires = Expires: {time} (cancelled if not approved by then)
default_text = A job waits for your approval before it runs
title = Awaiting approval: {title}
link = Approve

[notify.session_reply]
summary = Turn {turn} · {agent} · {project}
idle = Ends automatically when idle at {time}
title = Session waits for your reply: {title}
link = Open session

[notify.session]
waiting_title = Session waiting for a reply · {label}
waiting_link = Open session to reply
attention_title = Session needs confirmation · {label}
attention_default = The session waits for a confirmation (permission or choice) and needs you back at the terminal.
handed_off_title = Session taken over on the web · {label}
handed_off_text = A new process took the session over with `--resume`; continue the conversation in that terminal.
handed_off_link = Open takeover terminal
released_title = Session takeover released · {label}
released_text = Job {job}, which held the session, has ended ({reason}); the session is back in its original terminal and can be relayed again.
nudge_title = Session nudge paused · {label}
nudge_text = Nudge {nudge} paused itself automatically: {reason}. Resume it from the session drawer once the session is reachable again.

[notify.update]
title = New gofer version {latest}
text = Current version {current}, latest version {latest}
link = View update

[notify.job]
label_needs_review = Job awaits review
label_awaiting_approval = Job awaits approval
label_interaction = Job awaits confirmation
label_session_reply = Session waits for your reply
headline = {label}: {title}
end_reason = End reason {reason}
end_manual = ended manually
end_idle = idle timeout
end_max_session = exceeded the session time limit
end_failed = failed: {reason}

[notify.desktop]
open = Open
merge_awaiting_approval = jobs await approval
merge_needs_review = jobs await review
merge_interaction = jobs await confirmation
merge_session_reply = sessions wait for your reply
merge_other = notifications ({type})
merge_more = … and {n} more
