# Web Push notifications (internal/webpush): titles, bodies and button labels.
# The language is the job's project language (else the server's); the test notification
# uses the language of the request that pressed the button.

[webpush.title]
interaction = Waiting for your approval or answer
review = Needs review
approval = Needs approval
plan_blocked = Plan blocked
test = gofer test notification
terminal_job = Job finished
terminal_session = Session ended: {reason}
awaiting_reply = Session waiting for your reply: {title}
child_wake_failed = A child receipt could not be delivered

[webpush.body]
test = Web Push is connected on this device.
turn = Turn {turn} · {agent} · {project}
idle_end = Ends automatically at {time} if it stays idle
child_wake_failed = Child job {child} has a result, but the receipt cannot reach its resident parent {parent} — check it yourself

[webpush.action]
allow = Allow
reject = Reject

[webpush.end_reason]
manual_end = Ended manually
idle_timeout = Idle timeout
max_session = Exceeded the session's total time limit
unrecorded = Failure reason not recorded
failed = Failed: {reason}
