# Stage-flow reminders injected into a session: one line per turn, one sentence at session
# start. The language is the one of the project the receiving session belongs to.

[stage.note]
active = Current flow: work item {work}, step {no}/{total} "{step}". When this step is done run gofer stage done; to go back run gofer stage back --reason "<why>"; if stuck run gofer stage blocked --reason "<why>".
blocked = Current flow: work item {work}, step {no}/{total} "{step}" is marked blocked ({reason}). Run gofer stage done to unblock; to go back run gofer stage back --reason "<why>".
start = For implementation work, run gofer stage start <issue> first (add --size small for a small change), then begin.
