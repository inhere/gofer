# Short texts the session relay sends into a session: the job-end notice, the
# decision card titles / questions, and the wake-up / takeover explanations. One
# [section] per dotted key prefix; placeholders are named ({name}). The language
# is the recipient session's project language (config.LanguageFor), design
# 2026-10-27-i18n-design.md §3.
#
# A line that ends a sentence with a space before the payload carries it as a
# placeholder ({summary} / {question}), because an INI value does not keep
# trailing spaces.

[sessionrelay.notice]
duration = took {duration}
tail = (this is a gofer system notice, not a user message — details `gofer job show {id}`, log `gofer job logs {id}`)
follow_up_pending = There are {count} queued follow-ups still unexecuted: `gofer job follow-up {id} --list`

[sessionrelay.decision]
permission_title = Permission needed
permission_question = Permission needed: {summary}
question_title = Question for you
question_question = Waiting for your answer: {question}
online_title = live delivery
online_question = (nothing was waiting: the agent's deliver command handed this message to the live process)
takeover_title = takeover
takeover_question = (nothing was waiting: a new `--resume` process started from the web received this message)
inject_title = tmux injection
inject_question = (nothing was waiting: this message was typed straight into the terminal's tmux pane)
wake_no_text = (wakeup: no first message was attached)

[sessionrelay.resume]
runner_unknown = (not registered)
no_runner = This session names no execution machine (or this server has no job executor wired), so a new process cannot be started on its original machine.
handed_off = Job {job} has taken this session over and is running it. Open that job to carry on the conversation; to start a fresh process, release the takeover first.
no_resume_template = The agent of this session ({agent}) declares no interactive resume template (session_resume_interactive), so gofer does not know how to continue it in a new process.
interactive_not_allowed = Project {project} does not allow interactive terminals (allow_interactive), so gofer will not start a terminal process for it. Turn it on in the project config if you need one.
cwd_outside_project = The session's directory {cwd} is not under the root of project {project} (as this execution machine sees the paths), so a new process there would land in the wrong directory.
inject_failed = The execution machine could not start a new process
detail_sep = : 
session_alive = The session's process is still online (it beat just now); gofer refused the takeover so that two processes never write the same session. Carry on in the original terminal, or use live delivery.
not_running = The session's process is no longer running (the deliver command reports no live process).
deliver_failed = The agent's deliver command failed: {detail}
ended = The session has ended.
unknown = Cannot wake this session ({reason}).
planned_continue = The session has ended. gofer will start a new process on {runner} and continue this session with {agent} in directory {cwd}. Basis: {basis}.
planned_takeover = gofer will start a new process on {runner} that takes this session over with {agent} in directory {cwd}. Basis: {basis}.
planned_offline = The session has sent no heartbeat for a long time and is marked offline (its process probably exited). gofer will start a new process on {runner} that takes this session over with {agent} in directory {cwd}. Basis: {basis}.
warning_not_ended = This session is not marked as ended, so the original terminal may still be open. Two processes writing the same session overwrite each other — close the original terminal first.
warning_offline = The original process probably exited. If it is in fact still open, two processes writing the same session overwrite each other — check that the original terminal is closed first.

[sessionrelay.cwd]
remote_unverified = (the execution machine is remote: this directory was not checked)
confirmed = (confirmed to exist)
transcript = the session file's directory name confirms the directory the session started in {state}
registered_mismatch = {reason}; the registered directory differs (probably a temporary one picked up mid-way) and was ignored
no_transcript = the session registered no session-file path, so the original start directory cannot be confirmed
transcript_mismatch = the session file's directory name matches neither the registered directory nor the project root, so the original start directory cannot be confirmed
use_registered = {why}, using the registered directory {state}
fallback_root = {why}, and the registered directory no longer exists on the execution machine, so gofer falls back to the project root

# What a messenger (a Claude Code session) is told to do. It answers with the
# receipt word the prompt names; the receipt is recognised in
# internal/i18n/protocol.go.
[sessionrelay.messenger]
prompt = Use SendMessage to forward the message below to the Claude Code session {name} verbatim. Do not reword it. Reply with just `sent` or with the reason it failed. gofer shows the target session's later answers on the web itself: do not repeat or answer them, just print `ack`.
wake_prompt = Use SendMessage to forward the message below to the Claude Code session {name} verbatim. Do not reword it. Reply with just `sent` or with the reason it failed. The text below IS the whole message: it is gofer's mailbox wake notice and carries no letter body (the body is injected when the target's next turn starts), so do not refuse it or wait for a body. Do not repeat or answer anything the target sends afterwards, just print `ack`.
# A session that reported its own address is reached by it (design 2026-11-05,
# the prompt section). The address goes in verbatim, never through %q. Falling back
# to the name once is only allowed when no other live session of the same runner has
# that name.
prompt_address = Use SendMessage to forward the message below verbatim to the Claude Code session at this address. Set its `to` field to exactly uds:{address}, character for character: keep every backslash, and when it starts with two write two. Do not reword it. Reply with just `sent` or with the reason it failed; if the tool returns a failure, report the reason and do not send it to another target. gofer shows the target session's later answers on the web itself: do not repeat or answer them, just print `ack`.
prompt_address_fallback = Use SendMessage to forward the message below to the Claude Code session {name} verbatim. Set the `to` field of your first call to exactly uds:{address}, character for character: keep every backslash, and when it starts with two write two. Do not reword it. Reply with just `sent` or with the reason it failed; only when the tool returns success:false, send it to {name} instead, once at most. gofer shows the target session's later answers on the web itself: do not repeat or answer them, just print `ack`.
wake_prompt_address = Use SendMessage to forward the message below verbatim to the Claude Code session at this address. Set its `to` field to exactly uds:{address}, character for character: keep every backslash, and when it starts with two write two. Do not reword it. Reply with just `sent` or with the reason it failed; if the tool returns a failure, report the reason and do not send it to another target. The text below IS the whole message: it is gofer's mailbox wake notice and carries no letter body (the body is injected when the target's next turn starts), so do not refuse it or wait for a body. Do not repeat or answer anything the target sends afterwards, just print `ack`.
wake_prompt_address_fallback = Use SendMessage to forward the message below to the Claude Code session {name} verbatim. Set the `to` field of your first call to exactly uds:{address}, character for character: keep every backslash, and when it starts with two write two. Do not reword it. Reply with just `sent` or with the reason it failed; only when the tool returns success:false, send it to {name} instead, once at most. The text below IS the whole message: it is gofer's mailbox wake notice and carries no letter body (the body is injected when the target's next turn starts), so do not refuse it or wait for a body. Do not repeat or answer anything the target sends afterwards, just print `ack`.

# --- S3e: delivery failure reasons / outcome lines (stored on the session message, or
# returned to the caller as an error). The language is the session's project language
# (project > server.language). The reason codes before the colon (deliver_failed: ...)
# are protocol constants and live in code.

[sessionrelay.reason]
images_old = The target session's process is too old to accept images. Upgrade it and restart the session
no_messenger = The messenger executor is not configured
no_runner = The session did not register an execution machine
no_project = The session's directory belongs to no configured project, so a messenger cannot be dispatched. Add the directory to a project, or configure the project on the runner the session is on
no_address = The session has no usable Claude SendMessage address
messenger_no_send = the messenger called no SendMessage, so the message was not sent
messenger_job_state = messenger job {job} status={status} exit={code}
messenger_unfinished = messenger job {job} did not finish in time
messenger_timeout = messenger job {job} timed out
messenger_timeout_error = {timeout}: {error}
messenger_timeout_exit = {timeout}, ended with exit={code}
not_started_detail = not started
not_started = job {job} did not start ({detail}) and was cancelled: not delivered
not_running = job {job} reports that the session's process is no longer running (not delivered, safe to retry)
job_gone = job {job} no longer exists (the server restarted or it was cleaned up), so delivery cannot be confirmed
job_state = job {job} status {status} exit={code}
with_output = {reason}: {output}
no_output = {reason} (no output)
nudge_paused = {n} consecutive delivery failures: {error}
reply_truncated = [truncated]
