# The memory text `gofer memory` / `repo status` print (phase 2 of
# docs/design/2026-10-27-i18n-design.md). zh-CN keeps the text an existing
# deployment printed before the migration. Note: [prime.memory_format] in
# prime.ini is the text injected FOR an agent; the two are not mixed.

[cli.tracker.memory]
expired = (expired)
stale = (not updated for long)
source = source {source}
flags_head = flags: {count} (needs review; clear with `gofer memory unflag {key}`, rewriting the content clears them too)
expires_in = expires in {n} days
expires_expired = expired
kind_inferred = {kind} (inferred from the prime tag)
summary_derived = {summary} (taken from the content — write one with --summary)
archived_at = archived {age}

[cli.tracker.write]
summary_required = memory content is {n} chars (> {max}): --summary "<one sentence: what this says and when to read it>" is required

[cli.tracker.doctor]
flagged_detail = {count} time(s) · latest: {reason}
flagged_review = (after the review: `gofer memory unflag <key>`)
stale_marker = ⚠ may be out of date

[cli.tracker.scope]
confidence_high = high
confidence_medium = medium
confidence_low = low
basis_source = the cwd of source {source} is inside {dir}/
basis_name = a key prefix / tag matches the sub-repository {dir}
basis_mention = the summary / content names the sub-repository {dir}

[cli.tracker.repo]
hooks_checked = checked
sync_unsynced = not synced
sync_synced = synced
