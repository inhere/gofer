# Runtime text of `gofer init` / `gofer config` (phase 2 of
# docs/design/2026-10-27-i18n-design.md). One line per value, no embedded newlines
# (the code adds the leading indentation and the line break). The zh-CN file
# reproduces the pre-migration text verbatim; this is its English rewrite.

[cli.setup.init]
worker_global = generated the global worker config {path}; edit it and run `gofer worker` (it picks that path up automatically)
worker = generated the worker config {path}; edit it and start with `gofer worker --worker-config {path}`
server = generated {path}; edit it and check it with `gofer config validate`
server_global_hint = tip: export GOFER_CONFIG={path} to use it from any directory
client_env = generated the client node .env {path}; fill in GOFER_SERVER_ADDR/GOFER_SERVER_TOKEN and commands like `gofer job list` work
client_env_lang = language of this node's CLI output: en or zh-CN (uncomment the next line to use it; unset follows the machine locale)
workspace_hint = the default workspace {dir} is ready: register it on the server as the `{project}` project (with this worker's runner in allowed_runners) and the worker can take repo-less jobs
workspace_comment_1 = default workspace: a safe place for temporary work that belongs to no repository (change the
workspace_comment_2 = path with --workspace / GOFER_WORKSPACE). `job run` without -p falls back to it when the cwd matches no project.

[cli.setup.hooks]
skip_jcode = skipped jcode: it has no project-level hook config (add --global, or -o <JCODE_HOME dir>)
skip_agent_missing_dir = skipped {agent}: {dir} not found
skip_prime_only = skipped {agent}: it has no SessionStart memory injection (--prime-only covers claude / codex only)
memory_removed = removed {agent}'s memory injection from {path} (SessionStart / PreToolUse, {count} entries)
memory_written = wrote {agent}'s memory injection to {path} (SessionStart / PreToolUse, {count} entries)
hooks_removed = removed gofer's {agent} hooks from {path} ({count} entries)
hooks_created = generated {path} with gofer's {agent} hooks ({count} entries)
hooks_merged = merged gofer's {agent} hooks into {path} ({count} entries, {replaced} old entries replaced)
note = note: {note}
tip = tip: {tip}
relay_usage = usage: before you leave the desk run `gofer session relay on`; the web Sessions page shows and answers it; type anything in the terminal after you are back to close it (or answer /off on the web)
duplicates_head = note: the projects below already carry project-level gofer hooks; next to the global hooks the same event fires twice (claude de-duplicates identical commands, assume the others do not) — remove the project-level ones:

[cli.setup.skill]
skip_missing_dir = skipped: {dir} not found
no_dest_dir = no skill directory to write to (-a all writes only to agent config dirs that already exist); drop -a all to create them
installed = installed the gofer-usage skill to {path} ({count} files):
global_hint = tip: a global skill is visible to every project

[cli.config.show]
diagnostic_note = (diagnostic view: an overlay takes effect only where serve can read it — same host or container; otherwise only the global values are shown)

[cli.config.validate]
policy_projects = projects are pushed by the server; {count} effective now (read from the policy cache{note})
no_projects = no roots (policy mode) and no projects (legacy) — this worker can run no job
legacy_projects_deprecated = the `projects:` section is deprecated (the server pushes the policy now), migration: {doc}; it still works in this version
roots_empty_policy = policy mode needs at least one root (roots is empty)
root_from_empty = from must not be empty
root_to_empty = {from} -> (to must not be empty)
root_dup_from = duplicate from: {from} (each from maps only once)
root_to_missing = {from} -> {to} (to is not an existing directory)
roots_overlap = {longer} overrides longer paths under {shorter} (longest prefix wins)
guards_unset = guards unset = nothing is tightened (exec/interactive all allowed); declare allow_exec / allow_interactive explicitly
policy_cache_error = , cache unusable: {err}
policy_no_cache = , the worker is not running or has not received a policy yet
