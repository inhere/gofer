# Runtime text of `gofer worker` / `gofer worker init` / `gofer worker doctor`
# (phase 2 of docs/design/2026-10-27-i18n-design.md). One line per value, no
# embedded newlines. The zh-CN file reproduces the pre-migration text verbatim;
# this is its English rewrite.

[cli.worker.upgrade]
pending = upgrade running (target {version}, target sha256 {sha})
succeeded = upgraded to {version} (took {took})
rolled_back = rolled back: {err} (still running {from}, took {took})
failed = upgrade failed: {err} (still running {from}, took {took})
dir_not_writable = cannot self-upgrade: directory {dir} is not writable by user {user} (owner: {owner}). Install gofer in a user-writable directory such as ~/.local/bin and update the service/start script, run the worker as the owner, or manually replace it with sudo and restart the worker.

[cli.worker.daemon]
started = gofer worker({id}) started in the background pid={pid} log={log}

[cli.worker.init]
registered = ✓ registered worker {id} on the server; the admin token was not written to disk
connected = ✓ connected to {server}, protocol v{protocol}, {count} project(s) can be dispatched to {projects}
no_roots = warning: no usable roots mapping — this worker can run no server project yet; add --roots <from>=<to> and run this again
agents_detected = detected agents ({count} installed):
agent_missing = not installed
no_agents = tip: this machine has no usable agent CLI, so the generated worker runs exec jobs only; install one and run this again, or edit the agents section by hand
token_env_failed = warning: setting {name} failed: {err}
written = wrote {worker}, {env}
doctor_head = doctor run:
doctor_failed = worker init: the doctor reported {count} failure(s); fix the rows above and run `gofer worker doctor` again
start_hint = start it: gofer worker -d        (the worker stays in the background; only the server ships a Windows logon task — run this command or register a service)
online_warning = warning: {id} already has a connected worker on the server — starting this one replaces its connection and fails its in-flight jobs; start only if that is the intent
roots_explicit = using {count} explicit --roots mapping(s) (inference skipped)
root_missing_local = warning: the project directory does not exist on this machine (after mapping): {path} — dispatches to that project fail; pin it with --roots
root_state_ok = ✓ exists
root_state_missing = ✗ missing
root_accept_prompt = {from} → {to}  [{state}]  accept? [Y/n/edit] 
root_skipped = skipped {from} (projects under that prefix are never dispatched here)

[cli.worker.doctor]
no_worker_id = worker_id is not set (it must equal a key in server.workers)
no_urls = server_link.urls is empty (the worker does not know which hub to dial)
mode_policy = policy: {roots} roots, {projects} project(s) effective now (pushed by the server, read from the policy cache)
mode_legacy = legacy: {projects} project(s) in the local projects section — deprecated (the server pushes the policy now), migration: {doc}; it still works in this version
mode_empty = no roots (policy mode) and no projects (legacy) — this worker can run no job
connect_disabled = --connect=false: the hub register handshake is skipped (urls were only checked for TCP reachability)
url_parse_failed = {url}: cannot parse the url: {err}
url_no_scheme = {url}: scheme missing (want ws:// or wss://)
url_bad_scheme = {url}: the scheme must be ws:// or wss:// (got {scheme})
url_no_host = {url}: host missing
url_host_failed = {url}: host {host} does not resolve: {err} — inside a container use the host IP (e.g. 192.168.65.254)
url_unreachable = {url}: TCP unreachable at {addr}: {err}
url_reachable = {url}: reachable ({addr})
token_from_env = from the environment variable {name} (value not printed)
token_env_empty = {name} is empty: export the token from <config-dir>/.env or the environment (value not printed)
token_inline = a plaintext token from worker.yaml (prefer token_env so no secret lands in the repo)
token_unset = token_env / token are both empty: the worker registers only if the server has no auth either
root_from_empty = {from} -> {to} (from must not be empty)
root_to_empty = {from} -> (to must not be empty)
root_dup_from = duplicate from: {from} (each from maps only once)
root_to_missing = {from} -> {to} (to is not an existing directory)
root_to_unreadable = {from} -> {to} (to cannot be listed: {err})
guards_unset = guards unset = nothing is tightened (exec/interactive all allowed); declare allow_exec / allow_interactive explicitly
max_concurrent_set = {value} (the hub's in-flight limit)
max_concurrent_unset = not set (the hub does not limit concurrency); set a value from this machine's CPU / memory
tools_none = none declared (the job prompt carries no tool list)
tools_missing = {declared} declared, {missing} not found on this machine: {names}
tools_ok = {declared} declared, every executable was found
connect_skipped = worker {id} is already running on this machine (pid {pid}): the register probe is skipped — it would replace its hub connection and fail its in-flight jobs; see the log {log}, and `gofer worker stop {id}` first if you really want to probe
connect_no_urls = server_link.urls is empty, nothing to probe
connect_rejected = {url}: registration rejected: {reason}
connect_failed = every hub address failed: {failures}
dial_401_hint = (401: the hub rejected the token — check that the value server_link.token_env resolves to matches server.workers.<worker_id>.token)
verdict_failed = FAILED — {failures} check(s) failed, {warnings} warning(s)
verdict_warn = OK — 0 failed, {warnings} warning(s)
verdict_ok = OK — all checks passed
