# Prime and tracker context text. User-authored issue, memory and plan content is not translated.

[prime.header]
work_hint = Work item: when asked for a report, run `gofer work report <id> --goal … --status … --blocker … --next …` (`gofer work ls` lists ids).
tracker_hint = Tasks: `gofer issue ready|show <id>|update <id> --claim|comment <id> "…"|close <id>`; memories: `gofer memory ls <keyword>` (search key+summary+content) / `show <key>` (full text) / `set <key> "…" --summary "one sentence"`; inspect tracker changes with `gofer repo status --changed`, never diff `.gofer/tracker/*.jsonl`.
memory_write = Memory: use `--kind rule` for lasting agreements (not progress); put progress in a plan handoff or use `--kind handoff` (expires after 14 days by default); add `--summary` when the body exceeds 200 characters.
takeover = Take over: for an issue use `gofer issue brief <id>`; for a plan use `gofer plan brief <id>` (context tree, design, related commits, jobs / plan and applicable memories in one view).
commit_local = Commit each functional change locally by default; pushing requires user approval; commit `.gofer/tracker/*.jsonl` with the functional change; check `git status` before committing to ensure no unrelated files are included.
commit_ask = Ask before committing; pushing requires user approval; commit `.gofer/tracker/*.jsonl` with each approved functional change.
commit_none = Do not commit this change in the repository; pushing requires user approval.
handoff_heading = ## Handoff notes for active plans
handoff_line =   Handoff notes v{version} ({by}, {at}):
plans_heading = ## Active plans
handoff_cut = [handoff notes truncated]

[prime.memory]
flag_hint = When an injected memory / rule no longer matches reality, run `gofer memory flag <key> --reason "…"` (add `--global` / `--project <p>` for scoped memories); do not silently work around it.

[prime.rules]
header = ## Rules gofer injects (higher priority than the task's other instructions)

[prime.layout]
commit_heading = ## Commit policy
separator = ;
focus_heading = ## Focus (automatic, {clock})
active_heading = In-progress issues
active_more = {n} more: `gofer issue ls --status in_progress`
active_stale = (claimed, no update for {n} days)
ready_heading = ready first {n}
ready_more = {n} more: `gofer issue ready`
index_heading = Memory index ({n} entries; use `gofer memory show <key>` as needed)
index_more = {n} more: `gofer memory ls <keyword>`
handoff_title = Handoff (latest {n}, not expired)
handoff_more = {n} more: `gofer memory ls --kind handoff`
handoff_expiry = {n} days until expiry
truncated = [Content truncated: use gofer issue ls / gofer memory ls to see everything]
scoped_cut_global = [global/project memories truncated]

[prime.memory]
rules_heading = Rules
