# Text the server generates for the today page (internal/today) and the web shows: card
# tags, titles, summaries, "what holds this up" lines and button labels. Read-time text
# follows the request language (Accept-Language, else server.language); text that is
# stored (the snooze record, the archive reason of an adopted memory suggestion) is in the
# server language. Placeholders are named.

