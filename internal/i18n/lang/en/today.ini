# Text the server generates for the today page (internal/today) and the web shows: card
# tags, titles, summaries, "what holds this up" lines and button labels. Read-time text
# follows the request language (Accept-Language, else server.language); text that is
# stored (the snooze record) is in the
# server language. Placeholders are named.

[today.tag]
interaction = Question
tool_approval = Tool approval
plan_question = Plan question
permission = Permission needed
question = Your answer needed
relay = Session awaiting reply
review = Awaiting review
approval = Awaiting approval
mail = Mailbox
plan_blocked = Plan blocked
awaiting_merge = Awaiting merge

[today.action]
reply = Reply
confirm = Confirm
cancel = Cancel
allow = Allow
allow_always = Always allow
allow_always_label = Always allow: {label}
deny = Deny
deny_note = Deny with a reason
ack = Mark read
accept = Accept
rerun = Re-run with notes
diff = View diff
approve = Approve
details = View details
enable_schedule = Enable
assign = Assign
resume = Resume
open_plan = Open plan
todo_done = Mark done
todo_skip = Skip

[today.card]
interaction_title = {agent} requests {what}
permission_what = permission
mail_title = {n} letter(s) waiting to be assigned
mail_no_address = (no address)
mail_summary = {origin} -> {to}: {body}
mail_from_session = session {id}
mail_from_job = job {id}
mail_from_caller = caller {caller}
mail_from_unknown = unknown sender
plan_stuck = The plan stopped on a failed item; decide whether to resume or edit the todo

[today.card.awaiting_merge]
awaiting_merge = Job {job} finished; merge branch {branch} to complete this todo
pushed = Job {job} pushed or opened a PR for branch {branch}; merge it to complete this todo
delivery_failed = The delivery of job {job} (branch {branch}) failed; fix it and merge, or close the todo
discarded = The worktree of job {job} (branch {branch}) was discarded without a merge; close the todo (done or skipped)
merged_unmarked = Branch {branch} is merged but the todo could not be marked done; mark it done

[today.blocks]
holding = holding {agent} {what} {duration}
session = session
lock_worktree = holding a worktree
lock_dir = holding the directory lock
plan_after = {n} item(s) behind plan {plan} waiting
plan_pending = plan {plan} has {n} item(s) not started
approval_wait = cannot start until approved
join = {a}; {b}

[today.duration]
minutes = {n} min
hours = {n} h
days = {n} d

[today.snooze]
until_time = Snoozed until {time}
until_job = Waiting for job {id} to end

[today.status]
review_failed = The steward's review failed today
agent_unavailable = The steward agent is unavailable
runner_offline = runner {name} is offline

