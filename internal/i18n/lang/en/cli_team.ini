# `gofer team` command text (plan 2026-11-26-team-plan.md §2.5).
# One line per value; the code adds line breaks and leading indent.

[cli.team]
desc = Teams: one leader seat plus member seats of a project; the members report to the leader and the leader routes the work
arg.name = team name (unique in the project)
arg.team = team name or id; name@project for another project
arg.seat = seat name or id of the team's project
arg.text = the text to send to the team
flag.project = project key (default: the project of the current directory)
flag.leader = leader seat (name or id)
flag.brief = description for the leader: a text, or @<file> to read it from a file
flag.json = print the server's answer as JSON
flag.limit = how many records to list (default 100, at most 500)

[cli.team.ls]
desc = List the teams of a project: name, relay mode, merge window and description
empty = no teams yet; create one with `gofer team add <name> --leader <seat>`

[cli.team.add]
desc = Create a team with a leader seat (add members with `gofer team member add`)
created = team {name} created in {project} (leader {leader})
hint = add members with `gofer team member add {team} <seat>`, then talk to the team with `gofer team say {team} "..."`

[cli.team.show]
desc = Show a team: the roster (leader first, with state, current step and last activity) and the latest routing decisions
relay = {mode} (round limit {round}, daily limit {daily}), merge window {merge}s
roster_head = roster ({n}):
routes_head = routing decisions, newest first ({n}):

[cli.team.set]
desc = Change a team's leader or description ("-" clears the description)
nothing = nothing to change: pass --leader or --brief
updated = team {name} updated (leader {leader})

[cli.team.rm]
desc = Archive a team (its name and seats are free again; the history is kept)
archived = team {name} archived (the name is free again; the history is kept)

[cli.team.say]
desc = Send a text to the team as the person (a letter to team:<name>): text naming @member goes to those members only, otherwise it goes to the leader
sent = sent to team
need_text = the text to send is required

[cli.team.routes]
desc = List the routing decisions of a team (which rule picked which seats), newest first
empty = no routing decisions recorded yet

[cli.team.evals]
desc = List the leader's evaluations of its turns, newest first
empty = the leader has not evaluated a turn yet

[cli.team.eval]
desc = Record how your turn went as a team leader (only the session or job sitting in the leader seat may)
flag.outcome = dispatched (you sent work out), idle (nothing to do) or failed (you could not go on)
flag.reason = why, in a sentence
err.outcome = --outcome must be dispatched, idle or failed
done = Recorded: {outcome}

[cli.team.member]
desc = The member seats of a team (the leader is set with team add --leader or team set --leader)

[cli.team.member.add]
desc = Add a seat to the team as a member
added = seat {seat} added to team {team}

[cli.team.member.rm]
desc = Remove a member seat from the team (the seat itself stays)
removed = seat {seat} removed from team {team}

[cli.team.err]
need_name = team name or id required
need_project = cannot tell which project to create the team in; pass --project <key>
not_found = no team named "{name}" (see `gofer team ls`)
not_found_in = no team named "{name}" in project "{project}" (see `gofer team ls`)
ambiguous = team "{name}" exists in {n} projects; name one of them:{list}
brief_file = --brief @ needs a file path (@- reads standard input)
brief_read = --brief @{path}
