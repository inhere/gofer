# `gofer seat` command text (design 2026-11-18 resident-sessions §4).
# One line per value; the code adds line breaks and leading indent.

[cli.seat]
desc = Resident seats: long-lived working positions of a project; bind a session to one and its charter is injected on every start
arg.name = seat name (unique in the project)
arg.seat = seat name, or name@project for another project
flag.project = limit to one project key (default: the project of the current directory)
flag.purpose = one-line purpose of the seat
flag.charter = standing instruction text, or @<repository-relative path> to the file holding it
flag.charter_template = use a shipped charter template instead of --charter (flow: design → review → plan → doing → verify)
flag.kind = terminal (an agent CLI session) | acp (a gofer session job), default terminal
flag.agent = agent key of the seat (default: the sitting session's agent)
flag.cwd = directory of the seat (default: the current directory)
flag.ref = session id (terminal seat) or job id (acp seat); default: the session of the current directory
flag.replace = take the seat over from the session sitting in it
flag.shell = which command spelling to print: sh | ps (default: this machine's)
flag.restart = start the ended ACP session of the seat again
flag.archived = include archived seats
flag.all = list every caller's seats (needs seat.manage.others)

[cli.seat.ls]
desc = List the seats of a project: name, kind, state and the session sitting in each
empty = no seats yet; create one with `gofer seat add <name> --purpose "..."`

[cli.seat.add]
desc = Create a vacant seat (it holds a directory, a purpose and a charter)

[cli.seat.show]
desc = Show one seat: state, current session, purpose and charter

[cli.seat.set]
desc = Change a seat's purpose / charter / agent ("-" clears a field)

[cli.seat.rm]
desc = Archive a seat (its name is free again; the history is kept)

[cli.seat.bind]
desc = Put a session into a seat (default: this directory's session); the seat's charter is injected on its next start

[cli.seat.unbind]
desc = Give a seat up (the session stays registered, it just leaves the seat)

[cli.seat.open]
desc = Print how to get back into a seat: the command and the machine to run it on (acp: the workbench thread)
