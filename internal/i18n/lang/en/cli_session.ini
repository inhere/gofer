# `gofer session` command text (phase 2 of docs/design/2026-10-27-i18n-design.md).
# One line per value; the code adds line breaks and leading indent.

[cli.session.flag]
inject_send_held = instead of setting a mode, send the messages waiting for this session right now (send now)

[cli.session.list]
hidden = {count} more session(s) with no activity for over {days} day(s) are hidden; use --all to see them
maybe_offline = (may be offline)

[cli.session.inject_mode]
auto_note = messages are typed only when the input area is confirmed empty; otherwise they wait for the session's next hook (the web page's "send now" does)

[cli.session.relay]
on_note = every stop now waits on the gofer web session page until you reply there (/off releases it)

[cli.session.wait]
reached = session {sid} is {state}

[cli.session.screen]
empty = session {sid} shows nothing yet

[cli.mail.pause]
desc = Pause mail delivery to a session

[cli.mail.resume]
desc = Resume mail delivery to a session

[cli.mail.ack]
desc = Acknowledge a letter without sending a reply
done = mark the letter done instead of received

[cli.mail]
sid = session id
paused = mail delivery paused for session {sid}
resumed = mail delivery resumed for session {sid}
acked = letter #{id} acknowledged: {kind}
rcpt_delivered = delivered {time}
rcpt_replied = replied
rcpt_unreplied = not replied

