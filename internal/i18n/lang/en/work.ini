# Short texts the work-item service sends into a session, and the work-item status
# names. The language is the item's project language (config.LanguageFor).

[work.request]
handoff = Work item {item} "{title}" is now {status} (request {request}). Write a hand-over: how far you got, where you are stuck, and the first step when you come back. Run `gofer work report {item} --request {request} --summary "<how far you got>" --blocker "<where you are stuck>" --next "<first step back>"` (leave out the fields you do not need).
report = Work item {item} "{title}" — current progress (request {request}). Run `gofer work report {item} --request {request} --goal "<goal>" --status <active|needs_me|waiting_resource|needs_onsite|review|parked> --blocker "<where you are stuck>" --next "<next step>" --summary "<how far you got>"` (leave out the fields you do not need; use --status active once nothing blocks you).
issue = Filed as issue {id}
todo = Filed as todo {id}

[work.status]
active = active
needs_me = needs me
waiting_resource = waiting on a resource
needs_onsite = needs me on site
review = awaiting review
parked = parked
done = done
dropped = dropped

# --- S3b: text the server generates and writes into a work item's journal, and the
# display text rendered when the item is read. Persisted text (journal lines, request
# ledger reasons) is generated once in the item's project language; read-time text
# (health reasons, the digest) follows the request language. Placeholders are named.
# Values do not keep leading or trailing whitespace, so joins are placeholders too.

[work.journal]
ask_sent = Relayed to session {session}: {text}
dispatch_archive = Archived
dispatch_drop = Dropped
mail_delivered = Letter #{id} delivered ({target})
mail_answered = Letter #{id} got a reply: {summary}
mail_reply_unreadable = (the reply could not be read)
mail_reply_missing = (the reply was not recorded)
mail_target_session = session {id}
mail_target_job = job {id}
reminder_sent = Due reminder sent ({reason})
remind_time = the reminder time you set arrived
remind_park = the park period ended
req_undelivered = Request {request} could not be delivered to session {session}: {error}; falling back to a tidy-up
req_asked = Asked session {session} to {what} (request {request}, reply within {minutes} min)
req_what_report = report
req_what_handoff = write a hand-over
req_answered = The session answered request {request} ({kind})
req_summarize_timeout = Tidy-up request {request} timed out
req_no_response = Session {session} did not answer request {request}; falling back to a tidy-up
suggestion_adopted = Adopted tidy-up suggestion: {field} (from {by})
suggestion_dismissed = Dismissed tidy-up suggestion: {field} (from {by})
completion_todo = todo {ref} is done
completion_issue = issue {ref} is closed
completion_join = {a}; {b}
completion_note = {done}; suggest changing the status to "{label}" (adopt or ignore it in the suggestions of the work item; the status was not changed)
completion_label_review = awaiting review
completion_label_done = done
summary_failed = Tidy-up failed: {error}
summary_done = Tidy-up finished
summary_degraded = {text} (the transcript could not be read; based on the last message and progress)
summary_applied = {text}; updated: {list}
summary_suggested = {text}; suggestions to adopt: {list}
summary_nothing = {text}; nothing new
summary_cleared = {label} (cleared)
summary_list_join = {a}, {b}

[work.ledger]
summarize_interrupted = tidy-up timed out or was interrupted
no_response = the session did not answer
request_timeout = request timed out

[work.request_outcome]
job_session = An ACP / terminal job session cannot be asked to report; talk to it on its job page
session_gone = The session record no longer exists
not_allowed = You may not relay to this session
not_running = The session is not running ({state}); falling back to a tidy-up
no_channel = No session relay channel is configured; falling back to a tidy-up
delivery_failed = Delivery failed ({error}); fell back to a tidy-up

[work.report]
goal = Goal: {value}
blocker = Blocker: {value}
next = Next step: {value}
summary = Summary: {value}
park_note = Park condition: {value}
status_captured = Status: wanted {status} (capture-box item; only the capture box changes its status; not adopted)
status_final = Status: wanted {status} (done / dropped are confirmed by a person; not adopted)
status_unblocked = Status: active (blocker cleared)
status_human = Status: wanted {status} (a status a person set takes precedence; not adopted)
status_set = Status: {status}

[work.derived]
waiting_reply = the session is waiting for a reply
needs_attention = the session needs attention (terminal dialog)
job_interaction = a linked job has an interaction waiting for an answer
job_review = a linked job is awaiting review
running = the session is running
plan_wait = linked plan {plan} has a decision waiting for an answer: {title}

[work.notify]
reported = {by} reported that it needs you
marked_needs_me = marked "needs me" by {by}
steward_marked_needs_me = the steward marked it "needs me"
remind_title = Work item reminder · {title}
needs_me_title = Needs you · {title}
open_item = Open work item
open_work = Open the work page

[work.outcome]
who = job {id}
who_agent = {who} ({agent})
who_title = {who} "{title}"
budget = {who} hit its budget limit
failed = {who} failed
failed_error = {text}: {error}
rejected = {who} was rejected in review
accepted = {who} passed review
done = {who} finished
done_review = {text}, awaiting review
done_commits = {text}, {n} commit(s)
cancelled = {who} was cancelled
ended = {who} ended ({status})

[work.health]
plan_blocked = plan {plan} is blocked
plan_quoted = "{title}"
blocked = blocked: {blocker}
stalled = no activity for {quiet}
job_budget = the latest job {id} hit its budget limit
job_failed = the latest job {id} failed
quiet_days = {n} days
quiet_hours = {n} hours
quiet_minutes = {n} minutes

[work.digest]
title = Work digest · {date}
counts = needs me {needs_me} · waiting on a resource {waiting} · needs me on site {onsite} · awaiting review {review}
parked_head = Parked for more than 7 days ({n}):
yesterday_head = Progress yesterday ({n}):
more = - ... and {n} more
item_status = {link} ({status})
empty = Nothing needs your attention today.
commentary = Steward's comment: {text}

[work.suggestion_label]
goal = goal
blocker = blocker
blocker_kind = blocker type
next = next step
summary = summary
status_hint = status

[work.todo]
next = Next step: {value}
source = Source work item: {id}
