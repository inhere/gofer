# CLI text of `gofer issue` / `memory` / `repo` (phase 2 of
# docs/design/2026-10-27-i18n-design.md). One value per line; the code adds the
# newlines and the leading indentation. zh-CN keeps the text an existing
# deployment printed before the migration.

[cli.issue.stale]
line = {id} [{status}] P{priority} {title} · updated {age}

[cli.memory.flag]
desc = Report a memory as out of date (marks it "⚠ needs review" where it is injected; the rule keeps its full text)

[cli.memory.add]
when_paths = when.paths set to {paths} (use --when-paths '**' for the whole repository; write a workspace-wide memory with --project)

[cli.memory.candidates]
desc = List knowledge candidates: the "Reusable lessons" items of delivered jobs, waiting for accept / reject
paths_label = when.paths
paths_set = when.paths set to {paths} (from the job's cwd)

[cli.memory.synthesis]
desc = Daily memory synthesis runs (read-only; this phase prepares materials and does not call a model)
empty = no memory synthesis runs
line = {id} {day} {project} [{status}] attempt {attempt} digest {digest} checked {checked}
snapshot_kept = material snapshot: kept (scrubbed; see --json)

[cli.memory.synthesis.ls]
desc = List daily memory synthesis runs (metadata only)

[cli.memory.synthesis.show]
desc = Show one daily memory synthesis run

[cli.memory.scope]
basis_head = basis / confidence
below_threshold = skipped {count} weaker suggestions: {keys} (--min-confidence medium writes them too)

[cli.repo.status]
project_key_missing = project_key: not set; fill it in .gofer/tracker/config.yaml

[cli.repo.changelog]
unreleased_flag = comma-separated section titles treated as unreleased (default: Unreleased)

[cli.repo.projectkey]
server_match = project_key: {key} (matched by longest server project path prefix {root})
no_config = project_key: not written (no usable gofer config); fill it in .gofer/tracker/config.yaml
no_match = project_key: no gofer project matched (the directory is under no registered project path, or it is a sibling of several); register it with `gofer project add`, or fill project_key in .gofer/tracker/config.yaml by hand
matched = project_key: {key} (matched by longest path prefix {root})
nested = note: this is a nested independent repository (the outer repository {outer} also lives under project {key}); it belongs to project {key} — register a separate project and change project_key in .gofer/tracker/config.yaml to keep it apart
