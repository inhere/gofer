# Agent-facing and user-visible text the job service writes outside the long
# prompt templates (prompts/): the leader round brief, the comment-dispatch brief,
# the skills / tools prompt sections and the wrap-up reasons. Placeholders are named
# ({name}); a value that starts or ends with a space is quoted. The zh-CN file is the
# verbatim pre-migration text; this is its English rewrite.

[job.leader]
title = Leader round {round}: {title}
intro = You are the leader of plan {plan} (round {round}). A member job has just finished: read its report and decide the next step: dispatch work, advance the todos, set up a wakeup, or escalate to a person.
h_plan = ## Plan
plan_title = Title: {title}
plan_status = Status: {status}
paused = " (paused)"
blocked = " (blocked on {todo})"
plan_goal = Goal: {goal}
h_todos = ## Current todo chain
h_member = ## The member job that just finished
member_gone = (job {job} is no longer in the store; only its status {status} is known)
h_can = ## What you can do (via the gofer CLI; permissions are enforced by your job credential, overreach gets a 403)
can_comments = - `gofer plan comments <plan>`: read the comment threads of the plan / todos / jobs first, to see what people and members have said.
can_comment = - `gofer plan comment <plan> "text"`: speak in the thread; writing `@<agent or role>` in the text **really dispatches work** (you are this plan's leader, so your @mentions take effect). Add `--todo <todo>` to comment on one todo only.
can_show = - `gofer plan show <plan>`: read the plan and the current todos.
can_set_todo = - `gofer plan set-todo <todo> --status ready|skipped`: set a todo to `ready` (dispatches it when it has an assignee) or `skipped`; **only ready|skipped is accepted**, any other status is rejected by the server (403).
can_wakeup = - `gofer job wakeup create <job> --kind at --after 10m` (or `--kind event --event job.terminal`): set up a timed / event wakeup for a job.
can_ask = - `gofer plan ask --plan <plan> --title <title> --question <question>`: when unsure, escalate to a person (non-blocking; after they answer, read the answer with `gofer plan decisions --plan <plan>`).
can_mcp = - If gofer MCP tools are mounted in your environment you can use them to do the same things: they run on the same job credential, so the permissions are exactly those of the CLI above.
h_cannot = ## What you cannot do
cannot_accept = - You **cannot** accept/reject: acceptance is always done by a person; you also cannot mark a todo done directly.
cannot_other = - You cannot change the config, submit new jobs (`gofer job run`), push, or make a final decision for a person.
h_rules = ## Rules
rule_round = - This is round {round}; once the rounds are used up, gofer stops waking leaders and escalates to a person.
rule_human = - As soon as a person speaks in the thread, this round's wakeup is cancelled and the person takes over; do not race their decision.
rule_no_self = - Do not do the work yourself: write the task clearly, then dispatch it to a member with an @mention or by setting the todo to ready.
todos_failed = (failed to read the todos)
todos_empty = (this plan has no todos yet)
todos_count = {n} in total:
todos_more = ...{n} more
todo_assigned = " (assignee: {assignee})"
todo_assigned_after = " (assignee: {assignee}, after: {after})"
todo_after = " (after: {after})"
exhausted_title = Leader rounds used up: {title}
exhausted_question = The leader of plan {plan} has used all its rounds; the latest member job is {job} ({status}). Please take over: keep this plan going, or stop it.

[job.comment]
reject = @{mention} was not dispatched: {detail}
dispatch_intro = You were @-mentioned in a comment to take over some work (gofer comment dispatch).
body_label = Comment text:
untitled = (untitled)
job_head = Commented job: {id} {title}
plan_head = Commented plan: {id} {title}
todo_head = Commented todo: {id} {title} (plan {plan})
status = Status: {status}
job_error = " (error: {error})"
report = Latest report (last {n} lines of stdout):
goal = Goal: {goal}
todos_head = Todos ({n}):
note = Note: {note}

[job.skills]
header = ## Available skills (mounted by gofer, read as needed)
footer = Read the SKILL.md files relevant to this task first, then start working.
desc_sep = ": "

[job.tools]
header = ## Tools available on this machine (injected by gofer, use as needed)
intro_worker = This task runs on worker `{worker}`, where the following tools are installed and can be called directly:
intro_local = The following tools are installed on the machine this task runs on and can be called directly:

[job.wrapup]
max_steps = step limit (the agent wrapped up by itself; the task may be unfinished)
max_tokens = usage limit (the agent wrapped up by itself; the task may be unfinished)
budget = budget exhausted (the agent wrapped up by itself; the task may be unfinished)
timeout = time limit (the agent wrapped up by itself; the task may be unfinished)
other = {reason} (the agent wrapped up by itself; the task may be unfinished)

[job.plan]
checkpoint_title = Checkpoint: {title}
todo_heading = This task

[job.fallback]
resume = The previous run was executed by {agent} and was interrupted by a provider error ({hit}); first check git status / git log for progress, do only the remaining part, do not redo work that is already committed, then report as originally requested.
