# CLI text of `gofer steward` / `work` / `mcp` and the dual-mode error (phase 2
# of docs/design/2026-10-27-i18n-design.md). One value per line; the code adds the
# newlines and the leading indentation. zh-CN keeps the text an existing
# deployment printed before the migration.

[cli.dual]
no_server_config = this box has no server config (run mode={mode}) and connecting to the server failed:

[cli.mcp]
project_auto_unresolved = --project auto: cannot resolve the project from CWD({cwd}) / .gofer.project.yaml / GOFER_PROJECT

[cli.steward.ask]
question_arg = what to ask, e.g. "what is still open on my plate?"
asked_nowait = asked (job {job}); the reply streams in the web steward panel or `gofer job logs {job}`

[cli.steward.status]
state_running = running (working on a round)
state_idle = idle (free to answer)
state_not_started = not_started (it starts on a question or at the review time)
review_summary = summary: {text}
off_note = The steward is off. Enable it and pick an acp-agent on the settings page (Settings → Work → Steward).

[cli.work]
all_flag = include done / dropped items and items merged into another (shown as "merged into <id>"); same set `work rm --status` previews
park_note_arg = condition, e.g. "continue once the parts arrive"
merged_into = (merged into {id})

[cli.doctor]
desc = Collect a privacy-safe diagnostic bundle for support
help = Export only redacted support data; never include prompts, messages or memories.
examples = gofer doctor --bundle --output diagnostics.zip
output_flag = diagnostic zip path (default: ./gofer-diagnostics-<timestamp>.zip)
print_flag = print the file list and summary without creating a zip
bundle_flag = create a zip bundle (default; kept explicit for scripts)
lines_flag = number of recent log lines per log (1..10000)
worker_config_flag = worker config path in worker mode (default: <config-dir>/worker.yaml)
print_required = use --print to list diagnostics without a bundle
lines_invalid = --lines must be between 1 and 10000
summary = gofer diagnostics (prompts, messages, memories and token values excluded)
unavailable = unavailable
created = diagnostic bundle: {path}
contents = contents:

[cli.refs]
desc = List objects that reference an issue, job, plan, todo or workflow
help = The kind is inferred from the id prefix (gofer-, job-, plan-, todo-, wf-). Prints one line per referencing object.
examples = gofer tool refs gofer-abcd
id_arg = id of the object being referenced
bad_id = refs requires an id beginning gofer-, job-, plan-, todo- or wf-
none = no references to {id}

[cli.tool]
desc = Small utilities: a raw API call, file copy to/from a worker, the transfer staging area, certificates and the stats backfill
deliver_desc = Run a delivery plan read from stdin (internal)

[cli.tool.api]
desc = Call the server's HTTP API and print the response (address and token included)
help.p1 = The path is relative to the server's /v1 API, so "jobs" and "/v1/jobs" are the same request. The address and token come from the same place as everywhere else in the CLI (-c / --server / --token, or $GOFER_CONFIG_DIR/.env), so nothing has to be typed twice.
help.p2 = Fields build the body ({json}); on a GET they become query parameters instead. A value is read as JSON when it parses as one (10 → number, true → bool) and as a plain string otherwise:
help.p3 = --query picks one value out of the JSON response by path (top.sub, jobs.0.id, jobs.*.id): a string prints as it is, anything else as indented JSON. A non-2xx answer exits non-zero and prints the body to stderr; --include also shows the status line and the response headers.
help.file_comment = file content as a string
request_flag = HTTP method (default: GET, or POST when a body is given)
field_flag = field as key=value (repeatable; query parameters on a GET)
file_field_flag = field as key=@file, the file's content as the string value (repeatable)
input_flag = raw request body from this file ('-' reads stdin)
query_flag = print this value of the JSON response instead of the whole body
include_flag = print the status line and response headers
path_arg = API path, e.g. jobs or /v1/jobs/abc

[cli.tool.step]
desc = Run a built-in workflow step reading its with: block from stdin (internal)
with_flag = with: block as JSON (default: read stdin)
dir_flag = working directory (default: the current one)
name_arg = built-in step name (push, wait-ci, wait-assets)

[cli.tool.stats_backfill]
desc = Compute the dashboard's per-job metrics for jobs that ended before they were recorded
since_flag = only jobs that ended within this window (e.g. 30d, 12h) or since YYYY-MM-DD; default all
limit_flag = jobs per server batch (1-1000)
force_flag = recompute jobs that already have metrics

[cli.tool.trigger]
desc = Inbound triggers: list and inspect them (redacted), and self-test the external invoke endpoint
none = no triggers are configured on this server
name_arg = trigger name (server.triggers[].name)
name_required = a trigger name is required
ls.desc = List the triggers of the server with their state and newest delivery
ls.header = NAME,OWNER,PROJECT,TEMPLATE,STATE,LAST DELIVERY
state_ready = ready
state_disabled = disabled
state_unavailable = unavailable ({reasons})
show.desc = Show one trigger (redacted: the secret variable name and whether it is set, never its value) and its newest deliveries
show.deliveries_flag = how many of the newest deliveries to list (0 for none)
show.name = {name}  [{state}]
show.target = owner caller: {owner}  project: {project}  template: {template}  provider: {provider}
show.auth = auth: {kind}  secret variable: {env} ({secret})  headers: {ts} / {sig}  replay window: {window}s
show.secret_set = set
show.secret_unset = not set on the server
show.no_dedup_key = none (only Idempotency-Key)
show.dedup = dedup key: {key}  ttl: {ttl}s
show.rate = rate: {per_minute}/min  burst: {burst}  max in flight: {inflight}  (0 = the owner caller's limits only)
show.limits = limits: body {body} bytes  variable {var} bytes
show.issue = unavailable: {reason}
show.deliveries = newest deliveries ({count}):
invoke.desc = Sign a request body and post it to a trigger's invoke endpoint (a self-test; no gofer token is sent)
invoke.help = The body is signed with HMAC-SHA256 over "<timestamp>\n<body>" using the trigger's secret. The secret comes from an environment variable you name (--secret-env) or from the first line of stdin (--secret-stdin); it is never taken from an argument and never printed. The request carries no gofer token: the signature is the credential.
invoke.body_flag = file with the JSON request body ('-' reads stdin)
invoke.id_flag = external event id, sent as the Idempotency-Key header (a repeated id returns the first result)
invoke.secret_env_flag = name of the environment variable that holds the trigger secret
invoke.secret_stdin_flag = read the trigger secret from the first line of stdin
invoke.header_flag = extra request header as Name=Value (repeatable), e.g. a header the trigger's dedup.key or input.vars read
invoke.timestamp_header_flag = name of the timestamp header (auth.timestamp_header of the trigger)
invoke.signature_header_flag = name of the signature header (auth.signature_header of the trigger)
invoke.body_required = --body is required
invoke.secret_source = give the secret from exactly one source: --secret-env <NAME> or --secret-stdin
invoke.stdin_twice = stdin cannot carry both the body and the secret
invoke.secret_read = could not read the secret from stdin
invoke.secret_empty = the secret is empty (the environment variable is unset or stdin was empty)
invoke.bad_header = --header must be Name=Value (got "{header}")
invoke.body_too_large = the body is larger than any trigger accepts ({max} bytes)
invoke.accepted = accepted: trigger {trigger}  job {job}  request {request}
invoke.duplicate = duplicate (known result): trigger {trigger}  job {job}  status {status}  request {request}
