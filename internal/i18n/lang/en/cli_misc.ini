# CLI text of `gofer steward` / `work` / `mcp` and the dual-mode error (phase 2
# of docs/design/2026-10-27-i18n-design.md). One value per line; the code adds the
# newlines and the leading indentation. zh-CN keeps the text an existing
# deployment printed before the migration.

[cli.dual]
no_server_config = this box has no server config (run mode={mode}) and connecting to the server failed:

[cli.mcp]
project_auto_unresolved = --project auto: cannot resolve the project from CWD({cwd}) / .gofer.project.yaml / GOFER_PROJECT

[cli.steward.ask]
question_arg = what to ask, e.g. "what is still open on my plate?"
asked_nowait = asked (job {job}); the reply streams in the web steward panel or `gofer job logs {job}`

[cli.steward.status]
state_running = running (working on a round)
state_idle = idle (free to answer)
state_not_started = not_started (it starts on a question or at the review time)
review_summary = summary: {text}
off_note = The steward is off. Enable it and pick an acp-agent on the settings page (Settings → Work → Steward).

[cli.work]
all_flag = include done / dropped items and items merged into another (shown as "merged into <id>"); same set `work rm --status` previews
park_note_arg = condition, e.g. "continue once the parts arrive"
merged_into = (merged into {id})

[cli.doctor]
desc = Collect a privacy-safe diagnostic bundle for support
help = Export only redacted support data; never include prompts, messages or memories.
examples = gofer doctor --bundle --output diagnostics.zip
output_flag = diagnostic zip path (default: ./gofer-diagnostics-<timestamp>.zip)
print_flag = print the file list and summary without creating a zip
bundle_flag = create a zip bundle (default; kept explicit for scripts)
lines_flag = number of recent log lines per log (1..10000)
worker_config_flag = worker config path in worker mode (default: <config-dir>/worker.yaml)
print_required = use --print to list diagnostics without a bundle
lines_invalid = --lines must be between 1 and 10000
summary = gofer diagnostics (prompts, messages, memories and token values excluded)
unavailable = unavailable
created = diagnostic bundle: {path}
contents = contents:
