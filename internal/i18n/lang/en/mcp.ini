# Short texts of the MCP surface (tool descriptions and the answers an agent gets
# back). Design 2026-10-27-i18n-design.md §4 / §11 (P1d).
#
# A tool description written entirely in English stays in the Go code: it is the same
# text in every language. Only the descriptions / errors that carry language-specific
# wording come from this catalog, and those are whole texts where splitting them would
# make either language ungrammatical.

[mcp.term]
today = Today
as_advised = “Do as advised: X”
adopt = Adopt
dismiss = Dismiss
knowledge_section = “## Reusable lessons”
needs_review = “⚠ needs review (reason)”
leave_to_human = (high risk or unsure, leave it to a person)
relay = Relay
role_mention = @<agent or role>
digest_sections = change groups / risks / tests

[mcp.desc]
brief_issue = Handoff brief of a repository issue — the same text as `gofer issue brief <id>`: the issue, its parent/siblings/deps, design docs that name it, related commits and code entries, linked jobs / plans, applicable memories and takeover hints. Read this first when taking over an issue. Uses the repository tracker of this process's cwd.
brief_plan = Handoff brief of a plan — the same text as `gofer plan brief <id>`: fields, todos (status / deps / acceptance / job outcome), handoff note and a short brief of each issue it names.

[mcp.error]
leader_no_reject = a leader job cannot reject a delivery: accepting is a human's call
project_scope_denied = project-scoped MCP(--project {scope}): cannot submit to project {project}
