# `gofer plan` command text (phase 2 of docs/design/2026-10-27-i18n-design.md).
# One line per value; the code adds line breaks and any leading indent (an INI
# value keeps no leading blanks).

[cli.plan.flag]
no_supervisor = do not bind the current agent session as the plan's supervisor session
check_prompt = delivery-check requirement for the server-side checker (not a shell command); checked after the job ends when server.delivery_check is enabled. --check-prompt "" clears it

[cli.plan.create]
notify_on = notify: the supervisor session is told when a job this plan dispatches ends
bound = bound the supervisor session {session}
bound_named = bound the supervisor session {session} ({name})
bound_hint = a job that ends notifies that session; to stop it: gofer plan set {plan} --clear-supervisor-session (or pass --no-supervisor when creating)
notify_without_supervisor = warning: notify is on but the plan has no supervisor session, so the jobs it dispatches notify nobody (bind one with --supervisor-session-id <sid>)

[cli.plan.set]
supervisor_changed = supervisor session ->

[cli.plan.bind]
none = no supervisor session bound ({reason}bind one: gofer plan set {plan} --supervisor-session-id <sid>, see gofer session ls)

[cli.plan.list]
footer = {total} item(s) in total, showing {from}–{to}

[cli.plan.show]
leader_switch_off = , the global switch is off