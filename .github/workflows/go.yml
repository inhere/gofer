name: Unit-Tests
on:
  pull_request:
    paths:
      - "go.mod"
      - "**.go"
      - "**.yml"
  push:
    branches: # Only trigger branch pushes; tag pushes are ignored.
      - "**"
    paths:
      - "go.mod"
      - "**.go"
      - "**.yml"

jobs:
  test:
    name: Test on go ${{ matrix.go_version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing OS must not cancel the others: the first failure otherwise
      # hides the real results of the remaining platforms (a cancelled job reports
      # the package as FAIL with no test names, which reads like a mystery failure).
      fail-fast: false
      matrix:
        go_version: [1.25, stable]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Go SDK
        uses: actions/setup-go@v7
        timeout-minutes: 3
        with:
          go-version: ${{ matrix.go_version }}

      # Why the windows job is much slower than ubuntu on the same commit: the
      # job/httpapi suites spawn a child process per test (testcmd/git) and create
      # a temp dir + sqlite per test, and this runner has Defender real-time
      # protection on, which scans every new process image and every file written.
      # These two steps record the runner profile before/after the exclusion below
      # so the effect is measurable from the log instead of guessed.
      - name: Windows runner profile (before)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List
          "cpus: $env:NUMBER_OF_PROCESSORS"
          $n = 100
          $sw = [Diagnostics.Stopwatch]::StartNew()
          for ($i = 0; $i -lt $n; $i++) { $p = [Diagnostics.Process]::Start('cmd.exe', '/c exit'); $p.WaitForExit() }
          $sw.Stop()
          "spawn before: {0:N2} ms/child" -f ($sw.Elapsed.TotalMilliseconds / $n)

      - name: "Windows runner: exclude workspace from Defender"
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, (go env GOCACHE), (go env GOMODCACHE), (go env GOROOT))
          foreach ($p in $paths) {
            if ($p -and (Test-Path $p)) {
              Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue
              Write-Host "excluded: $p"
            }
          }
          "exclusions now: " + ((Get-MpPreference).ExclusionPath -join '; ')

      - name: Tidy go mod
        run: go mod tidy

      - name: Run staticcheck
        uses: reviewdog/action-staticcheck@v1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          filter_mode: added
          fail_on_error: true

      - name: Run unit tests
        if: ${{ matrix.os == 'windows-latest' }}
        # -timeout: the 10m default is per test BINARY, and the windows runner
        # (slow process spawn + defender scanning every git/testcmd child) needs
        # more than that for the two heaviest packages (internal/job,
        # internal/httpapi), which are otherwise reported as "panic: test timed
        # out" instead of a real failure.
        run: go test -timeout 20m ./...

      # TEMPORARY diagnostic (remove once the windows slowness is explained):
      # run the heaviest package ALONE and list its slowest tests, so the per-test
      # cost on this runner can be compared with the parallel `go test ./...` run
      # above and with ubuntu.
      - name: "Diagnostic: internal/job alone (temporary)"
        if: ${{ matrix.go_version == '1.25' }}
        shell: bash
        run: |
          go test -count=1 -timeout 20m -v ./internal/job/ > job-alone.log 2>&1 || true
          echo "--- wall clock: $(grep -c '^=== RUN' job-alone.log) tests"
          grep -E '^--- (PASS|FAIL)' job-alone.log \
            | sed -E 's/^--- (PASS|FAIL): ([^ ]+) \(([0-9.]+)s\)/\3 \2/' \
            | sort -rn | head -25
          grep -E '^(ok|FAIL)\s' job-alone.log | tail -2

      - name: Run unit tests with coverage
        if: ${{ matrix.os != 'windows-latest' }}
        run: go test -timeout 20m -cover ./...

      - name: Windows runner profile (after)
        if: ${{ always() && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $n = 100
          $sw = [Diagnostics.Stopwatch]::StartNew()
          for ($i = 0; $i -lt $n; $i++) { $p = [Diagnostics.Process]::Start('cmd.exe', '/c exit'); $p.WaitForExit() }
          $sw.Stop()
          "spawn after: {0:N2} ms/child" -f ($sw.Elapsed.TotalMilliseconds / $n)

      # Race detector is slow (~5-10x) and only supported on linux/amd64, so run
      # it on a single recent-Go + ubuntu job instead of the whole matrix.
      # - name: Run unit tests with race detector
      #   if: ${{ matrix.os == 'ubuntu-latest' && matrix.go_version == 'stable' }}
      #   run: go test -race ./...
