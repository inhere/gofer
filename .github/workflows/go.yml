name: Unit-Tests
on:
  pull_request:
    paths:
      - "go.mod"
      - "**.go"
      - "**.yml"
  push:
    branches: # Only trigger branch pushes; tag pushes are ignored.
      - "**"
    paths:
      - "go.mod"
      - "**.go"
      - "**.yml"

jobs:
  test:
    name: Test on go ${{ matrix.go_version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing OS must not cancel the others: the first failure otherwise
      # hides the real results of the remaining platforms (a cancelled job reports
      # the package as FAIL with no test names, which reads like a mystery failure).
      fail-fast: false
      matrix:
        go_version: [1.25, stable]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Go SDK
        uses: actions/setup-go@v7
        timeout-minutes: 3
        with:
          go-version: ${{ matrix.go_version }}

      # Runner fingerprint, so the windows numbers in this log can be read against
      # something: CPUs and the cost of one child-process creation. Measured on this
      # runner: 4 cpus, RealTimeProtectionEnabled=False, ~7.5 ms per child. That is
      # why no Defender exclusion is configured here — it was measured neutral
      # (7.54 -> 7.57 ms/child, package times unchanged). If the flag ever reports
      # True, add `Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE` and friends.
      - name: Windows runner profile (before)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List
          "cpus: $env:NUMBER_OF_PROCESSORS"
          $n = 100
          $sw = [Diagnostics.Stopwatch]::StartNew()
          for ($i = 0; $i -lt $n; $i++) { $p = [Diagnostics.Process]::Start('cmd.exe', '/c exit'); $p.WaitForExit() }
          $sw.Stop()
          "spawn cost: {0:N2} ms/child" -f ($sw.Elapsed.TotalMilliseconds / $n)

      - name: Tidy go mod
        run: go mod tidy

      - name: Run staticcheck
        uses: reviewdog/action-staticcheck@v1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          filter_mode: added
          fail_on_error: true

      - name: Run unit tests
        if: ${{ matrix.os == 'windows-latest' }}
        # Two measured settings:
        #   -p 2     : the same commit runs internal/job in 488s under the default
        #              -p (4 packages at once on 4 vCPUs) but in 178s when that
        #              package runs alone — the heavy packages (job, httpapi, core,
        #              mcpserver) are dominated by contention, not by their own work,
        #              so overlapping fewer of them is cheaper overall.
        #   -timeout : 10m is the default PER TEST BINARY; internal/job alone already
        #              needs 178s here, and the timeout only exists so a hung test is
        #              reported as a hang rather than as a mystery package failure.
        run: go test -timeout 20m -p 2 ./...

      - name: Run unit tests with coverage
        if: ${{ matrix.os != 'windows-latest' }}
        run: go test -timeout 20m -cover ./...


      # Race detector is slow (~5-10x) and only supported on linux/amd64, so run
      # it on a single recent-Go + ubuntu job instead of the whole matrix.
      # - name: Run unit tests with race detector
      #   if: ${{ matrix.os == 'ubuntu-latest' && matrix.go_version == 'stable' }}
      #   run: go test -race ./...
