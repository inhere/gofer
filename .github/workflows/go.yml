name: Unit-Tests
on:
  pull_request:
    paths:
      - "go.mod"
      - "**.go"
      - "**.yml"
      - ".github/scripts/**"
  push:
    branches: # Only trigger branch pushes; tag pushes are ignored.
      - "**"
    paths:
      - "go.mod"
      - "**.go"
      - "**.yml"
      - ".github/scripts/**"

jobs:
  test:
    name: Test on go ${{ matrix.go_version }} and ${{ matrix.os }}${{ matrix.shards > 1 && format(' ({0}/{1})', matrix.shard, matrix.shards) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing OS must not cancel the others: the first failure otherwise
      # hides the real results of the remaining platforms (a cancelled job reports
      # the package as FAIL with no test names, which reads like a mystery failure).
      fail-fast: false
      # Every package runs on every leg; the shards only decide which runner runs
      # what, assigned by .github/scripts/ci_shard.py from measured package times
      # so the shards of one leg cost about the same. Windows needs the most
      # shards (its runners are the slowest of the three), so it is cut into 6;
      # ubuntu into 2 (one of them also carries the shuffle guard below); macOS
      # stays whole in one job per Go version - macOS runners are the scarcest
      # resource here, so splitting further would only queue longer.
      matrix:
        include:
          - { go_version: "1.26", os: ubuntu-latest, shard: 1, shards: 2 }
          - { go_version: "1.26", os: ubuntu-latest, shard: 2, shards: 2 }
          - { go_version: stable, os: ubuntu-latest, shard: 1, shards: 2 }
          - { go_version: stable, os: ubuntu-latest, shard: 2, shards: 2 }
          - { go_version: "1.26", os: macos-latest, shard: 1, shards: 1 }
          - { go_version: stable, os: macos-latest, shard: 1, shards: 1 }
          - { go_version: "1.26", os: windows-latest, shard: 1, shards: 6 }
          - { go_version: "1.26", os: windows-latest, shard: 2, shards: 6 }
          - { go_version: "1.26", os: windows-latest, shard: 3, shards: 6 }
          - { go_version: "1.26", os: windows-latest, shard: 4, shards: 6 }
          - { go_version: "1.26", os: windows-latest, shard: 5, shards: 6 }
          - { go_version: "1.26", os: windows-latest, shard: 6, shards: 6 }
          - { go_version: stable, os: windows-latest, shard: 1, shards: 6 }
          - { go_version: stable, os: windows-latest, shard: 2, shards: 6 }
          - { go_version: stable, os: windows-latest, shard: 3, shards: 6 }
          - { go_version: stable, os: windows-latest, shard: 4, shards: 6 }
          - { go_version: stable, os: windows-latest, shard: 5, shards: 6 }
          - { go_version: stable, os: windows-latest, shard: 6, shards: 6 }

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Go SDK
        uses: actions/setup-go@v7
        timeout-minutes: 3
        with:
          go-version: ${{ matrix.go_version }}

      # Runner fingerprint, so the windows numbers in this log can be read against
      # something: CPUs and the cost of one child-process creation. Measured on this
      # runner: 4 cpus, RealTimeProtectionEnabled=False, ~7.5 ms per child. That is
      # why no Defender exclusion is configured here — it was measured neutral
      # (7.54 -> 7.57 ms/child, package times unchanged). If the flag ever reports
      # True, add `Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE` and friends.
      - name: Windows runner profile (before)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List
          "cpus: $env:NUMBER_OF_PROCESSORS"
          $n = 100
          $sw = [Diagnostics.Stopwatch]::StartNew()
          for ($i = 0; $i -lt $n; $i++) { $p = [Diagnostics.Process]::Start('cmd.exe', '/c exit'); $p.WaitForExit() }
          $sw.Stop()
          "spawn cost: {0:N2} ms/child" -f ($sw.Elapsed.TotalMilliseconds / $n)

      - name: Tidy go mod
        run: go mod tidy

      # reviewdog/action-staticcheck only runs on the linux runner: on windows-latest
      # and macos-latest it fails before it analyzes anything (every Windows/macOS PR
      # leg went red on it, run 38689331663), so gate the step on the OS as well.
      - name: Run staticcheck
        uses: reviewdog/action-staticcheck@v1
        if: ${{ github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.shard == 1 }}
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          filter_mode: added
          fail_on_error: true

      # Which packages (and, for the few dominating packages, which of their tests)
      # this shard runs is computed from measured per-package times, see the script.
      # `-p 2` on windows: the heavy packages (job, httpapi, core, mcpserver) are
      # dominated by contention rather than by their own work there - internal/job
      # ran in 488s with the default `-p` (4 packages at once on 4 vCPUs) but in
      # 178s alone - so overlapping fewer of them is cheaper overall.
      # `-timeout 20m` is per test binary: internal/job alone already needs over
      # 500s there, and the timeout only exists so a hung test is reported as a
      # hang rather than as a mystery package failure.
      - name: Run unit tests
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          python .github/scripts/ci_shard.py --shard ${{ matrix.shard }} --count ${{ matrix.shards }} -- go test -timeout 20m -p 2

      - name: Run unit tests with coverage
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          python3 .github/scripts/ci_shard.py --shard ${{ matrix.shard }} --count ${{ matrix.shards }} -- go test -timeout 20m -cover

      - name: Run unit tests with coverage
        if: ${{ matrix.os == 'macos-latest' }}
        run: go test -timeout 20m -cover ./...

      # Order guard (gofer-r7am, D class): commands tests share package-level flag
      # structs; a random order exposes any test that leaks state into the next.
      # One ubuntu shard per Go version carries it, as before.
      - name: Run commands tests in shuffled order
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.shard == 1 }}
        run: go test -timeout 20m -shuffle=on ./internal/commands/

      # Race detector is slow (~5-10x) and only supported on linux/amd64, so run
      # it on a single recent-Go + ubuntu job instead of the whole matrix.
      # - name: Run unit tests with race detector
      #   if: ${{ matrix.os == 'ubuntu-latest' && matrix.go_version == 'stable' }}
      #   run: go test -race ./...
